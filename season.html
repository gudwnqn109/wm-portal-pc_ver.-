<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시즌별 매출장</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6.4 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #F7F6F2;
      color: #18181B;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* 커스텀 얇은 스크롤바 (complex.html 동일) */
    .table-container::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    .table-container::-webkit-scrollbar-track {
      background: #F0EEE9;
      border-radius: 4px;
    }
    .table-container::-webkit-scrollbar-thumb {
      background: rgba(113, 113, 122, 0.45);
      border-radius: 4px;
    }
    .table-container::-webkit-scrollbar-thumb:hover {
      background: rgba(113, 113, 122, 0.75);
    }

    /* 뷰 진입 애니메이션 */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-view {
      animation: fadeSlideUp 0.18s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="h-screen flex flex-col p-4 lg:p-5 overflow-hidden select-none">

  <!-- 1. 상단 타이틀 & 실시간 연동 / 단위 배지 -->
  <header class="flex flex-wrap items-center justify-between gap-3 mb-3 shrink-0 animate-view">
    <div class="flex flex-wrap items-center gap-2.5">
      <span id="storeCountBadge" class="px-2 py-0.5 rounded-md bg-[#18181B] text-amber-400 text-[10.5px] font-black tracking-wider">SEASONAL 100</span>
      <h1 id="sheetMainTitle" class="text-[17px] lg:text-[19px] font-extrabold tracking-tight text-[#18181B]">
        ■ 중부영업팀 시즌별 매출 현황 (26.11.1~11.15)
      </h1>
      <button type="button" onclick="loadGoogleSheetData(true)" id="currentSheetLabel"
              class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white border border-[#E6E4DD] hover:bg-[#F0EEE9] text-[11px] font-bold text-zinc-700 transition whitespace-nowrap shadow-2xs"
              title="구글 시트 실시간 동기화">
        <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span id="syncText">실시간 시트 연동</span>
        <i id="refreshIcon" class="fa-solid fa-rotate text-[10px]"></i>
      </button>
    </div>

    <div class="flex items-center gap-2">
      <span class="text-[11px] font-bold text-zinc-500 bg-white border border-[#E6E4DD] px-2.5 py-1 rounded-lg shadow-2xs">
        단위: 천원
      </span>
    </div>
  </header>

  <!-- 2. 컨트롤 & 필터 바 (지점 탭 + 전사 지점 비교 토글 + 매장명 검색) -->
  <section class="bg-white border border-[#E6E4DD] rounded-2xl px-3.5 py-2.5 mb-3 flex flex-wrap items-center justify-between gap-2.5 shrink-0 shadow-[0_1px_4px_rgba(24,24,27,0.03)] animate-view" style="animation-delay: 0.05s;">
    <!-- 좌측: 지점 탭 (중부 전체 -> 서울 -> 경기 -> 강원 순) -->
    <div class="flex flex-wrap items-center gap-1.5">
      <span class="text-[11px] font-extrabold text-zinc-400 mr-0.5">
        <i class="fa-solid fa-building mr-1"></i>지점 선택
      </span>
      <div id="branchFilterTabs" class="flex flex-wrap items-center gap-1"></div>
    </div>

    <!-- 우측: 전사 지점 비교 토글 + 매장명 검색 -->
    <div class="flex flex-wrap items-center gap-2">
      <button id="toggleCompareBtn" type="button" onclick="toggleComparisonRows()"
              class="px-3 py-1.5 rounded-xl text-[11px] font-extrabold bg-[#18181B] text-white transition flex items-center gap-1.5 shadow-2xs">
        <i class="fa-solid fa-compress text-[10px]"></i> 전사 지점 비교 접기
      </button>

      <div class="relative w-44">
        <i class="fa-solid fa-magnifying-glass text-zinc-400 text-[11px] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input id="storeSearchInput" type="text" oninput="handleSearchInput(this.value)" placeholder="매장명 검색..."
               class="w-full bg-[#F7F6F2] border border-[#E6E4DD] focus:border-[#18181B] focus:bg-white rounded-xl pl-8 pr-7 py-1.5 text-xs font-semibold text-[#18181B] placeholder-zinc-400 focus:outline-none transition" />
        <button id="clearSearchBtn" type="button" onclick="clearSearch()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-700 text-xs">
          <i class="fa-solid fa-circle-xmark"></i>
        </button>
      </div>
    </div>
  </section>

  <!-- 3. 메인 스프레드시트 테이블 (20컬럼 전체 헤더 클릭 정렬 지원) -->
  <main class="flex-1 min-h-0 flex flex-col animate-view" style="animation-delay: 0.08s;">
    <div id="tableScrollContainer" class="table-container flex-1 overflow-auto rounded-2xl border border-[#DFDDD4] bg-white shadow-[0_2px_10px_rgba(24,24,27,0.04)] relative select-text">
      <table class="w-full text-[12px] border-collapse min-w-[1520px] tabular-nums">
        <thead id="seasonalTableHead" class="bg-[#18181B] text-white whitespace-nowrap"></thead>
        <tbody id="seasonalTableBody" class="divide-y divide-[#E6E4DD] bg-white"></tbody>
      </table>
    </div>
  </main>

  <!-- 토스트 알림 -->
  <div id="toastBox" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-[#18181B]/95 text-white px-4 py-2.5 rounded-full text-xs font-bold shadow-xl flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none -translate-y-2 whitespace-nowrap">
    <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
    <span id="toastMessage">실적 데이터를 불러오는 중...</span>
  </div>

    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      if (!toast) return;
      document.getElementById('toastMessage').innerText = msg;
      toast.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');

      if (toastTimer) clearTimeout(toastTimer);

    function roundHalfAwayFromZero(n) {
      return Math.sign(n) * Math.round(Math.abs(n));
    }

    function fmtSales(val) {
      if (val === null || val === undefined || val === '-') return '-';

      if (isNaN(n)) return '-';
      const rounded = roundHalfAwayFromZero(n);
      return (rounded === 0 ? 0 : rounded).toLocaleString('ko-KR');
    }

      if (val === null || val === undefined || val === '-') return '-';
      const n = Number(val);

      const pct = roundHalfAwayFromZero(n * 100);
      return (pct === 0 ? 0 : pct) + '%';

    function getGrowthClass(val, isSummaryRow = false, isDarkFooter = false) {
      if (val === null || val === undefined || val === '-') {
        return isDarkFooter ? 'text-zinc-400 font-semibold' : 'text-zinc-400 font-medium';
      }
      const n = Number(val);
      const pct = roundHalfAwayFromZero(n * 100);
      if (isNaN(pct) || pct === 0) {
        return isDarkFooter ? 'text-zinc-400 font-semibold' : 'text-zinc-400 font-medium';
      }
      if (pct > 0) {
        if (isDarkFooter) return 'text-rose-400 font-extrabold';
        return isSummaryRow ? 'text-rose-600 font-extrabold' : 'text-rose-600 font-bold';
      } else {
        if (isDarkFooter) return 'text-sky-400 font-extrabold';
        return isSummaryRow ? 'text-blue-600 font-extrabold' : 'text-blue-600 font-bold';
      }
    }

    // 매출 숫자 색상 (음수 매출 파란색 표기)
    function getSalesClass(val, baseClass = 'text-zinc-800 font-semibold', isDarkFooter = false) {
      if (isDarkFooter) return 'text-white font-extrabold';
      const n = Number(val);
      if (!isNaN(n) && roundHalfAwayFromZero(n) < 0) {
        return 'text-blue-600 font-semibold';
      }
      return baseClass;
    }

    // 겨울 비중 >= 80% 강조 배지
    function renderWinterShareCell(shareVal, isSummary = false, isDarkFooter = false) {
      const pctStr = fmtPercent(shareVal);
      if (isDarkFooter) {
        return `<span class="text-sky-300 font-extrabold">${pctStr}</span>`;
      }
      const pctNum = shareVal !== null && shareVal !== undefined ? roundHalfAwayFromZero(Number(shareVal) * 100) : 0;
      if (!isSummary && pctNum >= 80) {
        return `<span class="inline-block font-extrabold text-sky-900 bg-sky-100/85 border border-sky-300/70 px-1.5 py-0.5 rounded text-[11px] leading-none">${pctStr}</span>`;
      }
      return `<span class="${isSummary ? 'font-extrabold text-amber-950' : 'font-semibold text-zinc-600'}">${pctStr}</span>`;
    }

    function updateMainHeaderTitle() {
      const titleEl = document.getElementById('sheetMainTitle');
      if (titleEl) {
        const prefix = selectedBranch === "중부 전체" ? "중부영업팀" : selectedBranch;
        titleEl.innerText = `■ ${prefix} 시즌별 매출 현황 ${currentPeriodText}`;
      }
      const badgeEl = document.getElementById('storeCountBadge');
      if (badgeEl) {
        badgeEl.innerText = `SEASONAL ${storesDataset.length}`;
      }
    }

    // =========================================================================
    // [구글 스프레드시트 실시간 연동] JSONP (gviz/tq) - complex.html 구조 적용
    // =========================================================================
    function extractSheetId(input) {
      if (!input) return null;
      const match = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (match && match[1]) return match[1];
      if (input.length > 25 && !input.includes('/') && !input.includes('.')) return input.trim();
      return null;
    }

    function extractGid(input) {
      if (!input) return null;
      const match = input.match(/[?#&]gid=([0-9]+)/);
      return (match && match[1]) ? match[1] : null;
    }

    function setSyncSpinning(spinning) {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.toggle('fa-spin', spinning);
    }

    function normalizeBranchName(raw) {
      const s = String(raw || '').replace(/\s+/g, '').trim();
      if (!s) return '';
      if (s === '서울' || s === '서울지점') return '서울지점';
      if (s === '경기' || s === '경기지점') return '경기지점';
      if (s === '강원' || s === '강원지점') return '강원지점';
      return s;
    }

    function normalizeSummaryName(raw) {
      const s = String(raw || '').replace(/\s+/g, '').trim();
      if (!s) return '';
      if (s === '서울' || s === '서울지점' || s === '서울합계') return '서울지점';
      if (s === '경기' || s === '경기지점' || s === '경기합계') return '경기지점';
      if (s === '강원' || s === '강원지점' || s === '강원합계') return '강원지점';
      if (s === '중부' || s === '중부전체' || s === '중부합계' || s === '중부권역' || s === '중부영업팀') return '중부';
      if (s === '부산' || s === '부산지점') return '부산지점';
      if (s === '경남' || s === '경남지점') return '경남지점';
      if (s === '대구' || s === '대구지점') return '대구지점';
      if (s === '대전' || s === '대전지점') return '대전지점';
      if (s === '광주' || s === '광주지점') return '광주지점';
      if (s === '백화점' || s === '백화점팀') return '백화점팀';
      if (s === '전체' || s === '전사' || s === '전사전체' || s === '총계') return '전체';
      return s;
    }

    function buildComputedSummary(storeLabel, targetStores) {
      const sumField = (key) => targetStores.reduce((acc, s) => acc + (Number(s[key]) || 0), 0);
      const sp_sales = sumField('sp_sales');
      const su_sales = sumField('su_sales');
      const fa_sales = sumField('fa_sales');
      const wi_sales = sumField('wi_sales');
      const s4_sales = sumField('4s_sales');
      const y26 = sumField('y26');
      const y25 = sumField('y25');
      const safeShare = (v) => (y26 !== 0 ? v / y26 : 0);

      return {
        store: storeLabel,
        sp_sales, sp_share: safeShare(sp_sales), sp_gr: null,
        su_sales, su_share: safeShare(su_sales), su_gr: null,
        fa_sales, fa_share: safeShare(fa_sales), fa_gr: null,
        wi_sales, wi_share: safeShare(wi_sales), wi_gr: null,
        '4s_sales': s4_sales, '4s_share': safeShare(s4_sales), '4s_gr': null,
        y26, y25,
        tot_gr: y25 > 0 ? (y26 / y25 - 1) : null
      };
    }

    function loadGoogleSheetData(manual = false) {
      isManualSync = manual;
      const sheetId = extractSheetId(GOOGLE_SHEET_URL);
      if (!sheetId) {
        if (manual) showToast("구글 스프레드시트 주소를 확인해주세요.");
        return;
      }

      setSyncSpinning(true);
      const syncDot = document.getElementById('syncDot');
      const syncText = document.getElementById('syncText');
      if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse';
      if (syncText) syncText.innerText = '동기화중';

      const oldScript = document.getElementById('gviz_jsonp_script');
      if (oldScript) oldScript.remove();

      if (jsonpFallbackTimer) clearTimeout(jsonpFallbackTimer);
      jsonpFallbackTimer = setTimeout(() => {
        setSyncSpinning(false);
        if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
        if (syncText) syncText.innerText = '시트 스냅샷 모드';
        if (isManualSync) {
          showToast(`시트 스냅샷 데이터 기준으로 표시 중입니다 (${storesDataset.length}개 매장)`);
        }
      }, 3500);

      // gid 우선 사용, 없을 시 SHEET_NAME("데이터 통합") 사용
      const gid = extractGid(GOOGLE_SHEET_URL);
      let sheetParam = '';
      if (gid) {
        sheetParam = `&gid=${gid}`;
      } else if (SHEET_NAME && SHEET_NAME.trim() !== '') {
        sheetParam = `&sheet=${encodeURIComponent(SHEET_NAME.trim())}`;
      }

      const script = document.createElement('script');
      script.id = 'gviz_jsonp_script';
      script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:handleGoogleSheetJSONP&headers=1${sheetParam}&t=${Date.now()}`;
      script.onerror = function() {
        if (jsonpFallbackTimer) clearTimeout(jsonpFallbackTimer);
        setSyncSpinning(false);
        if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
        if (syncText) syncText.innerText = '시트 스냅샷 모드';
        if (isManualSync) showToast("시트 권한을 확인해주세요. 스냅샷 기준으로 표시합니다.");
      };
      document.body.appendChild(script);

      // 보조 요청: '서울' 탭 상단의 기준 기간 텍스트(예: 26년 11월 실적(11.1~11.15)) 자동 동기화
      loadPeriodMetaFromSheet(sheetId);
    }

    function loadPeriodMetaFromSheet(sheetId) {
      if (!PERIOD_META_SHEET_NAME) return;
      const oldMeta = document.getElementById('gviz_meta_script');
      if (oldMeta) oldMeta.remove();
      const metaScript = document.createElement('script');
      metaScript.id = 'gviz_meta_script';
      metaScript.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:handlePeriodMetaJSONP&sheet=${encodeURIComponent(PERIOD_META_SHEET_NAME)}&tq=${encodeURIComponent('select A,B,C,D limit 3')}&t=${Date.now()}`;
      document.body.appendChild(metaScript);
    }

    window.handlePeriodMetaJSONP = function(response) {
      try {
        if (!response || !response.table) return;
        const texts = [];
        (response.table.cols || []).forEach(c => { if (c && c.label) texts.push(String(c.label)); });
        (response.table.rows || []).forEach(r => {
          (r.c || []).forEach(cell => {
            if (cell && (cell.f || cell.v)) texts.push(String(cell.f || cell.v));
          });
        });

        // Row 2의 "26년 11월 실적(11.1~11.15)" 형태 우선 탐색
        let extracted = null;
        for (const t of texts) {
          const clean = t.replace(/\s+/g, ' ').trim();
          const m = clean.match(/(\d{2})년\s*\d{1,2}월\s*실적\s*\(([^)]+)\)/);
          if (m) {
            const yy = m[1];
            const range = m[2].trim();
            extracted = range.startsWith(`${yy}.`) ? `(${range})` : `(${yy}.${range})`;
            if (!clean.includes('시즌별')) break; // 2행 공식 실적 기간 우선 채택
          }
        }
        if (extracted) {
          currentPeriodText = extracted;
          updateMainHeaderTitle();
        }
      } catch (e) {
        // 기간 메타 동기화 실패 시 기본값 유지
      }
    };

    // '데이터 통합' 시트 컬럼 인덱스 자동 매핑 (기본 A~U: 0~20)
    function detectColumnMap(cols) {
      const map = {
        branch: 0, rank: 1, store: 2,
        sp_sales: 3, sp_share: 4, sp_gr: 5,
        su_sales: 6, su_share: 7, su_gr: 8,
        fa_sales: 9, fa_share: 10, fa_gr: 11,
        wi_sales: 12, wi_share: 13, wi_gr: 14,
        '4s_sales': 15, '4s_share': 16, '4s_gr': 17,
        y26: 18, y25: 19, tot_gr: 20
      };
      if (!Array.isArray(cols) || cols.length === 0) return map;

      cols.forEach((c, idx) => {
        const label = String(c?.label || '').replace(/\s+/g, '');
        if (!label) return;
        if (label === '지점') map.branch = idx;
        else if (label === '순위') map.rank = idx;
        else if (label === '매장명') map.store = idx;
        else if (label.includes('봄') && label.includes('매출')) map.sp_sales = idx;
        else if (label.includes('봄') && label.includes('비중')) map.sp_share = idx;
        else if (label.includes('봄') && label.includes('신장')) map.sp_gr = idx;
        else if (label.includes('여름') && label.includes('매출')) map.su_sales = idx;
        else if (label.includes('여름') && label.includes('비중')) map.su_share = idx;
        else if (label.includes('여름') && label.includes('신장')) map.su_gr = idx;
        else if (label.includes('가을') && label.includes('매출')) map.fa_sales = idx;
        else if (label.includes('가을') && label.includes('비중')) map.fa_share = idx;
        else if (label.includes('가을') && label.includes('신장')) map.fa_gr = idx;
        else if (label.includes('겨울') && label.includes('매출')) map.wi_sales = idx;
        else if (label.includes('겨울') && label.includes('비중')) map.wi_share = idx;
        else if (label.includes('겨울') && label.includes('신장')) map.wi_gr = idx;
        else if (label.includes('사계절') && label.includes('매출')) map['4s_sales'] = idx;
        else if (label.includes('사계절') && label.includes('비중')) map['4s_share'] = idx;
        else if (label.includes('사계절') && label.includes('신장')) map['4s_gr'] = idx;
        else if (label.includes('26년')) map.y26 = idx;
        else if (label.includes('25년')) map.y25 = idx;
        else if (label.includes('전체') && label.includes('신장')) map.tot_gr = idx;
      });

      return map;
    }

    window.handleGoogleSheetJSONP = function(response) {
      if (jsonpFallbackTimer) clearTimeout(jsonpFallbackTimer);
      setSyncSpinning(false);

      const syncDot = document.getElementById('syncDot');
      const syncText = document.getElementById('syncText');

      try {
        if (!response || !response.table || !Array.isArray(response.table.rows)) {
          if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
          if (syncText) syncText.innerText = '시트 스냅샷 모드';
          return;
        }

        const cols = response.table.cols || [];
        const rows = response.table.rows || [];
        const colMap = detectColumnMap(cols);

        const getCell = (cells, idx) => (cells && cells[idx]) ? cells[idx] : null;
        const getStr = (cells, idx) => {
          const c = getCell(cells, idx);
          if (!c) return '';
          if (c.f !== undefined && c.f !== null && String(c.f).trim() !== '') return String(c.f).trim();
          if (c.v !== undefined && c.v !== null) return String(c.v).trim();
          return '';
        };
        const parseRankCell = (cells, idx) => {
          const c = getCell(cells, idx);
          if (!c || c.v === null || c.v === undefined) return null;
          if (typeof c.v === 'number' && !isNaN(c.v)) return Math.round(c.v);
          const s = String(c.f ?? c.v ?? '').trim();
          return /^\d+$/.test(s) ? parseInt(s, 10) : null;
        };
        const parseSalesCell = (cells, idx) => {
          const c = getCell(cells, idx);
          if (!c || (c.v === null && (c.f === undefined || c.f === null))) return 0;
          const fStr = (c.f !== undefined && c.f !== null) ? String(c.f).trim() : '';
          const vStr = (c.v !== undefined && c.v !== null) ? String(c.v).trim() : '';
          const displayStr = fStr || vStr;
          if (displayStr === '' || displayStr === '-' || displayStr.startsWith('#')) return 0;
          if (typeof c.v === 'number') return isNaN(c.v) ? 0 : c.v;
          const num = parseFloat(displayStr.replace(/,/g, '').trim());
          return isNaN(num) ? 0 : num;
        };
        const parseRateCell = (cells, idx) => {
          const c = getCell(cells, idx);
          if (!c || (c.v === null && (c.f === undefined || c.f === null))) return null;
          const fStr = (c.f !== undefined && c.f !== null) ? String(c.f).trim() : '';
          const vStr = (c.v !== undefined && c.v !== null) ? String(c.v).trim() : '';
          const displayStr = fStr || vStr;
          if (displayStr === '' || displayStr === '-' || displayStr.startsWith('#')) return null;
          if (typeof c.v === 'number') return isNaN(c.v) ? null : c.v;
          if (displayStr.includes('%')) {
            const num = parseFloat(displayStr.replace(/,/g, '').replace('%', '').trim());
            return isNaN(num) ? null : num / 100;
          }
          const num = parseFloat(displayStr.replace(/,/g, '').trim());
          return isNaN(num) ? null : num;
        };

        const parsedStores = [];
        const seenStoreKeys = new Set();
        const summaryMap = new Map();
        const subtotalMap = new Map();

        for (let i = 0; i < rows.length; i++) {
          const cells = rows[i].c || [];
          const rawBranch = getStr(cells, colMap.branch);
          const rawRankStr = getStr(cells, colMap.rank);
          const rankNum = parseRankCell(cells, colMap.rank);
          const rawStore = getStr(cells, colMap.store);

          const branchClean = rawBranch.replace(/\s+/g, '');
          const storeClean = rawStore.replace(/\s+/g, '');
          const rankClean = rawRankStr.replace(/\s+/g, '');

          // 헤더 반복 행 및 공백/오류 행 스킵
          if (
            branchClean === '지점' ||
            storeClean === '매장명' ||
            rankClean === '순위' ||
            (storeClean === '' && rankClean === '') ||
            storeClean.startsWith('#')
          ) {
            continue;
          }

          const metrics = {
            sp_sales: parseSalesCell(cells, colMap.sp_sales),
            sp_share: parseRateCell(cells, colMap.sp_share),
            sp_gr:    parseRateCell(cells, colMap.sp_gr),
            su_sales: parseSalesCell(cells, colMap.su_sales),
            su_share: parseRateCell(cells, colMap.su_share),
            su_gr:    parseRateCell(cells, colMap.su_gr),
            fa_sales: parseSalesCell(cells, colMap.fa_sales),
            fa_share: parseRateCell(cells, colMap.fa_share),
            fa_gr:    parseRateCell(cells, colMap.fa_gr),
            wi_sales: parseSalesCell(cells, colMap.wi_sales),
            wi_share: parseRateCell(cells, colMap.wi_share),
            wi_gr:    parseRateCell(cells, colMap.wi_gr),
            '4s_sales': parseSalesCell(cells, colMap['4s_sales']),
            '4s_share': parseRateCell(cells, colMap['4s_share']),
            '4s_gr':    parseRateCell(cells, colMap['4s_gr']),
            y26:    parseSalesCell(cells, colMap.y26),
            y25:    parseSalesCell(cells, colMap.y25),
            tot_gr: parseRateCell(cells, colMap.tot_gr)
          };

          const normBranch = normalizeBranchName(rawBranch);
          const normSummary = normalizeSummaryName(rawStore);
          const isSubtotalRow = (
            storeClean === '합계' || storeClean === '소계' ||
            rankClean === '합계' || rankClean === '소계'
          );
          const isSummaryBranchTag = [
            '비교', '전사', '전사비교', '요약', '합계', '전체', '지점비교', '지점합계', '전사지점', '권역'
          ].includes(branchClean);

          // 1) 지점별 소계('합계') 행 처리
          if (isSubtotalRow) {
            if (['서울지점', '경기지점', '강원지점'].includes(normBranch) && !subtotalMap.has(normBranch)) {
              subtotalMap.set(normBranch, { store: normBranch, ...metrics });
            }
            continue;
          }

          // 2) 전사 지점 비교 / 중부 / 전체 요약 행 처리 (중복 자동 제거)
          if (SUMMARY_NAME_SET.has(normSummary) || isSummaryBranchTag) {
            if (normSummary && !summaryMap.has(normSummary)) {
              summaryMap.set(normSummary, { store: normSummary, ...metrics });
            }
            continue;
          }

          // 3) 서울/경기/강원 개별 매장 행 처리
          if (['서울지점', '경기지점', '강원지점'].includes(normBranch) && rawStore) {
            const hasAnyNumber = (
              Math.abs(metrics.y26) > 0 || Math.abs(metrics.y25) > 0 ||
              Math.abs(metrics.sp_sales) > 0 || Math.abs(metrics.su_sales) > 0 ||
              Math.abs(metrics.fa_sales) > 0 || Math.abs(metrics.wi_sales) > 0 ||
              Math.abs(metrics['4s_sales']) > 0
            );
            if (rankNum === null && !hasAnyNumber) continue;

            const dedupKey = `${normBranch}__${rawStore}`;
            if (!seenStoreKeys.has(dedupKey)) {
              seenStoreKeys.add(dedupKey);
              parsedStores.push({
                branch: normBranch,
                rank: rankNum,
                store: rawStore,
                ...metrics
              });
            }
          }
        }

        if (parsedStores.length > 0) {
          // 순위 누락 매장이 있을 경우 지점별 26년 매출 내림차순으로 자동 순위 부여
          ['서울지점', '경기지점', '강원지점'].forEach(br => {
            const brList = parsedStores.filter(s => s.branch === br);
            if (brList.some(s => s.rank === null)) {
              brList.sort((a, b) => b.y26 - a.y26);
              brList.forEach((s, idx) => { s.rank = idx + 1; });
            }
          });

          // 요약 테이블 조립 (시트 전사비교 행 우선 -> 지점 소계 행 -> 매장 합산 자동계산)
          ['서울지점', '경기지점', '강원지점'].forEach(br => {
            if (!summaryMap.has(br)) {
              if (subtotalMap.has(br)) {
                summaryMap.set(br, subtotalMap.get(br));
              } else {
                const brStores = parsedStores.filter(s => s.branch === br);
                summaryMap.set(br, buildComputedSummary(br, brStores));
              }
            }
          });
          if (!summaryMap.has('중부')) {
            summaryMap.set('중부', buildComputedSummary('중부', parsedStores));
          }

          const orderedSummaries = [];
          SUMMARY_CANONICAL_ORDER.forEach(name => {
            if (summaryMap.has(name)) orderedSummaries.push(summaryMap.get(name));
          });
          // 표준 11개 외 추가 비교 지점이 있을 경우 '전체' 바로 위에 삽입
          summaryMap.forEach((val, key) => {
            if (!SUMMARY_NAME_SET.has(key)) {
              const totalIdx = orderedSummaries.findIndex(item => item.store === '전체');
              if (totalIdx >= 0) orderedSummaries.splice(totalIdx, 0, val);
              else orderedSummaries.push(val);
            }
          });

          storesDataset = parsedStores;
          if (orderedSummaries.length > 0) {
            summaryDataset = orderedSummaries;
          }

          updateMainHeaderTitle();
          renderBranchTabs();
          renderTableHeader();
          renderTableBody();

          }
        } else {

        }
      } catch (err) {

        if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
        if (syncText) syncText.innerText = '시트 스냅샷 모드';

      if (sortColumn !== colKey) {
        return `<i class="fa-solid fa-sort text-[9.5px] text-zinc-500 group-hover:text-zinc-300 ml-1 transition-colors"></i>`;
      }
      if (sortDirection === 'asc') {
        return `<i class="fa-solid fa-sort-up text-[10.5px] text-amber-400 ml-1"></i>`;
      }
      return `<i class="fa-solid fa-sort-down text-[10.5px] text-amber-400 ml-1"></i>`;
    }

    function getSubThClass(colKey, baseBg, defaultTextClass, widthClass, extraBorder = 'border-r border-zinc-700') {
      const isActive = sortColumn === colKey;

      const activeRing = isActive ? 'shadow-[inset_0_-2px_0_0_#FBBF24]' : '';
      return `sticky top-9 z-20 ${baseBg} border-b ${extraBorder} px-2 ${textStyle} ${widthClass} cursor-pointer select-none group hover:bg-zinc-700/80 transition-colors ${activeRing}`;
    }

          <th onclick="toggleSort('fa_gr')"    class="${getSubThClass('fa_gr',    'bg-[#27272A]', 'text-orange-300', 'w-[72px]')} text-right">신장율${renderSortIcon('fa_gr')}</th>

          <th onclick="toggleSort('4s_share')" class="${getSubThClass('4s_share', 'bg-[#27272A]', 'text-zinc-300', 'w-[60px]')} text-right">비중${renderSortIcon('4s_share')}</th>

    function toggleSort(colKey) {
      if (sortColumn === colKey) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        sortColumn = colKey;
        sortDirection = (colKey === 'rank' || colKey === 'store') ? 'asc' : 'desc';
      }
      renderTableHeader();
      renderTableBody();
    }

    // =========================================================================
    // 지점 탭 & 데이터 필터/정렬/테이블 본문 렌더링
    // =========================================================================
    function renderBranchTabs() {
      const totalCnt = storesDataset.length;
      const seoulCnt = storesDataset.filter(s => s.branch === "서울지점").length;
      const gyeonggiCnt = storesDataset.filter(s => s.branch === "경기지점").length;
      const gangwonCnt = storesDataset.filter(s => s.branch === "강원지점").length;

      const tabs = [
        { key: "중부 전체", label: "중부 전체", count: totalCnt },
        { key: "서울지점",  label: "서울지점",  count: seoulCnt },
        { key: "경기지점",  label: "경기지점",  count: gyeonggiCnt },
        { key: "강원지점",  label: "강원지점",  count: gangwonCnt }
      ];

      const container = document.getElementById('branchFilterTabs');
      container.innerHTML = tabs.map(t => {
        const active = selectedBranch === t.key;
        return `
          <button type="button" onclick="setBranchFilter('${t.key}')"
                  class="px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 ${active ? 'bg-[#18181B] text-white font-extrabold shadow-2xs' : 'bg-[#F7F6F2] text-zinc-600 hover:text-[#18181B] hover:bg-[#F0EEE9] border border-[#E6E4DD] font-bold'}">
            <span>${t.label}</span>
            <span class="px-1.5 py-0.2 rounded-full text-[10px] ${active ? 'bg-amber-400 text-zinc-950 font-black' : 'bg-zinc-200/80 text-zinc-600 font-bold'}">${t.count}</span>
          </button>
        `;
      }).join('');
    }

    function getActiveSummaryRow() {
      const targetName = selectedBranch === "중부 전체" ? "중부" : selectedBranch;
      return summaryDataset.find(r => r.store === targetName) || summaryDataset[0];
    }

    function getPreparedStores() {
      let list = [];
      if (selectedBranch === "중부 전체") {
        list = storesDataset.map(item => ({ ...item }));
        list.sort((a, b) => b.y26 - a.y26);
        list.forEach((item, idx) => {
          item.rank = idx + 1;
        });
      } else {
        list = storesDataset
          .filter(item => item.branch === selectedBranch)
          .map(item => ({ ...item }));
      }

      const q = searchQuery.trim().toLowerCase();
      if (q) {
        list = list.filter(s =>
          s.store.toLowerCase().includes(q) ||
          s.branch.toLowerCase().includes(q)
        );
      }

      list.sort((a, b) => {
        const valA = a[sortColumn];
        const valB = b[sortColumn];

        const isNullA = valA === null || valA === undefined || valA === '-' || (typeof valA === 'number' && isNaN(valA));
        const isNullB = valB === null || valB === undefined || valB === '-' || (typeof valB === 'number' && isNaN(valB));

        if (isNullA && isNullB) return a.rank - b.rank;
        if (isNullA) return 1;
        if (isNullB) return -1;

        if (typeof valA === 'string' && typeof valB === 'string') {
          const cmp = valA.localeCompare(valB, 'ko');
          if (cmp === 0) return a.rank - b.rank;
          return sortDirection === 'asc' ? cmp : -cmp;
        }

        const diff = Number(valA) - Number(valB);
        if (diff === 0) return a.rank - b.rank;
        return sortDirection === 'asc' ? diff : -diff;
      });

      return list;
    }

    function getBranchShortBadge(branchName) {
      if (branchName === "서울지점") return '<span class="text-[9.5px] font-extrabold px-1.5 py-0.5 rounded bg-zinc-100 text-zinc-600 border border-zinc-200 leading-none">서울</span>';
      if (branchName === "경기지점") return '<span class="text-[9.5px] font-extrabold px-1.5 py-0.5 rounded bg-amber-500/12 text-amber-800 border border-amber-500/20 leading-none">경기</span>';
      if (branchName === "강원지점") return '<span class="text-[9.5px] font-extrabold px-1.5 py-0.5 rounded bg-emerald-500/12 text-emerald-800 border border-emerald-500/20 leading-none">강원</span>';
      return '';
    }

    function renderSeasonCells(rowObj, prefix, options = {}) {
      const {
        tdBg = '',
        isSummary = false,
        isDarkFooter = false,
        isWinter = false
      } = options;

      const salesVal = rowObj[`${prefix}_sales`];
      const shareVal = rowObj[`${prefix}_share`];
      const grVal    = rowObj[`${prefix}_gr`];

      const salesColor = isSummary
        ? getSalesClass(salesVal, 'font-extrabold text-amber-950', isDarkFooter)
        : getSalesClass(salesVal, 'font-semibold text-zinc-800', isDarkFooter);

      const shareHtml = isWinter
        ? renderWinterShareCell(shareVal, isSummary, isDarkFooter)
        : `<span class="${isDarkFooter ? 'text-zinc-300 font-bold' : isSummary ? 'font-extrabold text-amber-950' : 'font-medium text-zinc-500'}">${fmtPercent(shareVal)}</span>`;

      const growthColor = getGrowthClass(grVal, isSummary, isDarkFooter);
      const borderCol = isDarkFooter ? 'border-zinc-700' : 'border-[#E6E4DD]';

      return `
        <td class="border-r ${borderCol} px-2.5 py-2 text-right whitespace-nowrap ${tdBg} ${salesColor}">${fmtSales(salesVal)}</td>
        <td class="border-r ${borderCol} px-2 py-2 text-right whitespace-nowrap ${tdBg}">${shareHtml}</td>
        <td class="border-r ${borderCol} px-2 py-2 text-right whitespace-nowrap ${tdBg} ${growthColor}">${fmtPercent(grVal)}</td>
      `;
    }

    function renderTotalCells(rowObj, options = {}) {
      const {
        tdBg = 'bg-amber-50/25',
        isSummary = false,
        isDarkFooter = false
      } = options;

      const y26Val = rowObj.y26;
      const y25Val = rowObj.y25;
      const grVal  = rowObj.tot_gr;

      const y26Color = isDarkFooter
        ? 'text-amber-300 font-extrabold'
        : isSummary
          ? 'text-amber-950 font-extrabold'
          : getSalesClass(y26Val, 'text-[#18181B] font-extrabold', false);

      const y25Color = isDarkFooter
        ? 'text-zinc-300 font-bold'
        : isSummary
          ? 'text-amber-900 font-bold'
          : 'text-zinc-500 font-medium';

      const growthColor = getGrowthClass(grVal, isSummary, isDarkFooter);
      const borderCol = isDarkFooter ? 'border-zinc-700' : 'border-[#E6E4DD]';

      return `
        <td class="border-r ${borderCol} px-2.5 py-2 text-right whitespace-nowrap ${tdBg} ${y26Color}">${fmtSales(y26Val)}</td>
        <td class="border-r ${borderCol} px-2.5 py-2 text-right whitespace-nowrap ${tdBg} ${y25Color}">${fmtSales(y25Val)}</td>
        <td class="px-2 py-2 text-right whitespace-nowrap ${tdBg} ${growthColor}">${fmtPercent(grVal)}</td>
      `;
    }

    function renderTableBody() {
      const stores = getPreparedStores();
      const tbody = document.getElementById('seasonalTableBody');
      const rowsHtml = [];

      if (stores.length === 0) {
        rowsHtml.push(`

                ${st.rank}
              </td>
              <td class="sticky left-[58px] z-10 w-[150px] min-w-[150px] bg-white group-hover:bg-zinc-50 border-r border-[#E6E4DD] px-3 py-2 text-left whitespace-nowrap shadow-[2px_0_5px_-2px_rgba(0,0,0,0.07)] transition-colors">

                  <span class="font-extrabold text-[12.5px] text-[#18181B] group-hover:text-amber-600 transition-colors">${st.store}</span>
                  ${isAllMode ? getBranchShortBadge(st.branch) : ''}
                </div>
              </td>
              ${renderSeasonCells(st, 'sp')}
              ${renderSeasonCells(st, 'su')}
              ${renderSeasonCells(st, 'fa')}
              ${renderSeasonCells(st, 'wi', { tdBg: 'bg-sky-50/25', isWinter: true })}
              ${renderSeasonCells(st, '4s')}
              ${renderTotalCells(st, { tdBg: 'bg-amber-50/25' })}
            </tr>
          `);
        });
      }

      // 1. 선택 지점 소계 ('합계') 행
      const activeSum = getActiveSummaryRow();
      if (activeSum) {
        const branchLabelBadge = selectedBranch === "중부 전체" ? `중부 ${storesDataset.length}점` : selectedBranch;

            ${renderSeasonCells(activeSum, 'fa', { tdBg: 'bg-[#FFFBEB]', isSummary: true })}
            ${renderSeasonCells(activeSum, 'wi', { tdBg: 'bg-amber-100/45', isSummary: true, isWinter: true })}
            ${renderSeasonCells(activeSum, '4s', { tdBg: 'bg-[#FFFBEB]', isSummary: true })}
            ${renderTotalCells(activeSum, { tdBg: 'bg-amber-100/60', isSummary: true })}
          </tr>
        `);
      }

      // 2. 전사 지점 및 전국 합계 비교 행
      if (showComparison) {
        summaryDataset.forEach(item => {
          const isJungbu = item.store === "중부";
          const isGrand  = item.store === "전체";
          const isCurrentSelectedBranch = item.store === selectedBranch || (selectedBranch === "중부 전체" && isJungbu);

          if (isGrand) {
            rowsHtml.push(`

                  <span class="font-black text-[12.5px] text-amber-300">전체</span>
                </td>
                ${renderSeasonCells(item, 'sp', { tdBg: 'bg-[#18181B]', isSummary: true, isDarkFooter: true })}
                ${renderSeasonCells(item, 'su', { tdBg: 'bg-[#18181B]', isSummary: true, isDarkFooter: true })}

              <tr class="bg-amber-100/75 font-extrabold text-amber-950 border-y border-amber-300/80">

                    <span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-900">소계</span>
                  </div>
                </td>
                ${renderSeasonCells(item, 'sp', { tdBg: 'bg-amber-100/75', isSummary: true })}
                ${renderSeasonCells(item, 'su', { tdBg: 'bg-amber-100/75', isSummary: true })}
                ${renderSeasonCells(item, 'fa', { tdBg: 'bg-amber-100/75', isSummary: true })}
                ${renderSeasonCells(item, 'wi', { tdBg: 'bg-amber-200/45', isSummary: true, isWinter: true })}
                ${renderSeasonCells(item, '4s', { tdBg: 'bg-amber-100/75', isSummary: true })}
                ${renderTotalCells(item, { tdBg: 'bg-amber-200/55', isSummary: true })}
              </tr>
            `);
          } else {
            const rowBg = isCurrentSelectedBranch ? 'bg-amber-50/50' : 'bg-zinc-50/75 hover:bg-zinc-100/80';
            const stickyBg = isCurrentSelectedBranch ? 'bg-[#FFFBEB]' : 'bg-[#FAFAFA]';
            rowsHtml.push(`
              <tr class="${rowBg} transition-colors border-b border-[#E6E4DD]">
                <td class="sticky left-0 z-10 w-[58px] min-w-[58px] ${stickyBg} border-r border-[#E6E4DD] px-2 py-2 text-center text-[10px] font-bold text-zinc-400 whitespace-nowrap">
                  비교
                </td>
                <td class="sticky left-[58px] z-10 w-[150px] min-w-[150px] ${stickyBg} border-r border-[#E6E4DD] px-3 py-2 text-left whitespace-nowrap shadow-[2px_0_5px_-2px_rgba(0,0,0,0.06)]">
                  <div class="flex items-center justify-between gap-1">
                    <span class="font-bold text-[12px] ${isCurrentSelectedBranch ? 'text-amber-900 font-extrabold' : 'text-zinc-700'}">${item.store}</span>
                    ${isCurrentSelectedBranch ? '<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>' : ''}
                  </div>
                </td>
                ${renderSeasonCells(item, 'sp')}
                ${renderSeasonCells(item, 'su')}
                ${renderSeasonCells(item, 'fa')}
                ${renderSeasonCells(item, 'wi', { tdBg: 'bg-sky-50/20', isWinter: true })}
                ${renderSeasonCells(item, '4s')}
                ${renderTotalCells(item, { tdBg: 'bg-amber-50/25' })}
              </tr>
            `);
          }
        });
      }

      tbody.innerHTML = rowsHtml.join('');
    }

    // =========================================================================
    // 사용자 인터랙션 핸들러
    // =========================================================================
    function setBranchFilter(branchKey) {
      selectedBranch = branchKey;
      updateMainHeaderTitle();
      renderBranchTabs();
      renderTableBody();

      const scrollBox = document.getElementById('tableScrollContainer');
      if (scrollBox) scrollBox.scrollTop = 0;
    }

    function toggleComparisonRows() {
      showComparison = !showComparison;
      const btn = document.getElementById('toggleCompareBtn');
      if (btn) {
        if (showComparison) {
          btn.innerHTML = `<i class="fa-solid fa-compress text-[10px]"></i> 전사 지점 비교 접기`;
          btn.className = 'px-3 py-1.5 rounded-xl text-[11px] font-extrabold bg-[#18181B] text-white transition flex items-center gap-1.5 shadow-2xs';
        } else {
          btn.innerHTML = `<i class="fa-solid fa-expand text-[10px]"></i> 전사 지점 비교 펼치기`;
          btn.className = 'px-3 py-1.5 rounded-xl text-[11px] font-bold text-zinc-600 bg-white hover:text-[#18181B] hover:bg-[#F0EEE9] border border-[#E6E4DD] transition flex items-center gap-1.5 shadow-2xs';
        }
      }
      renderTableBody();
    }

    function handleSearchInput(val) {
      searchQuery = val || '';
      const clearBtn = document.getElementById('clearSearchBtn');
      if (clearBtn) {
        clearBtn.classList.toggle('hidden', searchQuery.trim().length === 0);
      }
      renderTableBody();
    }

    function clearSearch() {
      const input = document.getElementById('storeSearchInput');
      if (input) input.value = '';
      handleSearchInput('');
    }

    // 초기 구동
    window.addEventListener('DOMContentLoaded', () => {
      updateMainHeaderTitle();
      renderBranchTabs();
      renderTableHeader();
      renderTableBody();
      loadGoogleSheetData(false);
    });
  </script>
</body>
</html>
