<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6.4 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #F7F6F2;
      color: #18181B;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* 커스텀 얇은 스크롤바 (season.html 동일 디자인 토큰) */
    .table-container::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    .table-container::-webkit-scrollbar-track {
      background: #F0EEE9;
      border-radius: 4px;
    }
    .table-container::-webkit-scrollbar-thumb {
      background: rgba(113, 113, 122, 0.45);
      border-radius: 4px;
    }
    .table-container::-webkit-scrollbar-thumb:hover {
      background: rgba(113, 113, 122, 0.75);
    }

    /* 뷰 진입 애니메이션 */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-view {
      animation: fadeSlideUp 0.18s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen lg:h-screen flex flex-col p-3.5 sm:p-4 lg:p-5 lg:overflow-hidden select-none">

  <!-- 1. 상단 타이틀 & 실시간 시트 연동 / 단위 배지 -->
  <header class="flex flex-wrap items-center justify-between gap-2.5 mb-3 shrink-0 animate-view">
    <div class="flex flex-wrap items-center gap-2 sm:gap-2.5">
      <span id="storeCountBadge" class="px-2 py-0.5 rounded-md bg-[#18181B] text-amber-400 text-[10.5px] font-black tracking-wider">RENEWAL 34</span>
      <h1 id="sheetMainTitle" class="text-[16px] sm:text-[18px] lg:text-[19px] font-extrabold tracking-tight text-[#18181B]">
        ■ 중부영업팀 점정비점 매출 현황 (26.1.1~11.15)
      </h1>
      <button type="button" onclick="loadGoogleSheetData(true)" id="currentSheetLabel"
              class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white border border-[#E6E4DD] hover:bg-[#F0EEE9] text-[11px] font-bold text-zinc-700 transition whitespace-nowrap shadow-2xs cursor-pointer"
              title="구글 시트 실시간 동기화">
        <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span id="syncText">실시간 시트 연동</span>
        <i id="refreshIcon" class="fa-solid fa-rotate text-[10px]"></i>
      </button>
    </div>

    <div class="flex items-center gap-2">
      <span class="hidden sm:inline-flex items-center gap-1.5 text-[11px] font-semibold text-zinc-500 bg-white border border-[#E6E4DD] px-2.5 py-1 rounded-lg shadow-2xs">
        <span class="text-rose-600 font-bold">▲ 신장</span>
        <span class="text-zinc-300">|</span>
        <span class="text-blue-600 font-bold">▼ 역신장</span>
      </span>
      <span class="text-[11px] font-bold text-zinc-500 bg-white border border-[#E6E4DD] px-2.5 py-1 rounded-lg shadow-2xs">
        단위: 천원
      </span>
    </div>
  </header>

  <!-- 2. 상단 슬림 KPI 요약 스트립 (필터/검색에 따라 실시간 재계산) -->
  <section id="kpiSummaryStrip" class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 mb-3 shrink-0 animate-view tabular-nums" style="animation-delay: 0.03s;">
    <!-- JS renderKpiStrip()에서 동적 렌더링 -->
  </section>

  <!-- 3. 컨트롤 & 필터 바 (점정비 내용 탭 + 유형별 소계 토글 + 매장명 검색) -->
  <section class="bg-white border border-[#E6E4DD] rounded-2xl px-3.5 py-2.5 mb-3 flex flex-wrap items-center justify-between gap-2.5 shrink-0 shadow-[0_1px_4px_rgba(24,24,27,0.03)] animate-view" style="animation-delay: 0.05s;">

        <i class="fa-solid fa-layer-group mr-1"></i>정비 유형
      </span>
      <div id="categoryFilterTabs" class="flex flex-wrap items-center gap-1"></div>
    </div>

    <!-- 우측: 유형별 소계 토글 + 정렬 초기화 + 매장명 검색 -->
    <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-end">
      <button id="resetSortBtn" type="button" onclick="resetSort()"

        <i class="fa-solid fa-arrow-rotate-left text-[10px]"></i> 기본순
      </button>

      <button id="toggleSubtotalBtn" type="button" onclick="toggleCategorySubtotals()"
              class="px-3 py-1.5 rounded-xl text-[11px] font-extrabold bg-[#18181B] text-white transition flex items-center gap-1.5 shadow-2xs cursor-pointer">
        <i class="fa-solid fa-compress text-[10px]"></i> 유형별 소계 접기
      </button>

      <div class="relative flex-1 sm:flex-initial sm:w-44">
        <i class="fa-solid fa-magnifying-glass text-zinc-400 text-[11px] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input id="storeSearchInput" type="text" oninput="handleSearchInput(this.value)" placeholder="매장명 검색..."
               class="w-full bg-[#F7F6F2] border border-[#E6E4DD] focus:border-[#18181B] focus:bg-white rounded-xl pl-8 pr-7 py-1.5 text-xs font-semibold text-[#18181B] placeholder-zinc-400 focus:outline-none transition" />

          <i class="fa-solid fa-circle-xmark"></i>
        </button>
      </div>
    </div>
  </section>

      { idx: 32, category: "파사드 교체", date26: "2026-09-19", date25: "2025-09-19", store: "춘천점",         pre_y26: 201588, pre_daily: 769,  pre_y25: 204746, pre_gr: -0.015, post_y26: 67097,  post_daily: 1157, post_y25: 61166,  post_gr: 0.097,  tot_y26: 268685, tot_daily: 842,  tot_y25: 265912, tot_gr: 0.010 },
      { idx: 33, category: "파사드 교체", date26: "2026-09-23", date25: "2025-09-23", store: "여주점",         pre_y26: 323358, pre_daily: 1216, pre_y25: 333898, pre_gr: -0.032, post_y26: 66287,  post_daily: 1228, post_y25: 95228,  post_gr: -0.304, tot_y26: 389645, tot_daily: 1221, tot_y25: 429127, tot_gr: -0.092 }
    ];

    // =========================================================================
    // 애플리케이션 전역 상태
    // =========================================================================
    let renewalDataset = JSON.parse(JSON.stringify(INITIAL_RENEWAL_DATA));
    let selectedCategory = "전체";
    let sortColumn = "original"; // 'original' | 컬럼 키
    let sortDirection = "asc";   // 'asc' | 'desc'
    let showSubtotals = true;

    // 동적 기간 텍스트 (구글 시트 헤더에서 자동 갱신)
    let mainPeriodText = "(26.1.1~11.15)";
    let prePeriodText  = "(1/1~변경시점)";
    let postPeriodText = "(변경시점~11/15)";
    let totPeriodText  = "(1/1~11/15)";

    let jsonpFallbackTimer = null;
    let isManualSync = false;
    let toastTimer = null;

    // =========================================================================
    // 유틸리티 & 포맷팅 헬퍼
    // =========================================================================
    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      if (!toast) return;
      document.getElementById('toastMessage').innerText = msg;
      toast.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none');
      }, 2400);
    }

    function roundHalfAwayFromZero(n) {
      return Math.sign(n) * Math.round(Math.abs(n));
    }

    // 매출 / 일평균 금액 포맷 (null -> '-')
    function fmtNum(val) {
      if (val === null || val === undefined || val === '' || val === '-') return '-';
      const n = Number(val);
      if (isNaN(n)) return '-';
      const rounded = roundHalfAwayFromZero(n);
      return (rounded === 0 ? 0 : rounded).toLocaleString('ko-KR');
    }

    // 신장률 포맷 (소수점 첫째 자리: 26.5%, -0.9%, 0.0%)
    function fmtGrowth(val) {
      if (val === null || val === undefined || val === '' || val === '-') return '0.0%';
      const n = Number(val);
      if (isNaN(n)) return '0.0%';
      const pct = Number((n * 100).toFixed(1));
      return (Object.is(pct, -0) || pct === 0 ? '0.0' : pct.toFixed(1)) + '%';
    }

    // 한국 리테일 표준 신장률 색상 (상승: rose-600, 하락: blue-600, 0.0%: zinc-400)
    function getGrowthClass(val, isSummaryRow = false, isDarkFooter = false) {
      if (val === null || val === undefined || val === '' || val === '-') {
        return isDarkFooter ? 'text-zinc-400 font-semibold' : 'text-zinc-400 font-medium';
      }
      const n = Number(val);
      const pct = Number((n * 100).toFixed(1));
      if (isNaN(pct) || pct === 0) {
        return isDarkFooter ? 'text-zinc-400 font-semibold' : 'text-zinc-400 font-medium';
      }
      if (pct > 0) {
        if (isDarkFooter) return 'text-rose-400 font-extrabold';
        return isSummaryRow ? 'text-rose-600 font-extrabold' : 'text-rose-600 font-bold';
      } else {
        if (isDarkFooter) return 'text-sky-400 font-extrabold';
        return isSummaryRow ? 'text-blue-600 font-extrabold' : 'text-blue-600 font-bold';
      }
    }

    // 매출 숫자 색상
    function getSalesClass(val, baseClass = 'text-zinc-800 font-semibold', isDarkFooter = false) {
      if (val === null || val === undefined || val === '' || val === '-') {
        return isDarkFooter ? 'text-zinc-500 font-medium' : 'text-zinc-400 font-medium';
      }
      if (isDarkFooter) return 'text-white font-extrabold';
      const n = Number(val);
      if (!isNaN(n) && roundHalfAwayFromZero(n) < 0) {
        return 'text-blue-600 font-semibold';
      }
      return baseClass;
    }

    function updateMainHeaderTitle() {
      const titleEl = document.getElementById('sheetMainTitle');
      if (titleEl) {
        const suffix = selectedCategory === "전체" ? "" : ` [${selectedCategory}]`;
        titleEl.innerText = `■ 중부영업팀 점정비점 매출 현황 ${mainPeriodText}${suffix}`;

    // =========================================================================
    // [3. 구글 스프레드시트 실시간 연동] JSONP (gviz/tq)
    // =========================================================================
    function extractSheetId(input) {
      if (!input) return null;
      const match = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (match && match[1]) return match[1];
      if (input.length > 25 && !input.includes('/') && !input.includes('.')) return input.trim();
      return null;
    }

    function extractGid(input) {
      if (!input) return null;
      const match = input.match(/[?#&]gid=([0-9]+)/);
      return (match && match[1]) ? match[1] : null;
    }

    function setSyncSpinning(spinning) {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.toggle('fa-spin', spinning);
    }

    function formatSheetDate(cell) {
      if (!cell) return '';
      if (cell.f && String(cell.f).trim() !== '') {
        const f = String(cell.f).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(f)) return f;
      }
      const raw = cell.v !== undefined && cell.v !== null ? String(cell.v).trim() : '';
      if (!raw) return '';
      // gviz Date(2026,2,11) 형식 처리 (월은 0-indexed)
      const dateMatch = raw.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})\)$/);
      if (dateMatch) {
        const yyyy = dateMatch[1];
        const mm = String(parseInt(dateMatch[2], 10) + 1).padStart(2, '0');
        const dd = String(parseInt(dateMatch[3], 10)).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      }
      return raw;
    }

    function loadGoogleSheetData(manual = false) {
      isManualSync = manual;
      const sheetId = extractSheetId(GOOGLE_SHEET_URL);
      if (!sheetId) {
        if (manual) showToast("구글 스프레드시트 주소를 확인해주세요.");
        return;
      }

      setSyncSpinning(true);
      const syncDot = document.getElementById('syncDot');
      const syncText = document.getElementById('syncText');
      if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse';
      if (syncText) syncText.innerText = '동기화중';

      const oldScript = document.getElementById('gviz_jsonp_script');
      if (oldScript) oldScript.remove();

      if (jsonpFallbackTimer) clearTimeout(jsonpFallbackTimer);
      jsonpFallbackTimer = setTimeout(() => {
        setSyncSpinning(false);
        if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
        if (syncText) syncText.innerText = '시트 스냅샷 모드';
        if (isManualSync) {
          showToast(`시트 스냅샷 데이터 기준으로 표시 중입니다 (${renewalDataset.length}개 매장)`);
        }
      }, 3500);

      const gid = extractGid(GOOGLE_SHEET_URL);
      const sheetParam = gid ? `&gid=${gid}` : `&sheet=${encodeURIComponent(SHEET_NAME)}`;

      const script = document.createElement('script');
      script.id = 'gviz_jsonp_script';
      script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:handleGoogleSheetJSONP&headers=3${sheetParam}&t=${Date.now()}`;
      script.onerror = function() {
        if (jsonpFallbackTimer) clearTimeout(jsonpFallbackTimer);
        setSyncSpinning(false);
        if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
        if (syncText) syncText.innerText = '시트 스냅샷 모드';
        if (isManualSync) showToast("시트 권한을 확인해주세요. 스냅샷 기준으로 표시합니다.");
      };
      document.body.appendChild(script);
    }

    window.handleGoogleSheetJSONP = function(response) {
      if (jsonpFallbackTimer) clearTimeout(jsonpFallbackTimer);
      setSyncSpinning(false);

      const syncDot = document.getElementById('syncDot');
      const syncText = document.getElementById('syncText');

      try {
        if (!response || !response.table || !Array.isArray(response.table.rows)) {
          if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
          if (syncText) syncText.innerText = '시트 스냅샷 모드';
          return;
        }

        const cols = response.table.cols || [];
        const rows = response.table.rows || [];

        // 헤더 라벨에서 동적 기간 추출 (예: 1/1~변경시점, 변경시점~11/15, 1/1~11/15)
        const allHeaderTexts = cols.map(c => String(c?.label || '').replace(/\s+/g, ' ').trim());
        rows.slice(0, 4).forEach(r => {
          (r.c || []).forEach(c => {
            if (c && (c.f || c.v)) allHeaderTexts.push(String(c.f || c.v).replace(/\s+/g, ' ').trim());
          });
        });

        for (const txt of allHeaderTexts) {
          const mPre = txt.match(/변경전[^()]*(\([^)]+\))/);
          if (mPre) prePeriodText = mPre[1];
          const mPost = txt.match(/변경후[^()]*(\([^)]+\))/);
          if (mPost) {
            postPeriodText = mPost[1];
            const endPart = mPost[1].match(/~([^)]+)\)/);
            if (endPart) {
              const endClean = endPart[1].replace('/', '.');
              mainPeriodText = `(26.1.1~${endClean})`;
            }
          }
          const mTot = txt.match(/누계\s*실적[^()]*(\([^)]+\))/);
          if (mTot) totPeriodText = mTot[1];
        }

        const getCell = (cells, idx) => (cells && cells[idx]) ? cells[idx] : null;
        const getStr = (cells, idx) => {
          const c = getCell(cells, idx);
          if (!c) return '';
          if (c.f !== undefined && c.f !== null && String(c.f).trim() !== '') return String(c.f).trim();
          if (c.v !== undefined && c.v !== null) return String(c.v).trim();
          return '';
        };
        const parseNullableNum = (cells, idx) => {
          const c = getCell(cells, idx);
          if (!c || (c.v === null && (c.f === undefined || c.f === null))) return null;
          const fStr = (c.f !== undefined && c.f !== null) ? String(c.f).trim() : '';
          const vStr = (c.v !== undefined && c.v !== null) ? String(c.v).trim() : '';
          const displayStr = fStr || vStr;
          if (displayStr === '' || displayStr === '-' || displayStr.startsWith('#')) return null;
          if (typeof c.v === 'number') return isNaN(c.v) ? null : c.v;
          const num = parseFloat(displayStr.replace(/,/g, '').trim());
          return isNaN(num) ? null : num;
        };
        const parseRateCell = (cells, idx) => {
          const c = getCell(cells, idx);
          if (!c || (c.v === null && (c.f === undefined || c.f === null))) return 0;
          const fStr = (c.f !== undefined && c.f !== null) ? String(c.f).trim() : '';
          const vStr = (c.v !== undefined && c.v !== null) ? String(c.v).trim() : '';
          const displayStr = fStr || vStr;
          if (displayStr === '' || displayStr === '-' || displayStr.startsWith('#')) return 0;
          if (typeof c.v === 'number') return isNaN(c.v) ? 0 : c.v;
          if (displayStr.includes('%')) {
            const num = parseFloat(displayStr.replace(/,/g, '').replace('%', '').trim());
            return isNaN(num) ? 0 : num / 100;
          }
          const num = parseFloat(displayStr.replace(/,/g, '').trim());
          return isNaN(num) ? 0 : num;
        };

        const parsedList = [];
        let lastCategory = "";

        for (let i = 0; i < rows.length; i++) {
          const cells = rows[i].c || [];
          const rawCat = getStr(cells, 0).replace(/\s+/g, ' ').trim();
          if (rawCat && rawCat !== '점정비 내용' && !rawCat.includes('점정비')) {
            lastCategory = rawCat;
          }

          const date26 = formatSheetDate(getCell(cells, 1));
          const date25 = formatSheetDate(getCell(cells, 2));
          const storeName = getStr(cells, 3).trim();

          // 헤더/빈 행 스킵
          if (
            !storeName ||
            storeName === '매장명' ||
            storeName === '매출' ||
            storeName === '26년' ||
            storeName === '25년' ||
            storeName.startsWith('#')
          ) {
            continue;
          }

          parsedList.push({
            idx: parsedList.length,
            category: lastCategory || "기타",
            date26: date26,
            date25: date25,
            store: storeName,
            pre_y26:    parseNullableNum(cells, 4),
            pre_daily:  parseNullableNum(cells, 5),
            pre_y25:    parseNullableNum(cells, 6),
            pre_gr:     parseRateCell(cells, 7),
            post_y26:   parseNullableNum(cells, 8),
            post_daily: parseNullableNum(cells, 9),
            post_y25:   parseNullableNum(cells, 10),
            post_gr:    parseRateCell(cells, 11),
            tot_y26:    parseNullableNum(cells, 12),
            tot_daily:  parseNullableNum(cells, 13),
            tot_y25:    parseNullableNum(cells, 14),
            tot_gr:     parseRateCell(cells, 15)
          });
        }

        if (parsedList.length > 0) {
          renewalDataset = parsedList;
          updateMainHeaderTitle();
          renderKpiStrip();
          renderCategoryTabs();
          renderTableHeader();
          renderTableBody();

          if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
          if (syncText) syncText.innerText = '실시간 시트 연동';
          if (isManualSync) {
            showToast(`구글 시트 실시간 동기화 완료 (${parsedList.length}개 점정비점)`);
          }
        } else {
          if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
          if (syncText) syncText.innerText = '시트 스냅샷 모드';
          if (isManualSync) {
            showToast("시트 데이터를 찾지 못해 스냅샷 기준으로 표시합니다.");
          }
        }
      } catch (err) {
        console.error("점정비 시트 파싱 오류:", err);
        if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
        if (syncText) syncText.innerText = '시트 스냅샷 모드';
        if (isManualSync) showToast("시트 파싱 중 오류가 발생했습니다.");
      }
    };

    // =========================================================================
    // [4. 집계 계산 & KPI 요약 카드 렌더링]
    // =========================================================================
    function aggregateStores(list) {
      const sumNonNull = (key) => {
        let hasAny = false;
        let total = 0;
        for (const item of list) {
          const v = item[key];
          if (v !== null && v !== undefined && !isNaN(Number(v))) {
            hasAny = true;
            total += Number(v);
          }
        }
        return hasAny ? total : null;
      };

      const avgNonNull = (key) => {
        let cnt = 0;
        let total = 0;
        for (const item of list) {
          const v = item[key];
          if (v !== null && v !== undefined && !isNaN(Number(v))) {
            cnt += 1;
            total += Number(v);
          }
        }
        return cnt > 0 ? roundHalfAwayFromZero(total / cnt) : null;
      };

      const pre_y26    = sumNonNull('pre_y26');
      const pre_daily  = avgNonNull('pre_daily');
      const pre_y25    = sumNonNull('pre_y25');
      const pre_gr     = (pre_y25 !== null && pre_y25 > 0) ? ((pre_y26 || 0) - pre_y25) / pre_y25 : 0;

      const post_y26   = sumNonNull('post_y26');
      const post_daily = avgNonNull('post_daily');
      const post_y25   = sumNonNull('post_y25');
      const post_gr    = (post_y25 !== null && post_y25 > 0) ? ((post_y26 || 0) - post_y25) / post_y25 : 0;

      const tot_y26    = sumNonNull('tot_y26');
      const tot_daily  = avgNonNull('tot_daily');
      const tot_y25    = sumNonNull('tot_y25');
      const tot_gr     = (tot_y25 !== null && tot_y25 > 0) ? ((tot_y26 || 0) - tot_y25) / tot_y25 : 0;

      const postGrowCount = list.filter(s => typeof s.post_gr === 'number' && Number((s.post_gr * 100).toFixed(1)) > 0).length;

      return {
        count: list.length,
        postGrowCount,
        pre_y26, pre_daily, pre_y25, pre_gr,
        post_y26, post_daily, post_y25, post_gr,
        tot_y26, tot_daily, tot_y25, tot_gr
      };
    }

    function renderGrowthPill(grVal) {
      const pct = Number(((grVal || 0) * 100).toFixed(1));
      const str = fmtGrowth(grVal);
      if (pct > 0) {
        return `<span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-rose-50 text-rose-600 border border-rose-200/80">▲ ${str}</span>`;
      } else if (pct < 0) {
        return `<span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-full text-[11px] font-extrabold bg-blue-50 text-blue-600 border border-blue-200/80">▼ ${str}</span>`;
      }
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-zinc-100 text-zinc-500 border border-zinc-200/80">${str}</span>`;
    }

    function renderKpiStrip() {
      const targetStores = getPreparedStores();
      const agg = aggregateStores(targetStores);
      const scopeLabel = selectedCategory === "전체" ? "전체 정비 유형" : selectedCategory;

      // 변경전 대비 변경후 점당 일평균 증감
      let dailyLiftHtml = '';

    function toggleSort(colKey) {
      if (sortColumn === colKey) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        sortColumn = colKey;
        sortDirection = (colKey === 'category' || colKey === 'date26' || colKey === 'store') ? 'asc' : 'desc';
      }
      const resetBtn = document.getElementById('resetSortBtn');
      if (resetBtn) {
        resetBtn.classList.toggle('hidden', sortColumn === 'original');
      }
      renderTableHeader();
      renderTableBody();
    }

    function resetSort() {
      sortColumn = 'original';
      sortDirection = 'asc';
      const resetBtn = document.getElementById('resetSortBtn');
      if (resetBtn) resetBtn.classList.add('hidden');
      renderTableHeader();
      renderTableBody();

    // =========================================================================
    // [6. 필터 탭, 데이터 정렬 및 테이블 본문 렌더링]
    // =========================================================================
    function renderCategoryTabs() {
      const counts = { "전체": renewalDataset.length };
      const allCats = [...CATEGORY_ORDER];

      renewalDataset.forEach(item => {
        counts[item.category] = (counts[item.category] || 0) + 1;
        if (item.category && !allCats.includes(item.category)) {
          allCats.push(item.category);
        }
      });

      const tabs = [
        { key: "전체", label: "전체", count: counts["전체"] || 0 },
        ...allCats
          .filter(cat => (counts[cat] || 0) > 0)
          .map(cat => ({ key: cat, label: cat, count: counts[cat] }))
      ];

      const container = document.getElementById('categoryFilterTabs');
      container.innerHTML = tabs.map(t => {
        const active = selectedCategory === t.key;
        return `
          <button type="button" onclick="setCategoryFilter('${t.key}')"
                  class="px-2.5 sm:px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 cursor-pointer ${active ? 'bg-[#18181B] text-white font-extrabold shadow-2xs' : 'bg-[#F7F6F2] text-zinc-600 hover:text-[#18181B] hover:bg-[#F0EEE9] border border-[#E6E4DD] font-bold'}">
            <span>${t.label}</span>
            <span class="px-1.5 py-0.2 rounded-full text-[10px] ${active ? 'bg-amber-400 text-zinc-950 font-black' : 'bg-zinc-200/80 text-zinc-600 font-bold'}">${t.count}</span>
          </button>
        `;
      }).join('');
    }

    function getPreparedStores() {
      let list = renewalDataset.map(item => ({ ...item }));

      if (selectedCategory !== "전체") {
        list = list.filter(item => item.category === selectedCategory);
      }

      const q = searchQuery.trim().toLowerCase();
      if (q) {
        list = list.filter(s =>
          s.store.toLowerCase().includes(q) ||
          s.category.toLowerCase().includes(q)
        );
      }

      if (sortColumn === "original") {
        list.sort((a, b) => a.idx - b.idx);
        return list;
      }

      list.sort((a, b) => {
        const valA = a[sortColumn];
        const valB = b[sortColumn];

        const isNullA = valA === null || valA === undefined || valA === '' || valA === '-' || (typeof valA === 'number' && isNaN(valA));
        const isNullB = valB === null || valB === undefined || valB === '' || valB === '-' || (typeof valB === 'number' && isNaN(valB));

        if (isNullA && isNullB) return a.idx - b.idx;
        if (isNullA) return 1;
        if (isNullB) return -1;

        if (typeof valA === 'string' && typeof valB === 'string') {
          const cmp = valA.localeCompare(valB, 'ko');
          if (cmp === 0) return a.idx - b.idx;
          return sortDirection === 'asc' ? cmp : -cmp;
        }

        const diff = Number(valA) - Number(valB);
        if (diff === 0) return a.idx - b.idx;
        return sortDirection === 'asc' ? diff : -diff;
      });

      return list;
    }

    function renderCategoryBadge(cat) {
      const style = CATEGORY_BADGE_STYLES[cat] || "bg-zinc-100 text-zinc-700 border-zinc-200";
      return `<span class="inline-block px-2 py-0.5 rounded-md border text-[11px] font-extrabold tracking-tight leading-tight ${style}">${cat}</span>`;
    }

    function renderPeriodBlockCells(rowObj, prefix, options = {}) {
      const {
        tdBg = '',
        isSummary = false,
        isDarkFooter = false,
        isPost = false,
        isLastBlock = false
      } = options;

      const y26Val   = rowObj[`${prefix}_y26`];
      const dailyVal = rowObj[`${prefix}_daily`];
      const y25Val   = rowObj[`${prefix}_y25`];
      const grVal    = rowObj[`${prefix}_gr`];

      const borderCol = isDarkFooter ? 'border-zinc-700' : 'border-[#E6E4DD]';
      const rightEdgeBorder = isLastBlock ? '' : `border-r ${borderCol}`;

      const y26Base = isPost
        ? (isSummary ? 'text-amber-950 font-extrabold' : 'text-[#18181B] font-extrabold')
        : (isSummary ? 'text-zinc-900 font-extrabold' : 'text-zinc-800 font-bold');

      const y26Color = isDarkFooter
        ? (isPost ? 'text-amber-300 font-extrabold' : 'text-white font-extrabold')
        : getSalesClass(y26Val, y26Base, false);

      const dailyColor = isDarkFooter
        ? 'text-zinc-200 font-bold'
        : (dailyVal === null || dailyVal === undefined ? 'text-zinc-400 font-medium' : (isSummary ? 'text-zinc-800 font-bold' : 'text-zinc-600 font-semibold'));

      const y25Color = isDarkFooter
        ? 'text-zinc-300 font-bold'
        : (y25Val === null || y25Val === undefined ? 'text-zinc-400 font-medium' : (isSummary ? 'text-zinc-700 font-bold' : 'text-zinc-500 font-medium'));

      const growthColor = getGrowthClass(grVal, isSummary, isDarkFooter);

      // 변경후 일평균 셀에 변경전 일평균 대비 증감 미세 표시 (개별 매장 행)
      let dailyDisplayHtml = fmtNum(dailyVal);
      if (isPost && !isSummary && !isDarkFooter && dailyVal !== null && rowObj.pre_daily !== null && rowObj.pre_daily !== undefined) {
        const diff = roundHalfAwayFromZero(dailyVal - rowObj.pre_daily);
        if (diff > 0) {
          dailyDisplayHtml = `<span class="text-rose-600 text-[9.5px] font-extrabold mr-0.5" title="변경전 대비 +${diff.toLocaleString('ko-KR')}">▲</span>${fmtNum(dailyVal)}`;
        } else if (diff < 0) {
          dailyDisplayHtml = `<span class="text-blue-600 text-[9.5px] font-extrabold mr-0.5" title="변경전 대비 ${diff.toLocaleString('ko-KR')}">▼</span>${fmtNum(dailyVal)}`;
        }
      }

      return `
        <td class="border-r ${borderCol} px-2.5 py-2 text-right whitespace-nowrap ${tdBg} ${y26Color}">${fmtNum(y26Val)}</td>
        <td class="border-r ${borderCol} px-2 py-2 text-right whitespace-nowrap ${tdBg} ${dailyColor}">${dailyDisplayHtml}</td>
        <td class="border-r ${borderCol} px-2.5 py-2 text-right whitespace-nowrap ${tdBg} ${y25Color}">${fmtNum(y25Val)}</td>
        <td class="${rightEdgeBorder} px-2 py-2 text-right whitespace-nowrap ${tdBg} ${growthColor}">${fmtGrowth(grVal)}</td>
      `;
    }

    function renderTableBody() {
      const stores = getPreparedStores();
      const tbody = document.getElementById('renewalTableBody');

      // 1. 개별 매장 행 렌더링

              <!-- 변경전 누계실적 -->

            </tr>

      // 2. 유형별 소계 비교 행 (토글 가능)

        const categoriesToShow = [...CATEGORY_ORDER];
        renewalDataset.forEach(item => {

            categoriesToShow.push(item.category);

        categoriesToShow.forEach((cat, cIdx) => {
          const catStores = renewalDataset.filter(s => s.category === cat);
          if (catStores.length === 0) return;

          const subAgg = aggregateStores(catStores);
          const isSelectedCat = selectedCategory === cat;

          const stickyBg = isSelectedCat ? 'bg-[#FFFBEB]' : 'bg-[#FAFAFA]';
          const topBorder = cIdx === 0 ? 'border-t-2 border-t-amber-300' : '';

          rowsHtml.push(`
            <tr class="${rowBg} ${topBorder} transition-colors border-b border-[#E6E4DD]">
              <td class="sticky left-0 z-10 w-[116px] min-w-[116px] ${stickyBg} border-r border-[#E6E4DD] px-2.5 py-2 text-center whitespace-nowrap">
                ${renderCategoryBadge(cat)}
              </td>
              <td class="sticky left-[116px] z-10 w-[104px] min-w-[104px] ${stickyBg} border-r border-[#E6E4DD] px-2 py-2 text-center whitespace-nowrap">
                <span class="text-[10.5px] font-extrabold text-zinc-500">유형 소계</span>
              </td>
              <td class="sticky left-[220px] z-10 w-[132px] min-w-[132px] ${stickyBg} border-r border-[#E6E4DD] px-3 py-2 text-left whitespace-nowrap shadow-[2px_0_5px_-2px_rgba(0,0,0,0.06)]">
                <div class="flex items-center justify-between gap-1">
                  <span class="font-extrabold text-[12px] ${isSelectedCat ? 'text-amber-950' : 'text-zinc-700'}">${cat}</span>
                  <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-zinc-200/80 text-zinc-700 leading-none">${subAgg.count}점</span>
                </div>
              </td>

              ${renderPeriodBlockCells(subAgg, 'pre', { tdBg: isSelectedCat ? 'bg-[#FFFBEB]' : '', isSummary: true })}
              ${renderPeriodBlockCells(subAgg, 'post', { tdBg: isSelectedCat ? 'bg-amber-100/45' : 'bg-amber-50/40', isSummary: true, isPost: true })}
              ${renderPeriodBlockCells(subAgg, 'tot', { tdBg: isSelectedCat ? 'bg-[#FFFBEB]' : '', isSummary: true, isLastBlock: true })}
            </tr>
          `);
        });
      }

      // 3. 현재 필터 선택 합계 행 (특정 유형이나 검색어가 활성화된 경우 표시)
      const isFiltered = selectedCategory !== "전체" || searchQuery.trim() !== "";
      if (isFiltered && stores.length > 0) {
        const filteredAgg = aggregateStores(stores);
        const filterLabel = selectedCategory !== "전체" ? selectedCategory : "검색 결과";
        rowsHtml.push(`
          <tr class="bg-amber-100/75 font-extrabold text-amber-950 border-t-2 border-amber-300 border-b border-amber-300">
            <td class="sticky left-0 z-10 w-[116px] min-w-[116px] bg-[#FEF3C7] border-r border-amber-200 px-2.5 py-2 text-center text-[10.5px] font-black text-amber-900 whitespace-nowrap">
              선택 소계
            </td>
            <td class="sticky left-[116px] z-10 w-[104px] min-w-[104px] bg-[#FEF3C7] border-r border-amber-200 px-2 py-2 text-center text-[11px] font-extrabold text-amber-800 whitespace-nowrap">
              ${filteredAgg.count}개점
            </td>
            <td class="sticky left-[220px] z-10 w-[132px] min-w-[132px] bg-[#FEF3C7] border-r border-amber-200 px-3 py-2 text-left whitespace-nowrap shadow-[2px_0_5px_-2px_rgba(0,0,0,0.08)]">
              <span class="font-black text-[12px] text-amber-950">${filterLabel} 합계</span>
            </td>

            ${renderPeriodBlockCells(filteredAgg, 'pre', { tdBg: 'bg-amber-100/75', isSummary: true })}
            ${renderPeriodBlockCells(filteredAgg, 'post', { tdBg: 'bg-amber-200/50', isSummary: true, isPost: true })}
            ${renderPeriodBlockCells(filteredAgg, 'tot', { tdBg: 'bg-amber-100/75', isSummary: true, isLastBlock: true })}
          </tr>
        `);
      }

      // 4. 다크 배경(#18181B) 전체 합계 (TOTAL) 행
      const grandAgg = aggregateStores(renewalDataset);
      rowsHtml.push(`
        <tr class="bg-[#18181B] text-white font-extrabold border-t-2 border-zinc-700">
          <td class="sticky left-0 z-10 w-[116px] min-w-[116px] bg-[#18181B] border-r border-zinc-700 px-2.5 py-2.5 text-center text-[10.5px] font-black text-amber-400 tracking-wider whitespace-nowrap">
            TOTAL
          </td>
          <td class="sticky left-[116px] z-10 w-[104px] min-w-[104px] bg-[#18181B] border-r border-zinc-700 px-2 py-2.5 text-center text-[11px] font-bold text-zinc-300 whitespace-nowrap">
            전체 ${grandAgg.count}개점
          </td>
          <td class="sticky left-[220px] z-10 w-[132px] min-w-[132px] bg-[#18181B] border-r border-zinc-700 px-3 py-2.5 text-left whitespace-nowrap shadow-[2px_0_5px_-2px_rgba(0,0,0,0.45)]">
            <span class="font-black text-[12.5px] text-amber-300">전체 합계</span>
          </td>

          ${renderPeriodBlockCells(grandAgg, 'pre', { tdBg: 'bg-[#18181B]', isSummary: true, isDarkFooter: true })}
          ${renderPeriodBlockCells(grandAgg, 'post', { tdBg: 'bg-[#261E14]', isSummary: true, isDarkFooter: true, isPost: true })}
          ${renderPeriodBlockCells(grandAgg, 'tot', { tdBg: 'bg-[#18181B]', isSummary: true, isDarkFooter: true, isLastBlock: true })}
        </tr>
      `);

      tbody.innerHTML = rowsHtml.join('');
    }

    // =========================================================================
    // [사용자 인터랙션 핸들러]
    // =========================================================================
    function setCategoryFilter(catKey) {
      selectedCategory = catKey;
      updateMainHeaderTitle();
      renderKpiStrip();
      renderCategoryTabs();
      renderTableBody();

      const scrollBox = document.getElementById('tableScrollContainer');
      if (scrollBox) scrollBox.scrollTop = 0;
    }

    function toggleCategorySubtotals() {
      showSubtotals = !showSubtotals;
      const btn = document.getElementById('toggleSubtotalBtn');
      if (btn) {
        if (showSubtotals) {
          btn.innerHTML = `<i class="fa-solid fa-compress text-[10px]"></i> 유형별 소계 접기`;
          btn.className = 'px-3 py-1.5 rounded-xl text-[11px] font-extrabold bg-[#18181B] text-white transition flex items-center gap-1.5 shadow-2xs cursor-pointer';
        } else {
          btn.innerHTML = `<i class="fa-solid fa-expand text-[10px]"></i> 유형별 소계 보기`;
          btn.className = 'px-3 py-1.5 rounded-xl text-[11px] font-bold text-zinc-600 bg-white hover:text-[#18181B] hover:bg-[#F0EEE9] border border-[#E6E4DD] transition flex items-center gap-1.5 shadow-2xs cursor-pointer';
        }
      }
      renderTableBody();
    }

    function handleSearchInput(val) {
      searchQuery = val || '';
      const clearBtn = document.getElementById('clearSearchBtn');
      if (clearBtn) {
        clearBtn.classList.toggle('hidden', searchQuery.trim().length === 0);
      }
      renderKpiStrip();
      renderTableBody();
    }

    function clearSearch() {
      const input = document.getElementById('storeSearchInput');
      if (input) input.value = '';
      handleSearchInput('');
    }

    // 초기 구동
    window.addEventListener('DOMContentLoaded', () => {
      updateMainHeaderTitle();
      renderKpiStrip();
      renderCategoryTabs();
      renderTableHeader();
      renderTableBody();
      loadGoogleSheetData(false);
    });
  </script>
</body>
</html>
