<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="robots" content="noindex, nofollow">
  <!-- [직접 접속 차단 보안 코드] -->
  <script>
    if (window.self === window.top) {
      window.location.replace('./index.html');
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>복합매장 실적현황</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6.4 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <style>
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #F7F6F2;
      color: #18181B;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .table-container::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    .table-container::-webkit-scrollbar-track {
      background: #F0EEE9;
      border-radius: 4px;
    }
    .table-container::-webkit-scrollbar-thumb {
      background: rgba(113, 113, 122, 0.45);
      border-radius: 4px;
    }
    .table-container::-webkit-scrollbar-thumb:hover {
      background: rgba(113, 113, 122, 0.75);
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-view {
      animation: fadeSlideUp 0.18s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="h-screen flex flex-col p-4 lg:p-5 overflow-hidden select-none">

  <!-- 1. 상단 타이틀 & 실시간 연동 버튼 -->
  <header class="flex flex-wrap items-center justify-between gap-3 mb-3 shrink-0 animate-view">
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2.5">
        <span class="px-2 py-0.5 rounded-md bg-[#18181B] text-amber-400 text-[10.5px] font-black tracking-wider">COMPLEX 18</span>
        <h1 id="sheetMainTitle" class="text-[17px] lg:text-[19px] font-extrabold tracking-tight text-[#18181B]">
          ■ 중부영업팀 복합매장 실적현황 (26.11.15)
        </h1>
        <button type="button" onclick="loadGoogleSheetData(true)" id="currentSheetLabel"
                class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white border border-[#E6E4DD] hover:bg-[#F0EEE9] text-[11px] font-bold text-zinc-700 transition whitespace-nowrap shadow-2xs" title="구글 시트 실시간 동기화">
          <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span id="syncText">실시간 시트 연동</span>
          <i id="refreshIcon" class="fa-solid fa-rotate text-[10px]"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 2. 컨트롤 & 필터 바 -->
  <section class="bg-white border border-[#E6E4DD] rounded-2xl px-3.5 py-2.5 mb-3 flex flex-wrap items-center justify-between gap-2.5 shrink-0 shadow-[0_1px_4px_rgba(24,24,27,0.03)] animate-view" style="animation-delay: 0.05s;">
    <div class="flex flex-wrap items-center gap-1.5">
      <span class="text-[11px] font-extrabold text-zinc-400 mr-1"><i class="fa-solid fa-layer-group mr-1"></i>구분 필터</span>
      <div id="groupFilterTabs" class="flex flex-wrap items-center gap-1"></div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <div class="flex items-center">
        <button id="toggleAllBtn" onclick="toggleAllExpanded()" class="px-3 py-1.5 rounded-xl text-[11px] font-bold text-zinc-600 bg-white hover:text-[#18181B] hover:bg-[#F0EEE9] border border-[#E6E4DD] transition flex items-center gap-1.5 shadow-2xs">
          <i class="fa-solid fa-expand text-[10px]"></i> 전체 세부매출 펼치기
        </button>
      </div>

      <div class="relative w-44">
        <i class="fa-solid fa-magnifying-glass text-zinc-400 text-[11px] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input id="storeSearchInput" type="text" oninput="handleSearchInput(this.value)" placeholder="매장명 검색 (18개)..." class="w-full bg-[#F7F6F2] border border-[#E6E4DD] focus:border-[#18181B] focus:bg-white rounded-xl pl-8 pr-7 py-1.5 text-xs font-semibold text-[#18181B] placeholder-zinc-400 focus:outline-none transition" />
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-700 text-xs">
          <i class="fa-solid fa-circle-xmark"></i>
        </button>
      </div>
    </div>
  </section>

  <!-- 3. 메인 스프레드시트 테이블 영역 -->
  <main class="flex-1 min-h-0 flex flex-col animate-view" style="animation-delay: 0.08s;">
    <div id="tableScrollContainer" class="table-container flex-1 overflow-auto rounded-2xl border border-[#DFDDD4] bg-white shadow-[0_2px_10px_rgba(24,24,27,0.04)] relative select-text">
      <table class="w-full text-[12px] border-collapse min-w-[1250px] tabular-nums">
        <thead class="bg-[#18181B] text-white whitespace-nowrap">
          <tr class="h-9">
            <th rowspan="2" class="sticky top-0 z-30 bg-[#18181B] border-b border-r border-zinc-700 px-3 font-extrabold tracking-tight text-center w-[110px]">구분</th>
            <th rowspan="2" class="sticky top-0 z-30 bg-[#18181B] border-b border-r border-zinc-700 px-3 font-extrabold tracking-tight text-center w-[200px]">매장명</th>
            <th rowspan="2" class="sticky top-0 z-30 bg-[#18181B] border-b border-r border-zinc-700 px-3 font-extrabold tracking-tight text-center w-[90px]">구분</th>
            <th rowspan="2" class="sticky top-0 z-30 bg-[#18181B] border-b border-r border-zinc-700 px-3.5 font-extrabold tracking-tight text-right text-amber-300 w-[115px]">25년 마감</th>
            <th id="thWeeklyTitle" colspan="3" class="sticky top-0 z-30 bg-[#222226] border-b border-r border-zinc-700 px-3 font-extrabold tracking-tight text-center text-amber-400">주간 (11.9~11.15)</th>
            <th id="thMonthlyTitle" colspan="3" class="sticky top-0 z-30 bg-[#18181B] border-b border-r border-zinc-700 px-3 font-extrabold tracking-tight text-center text-emerald-300">월간 (11.1~11.15)</th>
            <th id="thYearlyTitle" colspan="3" class="sticky top-0 z-30 bg-[#222226] border-b border-zinc-700 px-3 font-extrabold tracking-tight text-center text-sky-300">26년 누계(1.1~11.15)</th>
          </tr>
          <tr class="h-8">
            <th class="sticky top-9 z-20 bg-[#27272A] border-b border-r border-zinc-700 px-3 font-bold text-[11px] text-right text-zinc-200 w-[95px]">매출</th>
            <th class="sticky top-9 z-20 bg-[#27272A] border-b border-r border-zinc-700 px-3 font-bold text-[11px] text-right text-zinc-300 w-[85px]">일평균</th>
            <th class="sticky top-9 z-20 bg-[#27272A] border-b border-r border-zinc-700 px-2.5 font-bold text-[11px] text-right text-amber-300 w-[75px]">신장율</th>
            <th class="sticky top-9 z-20 bg-[#202024] border-b border-r border-zinc-700 px-3 font-bold text-[11px] text-right text-zinc-200 w-[95px]">매출</th>
            <th class="sticky top-9 z-20 bg-[#202024] border-b border-r border-zinc-700 px-3 font-bold text-[11px] text-right text-zinc-300 w-[85px]">일평균</th>
            <th class="sticky top-9 z-20 bg-[#202024] border-b border-r border-zinc-700 px-2.5 font-bold text-[11px] text-right text-emerald-300 w-[75px]">신장율</th>
            <th class="sticky top-9 z-20 bg-[#27272A] border-b border-r border-zinc-700 px-3 font-bold text-[11px] text-right text-zinc-200 w-[105px]">매출</th>
            <th class="sticky top-9 z-20 bg-[#27272A] border-b border-r border-zinc-700 px-3 font-bold text-[11px] text-right text-zinc-300 w-[85px]">일평균</th>
            <th class="sticky top-9 z-20 bg-[#27272A] border-b border-zinc-700 px-2.5 font-bold text-[11px] text-right text-sky-300 w-[75px]">신장율</th>
          </tr>
        </thead>
        <tbody id="complexTableBody" class="divide-y divide-[#E6E4DD] bg-white"></tbody>
      </table>
    </div>
  </main>

  <!-- 토스트 알림 -->
  <div id="toastBox" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-[#18181B]/95 text-white px-4 py-2.5 rounded-full text-xs font-bold shadow-xl flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none -translate-y-2 whitespace-nowrap">
    <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
    <span id="toastMessage">실적 데이터를 불러오는 중...</span>
  </div>

  <script>
    // =========================================================================
    // [구글 시트 연동 설정]
    // =========================================================================
    // 사용 중인 'WM중부영업팀 복합점 매출 현황' 구글 시트 주소를 아래에 붙여넣으세요.
    const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1WQsCBmhQxWuFVJ0iqOA1g9DM5KmWVHI5KMHhYDlNV5w/edit?usp=drive_web&ouid=114027821451249945566";
    const SHEET_NAME = "복합점 매출";

    // =========================================================================
    // 기본 스냅샷 데이터 (26.11.15 기준 최신화 / 25년 마감 없는 매장 신장률 '-' 처리)
    // =========================================================================
    const INITIAL_COMPLEX_DATA = [];

    let storeDataset = JSON.parse(JSON.stringify(INITIAL_COMPLEX_DATA));
    let selectedGroup = 'ALL';
    let searchQuery = '';
    let expandedStores = new Set();
    let allExpanded = false;
    let jsonpFallbackTimer = null;
    let isManualSync = false;
    let toastTimer = null;

    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      if (!toast) return;
      document.getElementById('toastMessage').innerText = msg;
      toast.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none');
      }, 2400);
    }

    // 숫자 파싱 헬퍼
    function toNum(val) {
      if (val === null || val === undefined) return 0;
      const cleaned = String(val).replace(/,/g, '').trim();
      if (cleaned === '' || cleaned === '-') return 0;
      const n = parseFloat(cleaned);
      return isNaN(n) ? 0 : n;
    }

    function fmtNum(n) {
      return Math.round(n).toLocaleString('ko-KR');
    }

    // 25년 마감 매출 유무 확인 헬퍼 (매출이 없거나 0 이하이면 false)
    function hasValidY25(y25Val) {
      if (y25Val === null || y25Val === undefined) return false;
      const s = String(y25Val).trim();
      if (s === '' || s === '-') return false;
      return toNum(s) > 0;
    }

    // 신장률 표시 포맷 헬퍼: 25년 마감 매출이 없으면 무조건 '-' 반환
    function formatGrowthValue(rowObj, grVal) {
      if (!rowObj || !hasValidY25(rowObj.y25)) return '-';
      const s = String(grVal ?? '').trim();
      return s === '' ? '-' : s;
    }

    // 합계 행 누락 대비 안전 계산 헬퍼
    function buildFallbackTotal(rows) {
      const sumKey = (k) => {
        const vals = rows.map(r => r[k]).filter(v => v && v !== '-');
        if (vals.length === 0) return '-';
        return fmtNum(vals.reduce((acc, v) => acc + toNum(v), 0));
      };
      return {
        type: '합계',
        y25: sumKey('y25'),
        w_sales: sumKey('w_sales'),
        w_avg: sumKey('w_avg'),
        w_gr: '-',
        m_sales: sumKey('m_sales'),
        m_avg: sumKey('m_avg'),
        m_gr: '-',
        y26_sales: sumKey('y26_sales'),
        y26_avg: sumKey('y26_avg'),
        y26_gr: '-'
      };
    }

    // =========================================================================
    // [구글 스프레드시트 실시간 연동] JSONP (gviz/tq)
    // =========================================================================
    function extractSheetId(input) {
      if (!input) return null;
      const match = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      if (match && match[1]) return match[1];
      if (input.length > 25 && !input.includes('/') && !input.includes('.')) return input.trim();
      return null;
    }

    function extractGid(input) {
      if (!input) return null;
      const match = input.match(/[?#&]gid=([0-9]+)/);
      return (match && match[1]) ? match[1] : null;
    }

    function setSyncSpinning(spinning) {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.toggle('fa-spin', spinning);
    }

    function loadGoogleSheetData(manual = false) {
      isManualSync = manual;
      const sheetId = extractSheetId(GOOGLE_SHEET_URL);
      if (!sheetId) {
        if (manual) showToast("구글 스프레드시트 주소를 확인해주세요.");
        return;
      }

      setSyncSpinning(true);
      const syncDot = document.getElementById('syncDot');
      const syncText = document.getElementById('syncText');
      if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse';
      if (syncText) syncText.innerText = '동기화중';

      const oldScript = document.getElementById('gviz_jsonp_script');
      if (oldScript) oldScript.remove();

      if (jsonpFallbackTimer) clearTimeout(jsonpFallbackTimer);
      jsonpFallbackTimer = setTimeout(() => {
        setSyncSpinning(false);
        if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
        if (syncText) syncText.innerText = '시트 스냅샷 모드';
        if (isManualSync) showToast(`시트 스냅샷 데이터 기준으로 표시 중입니다 (${storeDataset.length}개 매장)`);
      }, 3500);

      const gid = extractGid(GOOGLE_SHEET_URL);
      let sheetParam = '';
      if (gid) {
        sheetParam = `&gid=${gid}`;
      } else if (SHEET_NAME && SHEET_NAME.trim() !== '') {
        sheetParam = `&sheet=${encodeURIComponent(SHEET_NAME.trim())}`;
      }

      const script = document.createElement('script');
      script.id = 'gviz_jsonp_script';
      script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:handleGoogleSheetJSONP&headers=3${sheetParam}&t=${Date.now()}`;
      script.onerror = function() {
        if (jsonpFallbackTimer) clearTimeout(jsonpFallbackTimer);
        setSyncSpinning(false);
        if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
        if (syncText) syncText.innerText = '시트 스냅샷 모드';
        if (isManualSync) showToast(`시트 권한을 확인해주세요. 스냅샷 기준으로 표시합니다.`);
      };
      document.body.appendChild(script);
    }

    function normalizeGroupName(raw) {
      const s = String(raw || '').replace(/\s+/g, '');
      if (s.includes('WM+OL+상설')) return "WM+OL+상설\n복합점";
      if (s.includes('WM+OL')) return "WM+OL\n복합점";
      if (s.includes('WM+상설')) return "WM+상설\n복합점";
      return String(raw || '').trim();
    }

    function applyDerivedDateHeaders(titleText) {
      const m = String(titleText || '').match(/(\d{2})\.(\d{2})\.(\d{2})/);
      if (!m) return;
      const yy = parseInt(m[1], 10);
      const mm = parseInt(m[2], 10);
      const dd = parseInt(m[3], 10);
      const endDate = new Date(2000 + yy, mm - 1, dd);
      const startWeek = new Date(endDate);
      startWeek.setDate(endDate.getDate() - 6);
      const swM = startWeek.getMonth() + 1;
      const swD = startWeek.getDate();

      document.getElementById('thWeeklyTitle').innerText = `주간 (${swM}.${swD}~${mm}.${dd})`;
      document.getElementById('thMonthlyTitle').innerText = `월간 (${mm}.1~${mm}.${dd})`;
      document.getElementById('thYearlyTitle').innerText = `${yy}년 누계(1.1~${mm}.${dd})`;
    }

    window.handleGoogleSheetJSONP = function(response) {
      if (jsonpFallbackTimer) clearTimeout(jsonpFallbackTimer);
      setSyncSpinning(false);

      const syncDot = document.getElementById('syncDot');
      const syncText = document.getElementById('syncText');

      try {
        if (!response || !response.table || !response.table.rows) {
          if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
          if (syncText) syncText.innerText = '시트 스냅샷 모드';
          return;
        }

        const cols = response.table.cols || [];
        const rows = response.table.rows || [];

        let foundWeeklyHeader = false;

        // 1. 시트 상단 타이틀 및 주간/월간/누계 기간 헤더 추출
        const checkHeaderMeta = (str) => {
          if (!str) return;
          const clean = String(str).replace(/\s+/g, ' ').trim();

          const titleMatch = clean.match(/■?\s*중부영업팀\s*복합매장\s*실적현황\s*\([^)]+\)/);
          if (titleMatch) {
            const t = titleMatch[0].trim();
            const fullTitle = t.startsWith('■') ? t : `■ ${t}`;
            document.getElementById('sheetMainTitle').innerText = fullTitle;
            if (!foundWeeklyHeader) applyDerivedDateHeaders(fullTitle);
          }

          const wMatch = clean.match(/주간\s*\([^)]+\)/);
          if (wMatch) {
            document.getElementById('thWeeklyTitle').innerText = wMatch[0].trim();
            foundWeeklyHeader = true;
          }

          const mMatch = clean.match(/월간\s*\([^)]+\)/);
          if (mMatch) {
            document.getElementById('thMonthlyTitle').innerText = mMatch[0].trim();
          }

          const yMatch = clean.match(/(?:\d+년\s*)?누계\s*\([^)]+\)/);
          if (yMatch) {
            document.getElementById('thYearlyTitle').innerText = yMatch[0].trim();
          }
        };

        cols.forEach(c => checkHeaderMeta(c.label));
        for (let r = 0; r < Math.min(rows.length, 6); r++) {
          const cells = rows[r].c || [];
          cells.forEach(cell => {
            if (cell) checkHeaderMeta(cell.f || cell.v);
          });
        }

        // 2. 복종 구분 열('WM(정상)' 등이 위치한 열 인덱스) 감지
        const validBrandTypes = ['WM(정상)', 'OL(정상)', 'WM(상설)', 'OL(상설)'];
        let typeColIdx = 2;
        for (let r = 0; r < rows.length; r++) {
          const cells = rows[r].c || [];
          for (let c = 0; c < cells.length; c++) {
            const val = cells[c] ? String(cells[c].f ?? cells[c].v ?? '').replace(/\s+/g, '') : '';
            if (validBrandTypes.includes(val)) {
              typeColIdx = c;
              break;
            }
          }
          if (typeColIdx !== 2) break;
        }

        const groupColIdx = Math.max(0, typeColIdx - 2);
        const storeColIdx = Math.max(0, typeColIdx - 1);

        const getCell = (cells, idx) => (cells && cells[idx]) ? cells[idx] : null;
        const getStr = (cells, idx) => {
          const c = getCell(cells, idx);
          if (!c) return '';
          if (c.f !== undefined && c.f !== null && String(c.f).trim() !== '') return String(c.f).trim();
          if (c.v !== undefined && c.v !== null) return String(c.v).trim();
          return '';
        };
        const fmtSale = (cells, idx) => {
          const c = getCell(cells, idx);
          if (!c || (c.v === null && !c.f)) return '-';
          if (c.f && String(c.f).trim() === '-') return '-';
          if (typeof c.v === 'number') return Math.round(c.v).toLocaleString('ko-KR');
          const s = String(c.f ?? c.v ?? '').trim();
          return s === '' ? '-' : s;
        };
        const fmtGr = (cells, idx) => {
          const c = getCell(cells, idx);
          if (!c || (c.v === null && !c.f)) return '-';
          if (c.f !== undefined && c.f !== null) {
            const fStr = String(c.f).trim();
            if (fStr === '-' || fStr.includes('%')) return fStr;
          }
          if (typeof c.v === 'number') return Math.round(c.v * 100) + '%';
          const s = String(c.v ?? '').trim();
          return s === '' ? '-' : s;
        };

        const defaultNotes = {};
        INITIAL_COMPLEX_DATA.forEach(item => {
          if (item.note) defaultNotes[item.store] = item.note;
        });

        const parsedStores = [];
        let currentGroup = "WM+OL+상설\n복합점";
        let currentStoreObj = null;

        for (let i = 0; i < rows.length; i++) {
          const cells = rows[i].c || [];
          const rawGroup = getStr(cells, groupColIdx);
          const rawStore = getStr(cells, storeColIdx);
          const rawType = getStr(cells, typeColIdx).replace(/\s+/g, '');
          const rawStoreClean = rawStore.replace(/\s+/g, '');

          if (rawGroup && (rawGroup.includes('WM') || rawGroup.includes('복합'))) {
            currentGroup = normalizeGroupName(rawGroup);
          }

          const isTotalRow = (
            rawType === '합계' ||
            rawType === '소계' ||
            rawStoreClean === '합계' ||
            rawStoreClean === '소계'
          );

          if (
            !isTotalRow &&
            rawStore &&
            rawStoreClean !== '매장명' &&
            !rawStoreClean.includes('합계') &&
            !rawStoreClean.includes('총계') &&
            !rawStoreClean.includes('실적현황')
          ) {
            if (rawStore.startsWith('(') && currentStoreObj) {
              currentStoreObj.note = rawStore.replace(/\s+/g, ' ').trim();
            } else {
              let sName = rawStore;
              let sNote = '';
              const parenIdx = rawStore.indexOf('(');
              if (parenIdx > 0) {
                sName = rawStore.slice(0, parenIdx).replace(/\s+/g, ' ').trim();
                sNote = rawStore.slice(parenIdx).replace(/\s+/g, ' ').trim();
              } else {
                sName = rawStore.replace(/\s+/g, ' ').trim();
                sNote = defaultNotes[sName] || '';
              }

              if (!currentStoreObj || currentStoreObj.store !== sName) {
                if (currentStoreObj && currentStoreObj.rows.length > 0) {
                  if (!currentStoreObj.total) {
                    currentStoreObj.total = buildFallbackTotal(currentStoreObj.rows);
                  }
                  parsedStores.push(currentStoreObj);
                }
                currentStoreObj = {
                  group: currentGroup,
                  store: sName,
                  note: sNote,
                  rows: [],
                  total: null
                };
              }
            }
          }

          const rawY25 = fmtSale(cells, typeColIdx + 1);
          // 25년 마감 매출이 없거나 0 이하인 경우('-', '0' 등) 판별
          const hasY25Sales = hasValidY25(rawY25);
          const normalizedY25 = hasY25Sales ? rawY25 : '-';

          const rowMetrics = {
            type: isTotalRow ? '합계' : rawType,
            y25: normalizedY25,
            w_sales: fmtSale(cells, typeColIdx + 2),
            w_avg: fmtSale(cells, typeColIdx + 3),
            w_gr: hasY25Sales ? fmtGr(cells, typeColIdx + 4) : '-',
            m_sales: fmtSale(cells, typeColIdx + 5),
            m_avg: fmtSale(cells, typeColIdx + 6),
            m_gr: hasY25Sales ? fmtGr(cells, typeColIdx + 7) : '-',
            y26_sales: fmtSale(cells, typeColIdx + 8),
            y26_avg: fmtSale(cells, typeColIdx + 9),
            y26_gr: hasY25Sales ? fmtGr(cells, typeColIdx + 10) : '-'
          };

          if (isTotalRow && currentStoreObj && currentStoreObj.rows.length > 0) {
            // 세부 복종 행 전체에 25년 마감 매출이 없다면 합계 행의 신장률도 무조건 '-' 처리
            const storeHasAnyY25 = currentStoreObj.rows.some(r => hasValidY25(r.y25)) && hasY25Sales;
            if (!storeHasAnyY25) {
              rowMetrics.y25 = '-';
              rowMetrics.w_gr = '-';
              rowMetrics.m_gr = '-';
              rowMetrics.y26_gr = '-';
            }
            currentStoreObj.total = rowMetrics;
            parsedStores.push(currentStoreObj);
            currentStoreObj = null;
          } else if (validBrandTypes.includes(rawType) && currentStoreObj) {
            currentStoreObj.rows.push(rowMetrics);
          }
        }

        if (currentStoreObj && currentStoreObj.rows.length > 0) {
          if (!currentStoreObj.total) {
            currentStoreObj.total = buildFallbackTotal(currentStoreObj.rows);
          }
          parsedStores.push(currentStoreObj);
        }

        if (parsedStores.length > 0) {
          storeDataset = parsedStores;
          renderGroupFilterTabs();
          renderTable();

          if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
          if (syncText) syncText.innerText = '실시간 시트 연동';
          if (isManualSync) {
            showToast(`구글 시트 실시간 동기화 완료 (${parsedStores.length}개 매장)`);
          }
        } else {
          if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
          if (syncText) syncText.innerText = '시트 스냅샷 모드';
        }
      } catch (err) {
        console.error("시트 데이터 파싱 오류:", err);
        if (syncDot) syncDot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500';
        if (syncText) syncText.innerText = '시트 스냅샷 모드';
      }
    };

    // =========================================================================
    // UI 및 테이블 렌더링 로직
    // =========================================================================
    function getGrowthClass(grStr, isTotalRow = false, isDarkFooter = false) {
      const s = String(grStr || '').trim();
      if (s === '-' || s === '' || s === '0%' || s === '0.0%') {
        return isDarkFooter ? 'text-zinc-400 font-semibold' : 'text-zinc-400 font-semibold';
      }
      const val = parseFloat(s.replace('%', ''));
      if (isNaN(val) || val === 0) {
        return isDarkFooter ? 'text-zinc-400 font-semibold' : 'text-zinc-400 font-semibold';
      }
      if (val > 0) {
        if (isDarkFooter) return 'text-rose-400 font-extrabold';
        return isTotalRow ? 'text-rose-600 font-extrabold' : 'text-rose-600 font-bold';
      } else {
        if (isDarkFooter) return 'text-sky-400 font-extrabold';
        return isTotalRow ? 'text-blue-600 font-extrabold' : 'text-blue-600 font-bold';
      }
    }

    function getBrandBadge(type) {
      if (type === 'WM(정상)') return '<span class="text-[10.5px] font-extrabold text-amber-700 bg-amber-500/15 px-1.5 py-0.5 rounded border border-amber-500/20">WM(정상)</span>';
      if (type === 'OL(정상)') return '<span class="text-[10.5px] font-extrabold text-emerald-700 bg-emerald-500/15 px-1.5 py-0.5 rounded border border-emerald-500/20">OL(정상)</span>';
      if (type === 'WM(상설)') return '<span class="text-[10.5px] font-extrabold text-rose-700 bg-rose-500/15 px-1.5 py-0.5 rounded border border-rose-500/20">WM(상설)</span>';
      if (type === 'OL(상설)') return '<span class="text-[10.5px] font-extrabold text-sky-700 bg-sky-500/15 px-1.5 py-0.5 rounded border border-sky-500/20">OL(상설)</span>';
      return `<span class="text-[10.5px] font-extrabold text-zinc-600 bg-zinc-100 px-1.5 py-0.5 rounded border border-zinc-200">${type}</span>`;
    }

    function toggleStore(storeName) {
      if (expandedStores.has(storeName)) {
        expandedStores.delete(storeName);
      } else {
        expandedStores.add(storeName);
      }
      
      const allStores = getFilteredStores().map(s => s.store);
      const allAreExpanded = allStores.every(s => expandedStores.has(s)) && allStores.length > 0;
      
      if (allExpanded && !allAreExpanded) {
        allExpanded = false;
        updateToggleAllBtn();
      } else if (!allExpanded && allAreExpanded) {
        allExpanded = true;
        updateToggleAllBtn();
      }
      renderTable();
    }

    function toggleAllExpanded() {
      allExpanded = !allExpanded;
      if (allExpanded) {
        getFilteredStores().forEach(s => expandedStores.add(s.store));
      } else {
        expandedStores.clear();
      }
      updateToggleAllBtn();
      renderTable();
    }

    function updateToggleAllBtn() {
      const btn = document.getElementById('toggleAllBtn');
      if (btn) {
        if (allExpanded) {
          btn.innerHTML = `<i class="fa-solid fa-compress text-[10px]"></i> 전체 세부매출 접기`;
          btn.className = 'px-3 py-1.5 rounded-xl text-[11px] font-extrabold bg-[#18181B] text-white transition flex items-center gap-1.5 shadow-2xs';
        } else {
          btn.innerHTML = `<i class="fa-solid fa-expand text-[10px]"></i> 전체 세부매출 펼치기`;
          btn.className = 'px-3 py-1.5 rounded-xl text-[11px] font-bold text-zinc-600 bg-white hover:text-[#18181B] hover:bg-[#F0EEE9] border border-[#E6E4DD] transition flex items-center gap-1.5 shadow-2xs';
        }
      }
    }

    function getFilteredStores() {
      const q = searchQuery.trim().toLowerCase();
      return storeDataset.filter(item => {
        const matchGroup = selectedGroup === 'ALL' || item.group.replace(/\s+/g, ' ') === selectedGroup.replace(/\s+/g, ' ');
        const matchSearch = !q || item.store.toLowerCase().includes(q) || (item.note && item.note.toLowerCase().includes(q)) || item.group.toLowerCase().includes(q);
        return matchGroup && matchSearch;
      });
    }

    function renderGroupFilterTabs() {
      const groups = [
        { key: 'ALL', label: '전체 복합점', count: storeDataset.length },
        { key: 'WM+OL+상설\n복합점', label: 'WM+OL+상설 복합점', count: storeDataset.filter(s => s.group.includes('WM+OL+상설')).length },
        { key: 'WM+OL\n복합점', label: 'WM+OL 복합점', count: storeDataset.filter(s => s.group === 'WM+OL\n복합점').length },
        { key: 'WM+상설\n복합점', label: 'WM+상설 복합점', count: storeDataset.filter(s => s.group.includes('WM+상설')).length }
      ];

      const container = document.getElementById('groupFilterTabs');
      container.innerHTML = groups.map(g => {
        const active = selectedGroup === g.key;
        return `
          <button onclick="setGroupFilter(${JSON.stringify(g.key).replace(/"/g, '&quot;')})" class="px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 ${active ? 'bg-[#18181B] text-white font-extrabold shadow-2xs' : 'bg-[#F7F6F2] text-zinc-600 hover:text-[#18181B] border border-[#E6E4DD] font-bold'}">
            <span>${g.label}</span>
            <span class="px-1.5 py-0.2 rounded-full text-[10px] ${active ? 'bg-amber-400 text-zinc-950 font-black' : 'bg-zinc-200/80 text-zinc-600 font-bold'}">${g.count}</span>
          </button>
        `;
      }).join('');
    }

    function renderTable() {
      const filteredStores = getFilteredStores();
      const tbody = document.getElementById('complexTableBody');

      if (filteredStores.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="13" class="py-16 text-center text-zinc-400 font-semibold text-sm">
              <i class="fa-solid fa-magnifying-glass text-xl mb-2 block text-zinc-300"></i>
              조건에 해당하는 복합매장이 없습니다.
            </td>
          </tr>
        `;
        return;
      }

      const groupsMap = new Map();
      filteredStores.forEach(store => {
        if (!groupsMap.has(store.group)) groupsMap.set(store.group, []);
        groupsMap.get(store.group).push(store);
      });

      let htmlRows = [];

      function generateDetailDataCells(r) {
        const wGr = formatGrowthValue(r, r.w_gr);
        const mGr = formatGrowthValue(r, r.m_gr);
        const y26Gr = formatGrowthValue(r, r.y26_gr);

        return `
          <td class="border-r border-[#E6E4DD] px-3 py-2 text-right font-semibold text-zinc-700 whitespace-nowrap">${r.y25}</td>
          <td class="border-r border-[#E6E4DD] px-3 py-2 text-right font-semibold text-zinc-900 whitespace-nowrap bg-amber-50/15">${r.w_sales}</td>
          <td class="border-r border-[#E6E4DD] px-3 py-2 text-right font-medium text-zinc-500 whitespace-nowrap bg-amber-50/15">${r.w_avg}</td>
          <td class="border-r border-[#E6E4DD] px-2.5 py-2 text-right whitespace-nowrap bg-amber-50/15 ${getGrowthClass(wGr)}">${wGr}</td>
          <td class="border-r border-[#E6E4DD] px-3 py-2 text-right font-semibold text-zinc-900 whitespace-nowrap">${r.m_sales}</td>
          <td class="border-r border-[#E6E4DD] px-3 py-2 text-right font-medium text-zinc-500 whitespace-nowrap">${r.m_avg}</td>
          <td class="border-r border-[#E6E4DD] px-2.5 py-2 text-right whitespace-nowrap ${getGrowthClass(mGr)}">${mGr}</td>
          <td class="border-r border-[#E6E4DD] px-3 py-2 text-right font-semibold text-zinc-900 whitespace-nowrap bg-sky-50/15">${r.y26_sales}</td>
          <td class="border-r border-[#E6E4DD] px-3 py-2 text-right font-medium text-zinc-500 whitespace-nowrap bg-sky-50/15">${r.y26_avg}</td>
          <td class="px-2.5 py-2 text-right whitespace-nowrap bg-sky-50/15 ${getGrowthClass(y26Gr)}">${y26Gr}</td>
        `;
      }

      function generateSummaryDataCells(t) {
        const wGr = formatGrowthValue(t, t.w_gr);
        const mGr = formatGrowthValue(t, t.m_gr);
        const y26Gr = formatGrowthValue(t, t.y26_gr);

        return `
          <td class="border-r border-[#E6E4DD] px-3 py-2.5 text-right font-extrabold text-amber-950 whitespace-nowrap bg-amber-50/40">${t.y25}</td>
          <td class="border-r border-[#E6E4DD] px-3 py-2.5 text-right font-extrabold text-amber-950 whitespace-nowrap bg-amber-100/50">${t.w_sales}</td>
          <td class="border-r border-[#E6E4DD] px-3 py-2.5 text-right font-bold text-amber-900 whitespace-nowrap bg-amber-100/50">${t.w_avg}</td>
          <td class="border-r border-[#E6E4DD] px-2.5 py-2.5 text-right whitespace-nowrap bg-amber-100/50 ${getGrowthClass(wGr, true)}">${wGr}</td>
          <td class="border-r border-[#E6E4DD] px-3 py-2.5 text-right font-extrabold text-amber-950 whitespace-nowrap bg-amber-50/40">${t.m_sales}</td>
          <td class="border-r border-[#E6E4DD] px-3 py-2.5 text-right font-bold text-amber-900 whitespace-nowrap bg-amber-50/40">${t.m_avg}</td>
          <td class="border-r border-[#E6E4DD] px-2.5 py-2.5 text-right whitespace-nowrap bg-amber-50/40 ${getGrowthClass(mGr, true)}">${mGr}</td>
          <td class="border-r border-[#E6E4DD] px-3 py-2.5 text-right font-extrabold text-amber-950 whitespace-nowrap bg-amber-100/50">${t.y26_sales}</td>
          <td class="border-r border-[#E6E4DD] px-3 py-2.5 text-right font-bold text-amber-900 whitespace-nowrap bg-amber-100/50">${t.y26_avg}</td>
          <td class="px-2.5 py-2.5 text-right whitespace-nowrap bg-amber-100/50 ${getGrowthClass(y26Gr, true)}">${y26Gr}</td>
        `;
      }

      groupsMap.forEach((stores, groupName) => {
        let groupRowSpan = 0;
        stores.forEach(s => {
           groupRowSpan += expandedStores.has(s.store) ? (s.rows.length + 1) : 1;
        });

        let groupCellRendered = false;

        stores.forEach((storeObj) => {
          const isExpanded = expandedStores.has(storeObj.store);
          const t = storeObj.total || buildFallbackTotal(storeObj.rows);

          const groupCellHtml = !groupCellRendered ?
            `<td rowspan="${groupRowSpan}" class="border-r border-b border-[#E6E4DD] px-2 py-2 text-center font-bold text-[11.5px] text-zinc-500 bg-zinc-50 whitespace-pre-line leading-relaxed shadow-[inset_-1px_0_0_rgba(0,0,0,0.02)]">
              ${groupName}
            </td>` : '';
          groupCellRendered = true;

          if (!isExpanded) {
            let tr = `<tr class="bg-white hover:bg-zinc-50 transition-colors border-b border-[#E6E4DD]">`;
            tr += groupCellHtml;
            tr += `
              <td onclick="toggleStore('${storeObj.store}')" class="border-r border-[#E6E4DD] px-3 py-2.5 text-left cursor-pointer group select-none">
                <div class="flex items-center justify-between">
                  <div class="flex items-center flex-wrap gap-1.5">
                    <span class="font-extrabold text-[13.5px] text-[#18181B] group-hover:text-amber-600 transition-colors">${storeObj.store}</span>
                    ${storeObj.note ? `<span class="text-[9.5px] font-bold text-amber-700 bg-amber-500/12 px-1.5 py-0.5 rounded border border-amber-500/20 leading-none">${storeObj.note}</span>` : ''}
                  </div>
                </div>
              </td>
              <td class="border-r border-[#E6E4DD] px-2 py-2.5 text-center font-extrabold text-[12px] text-amber-900 bg-amber-50/60 whitespace-nowrap">합계</td>
            `;
            tr += generateSummaryDataCells(t);
            tr += `</tr>`;
            htmlRows.push(tr);
          } else {
            const rowSpanCount = storeObj.rows.length + 1;
            
            storeObj.rows.forEach((r, idx) => {
              let tr = `<tr class="bg-white hover:bg-zinc-50 transition-colors ${idx === 0 ? 'border-t border-[#E6E4DD]' : ''}">`;
              if (idx === 0) {
                tr += groupCellHtml;
                tr += `
                  <td rowspan="${rowSpanCount}" onclick="toggleStore('${storeObj.store}')" class="border-r border-b border-[#E6E4DD] px-3 py-2 text-left cursor-pointer group select-none bg-white align-top pt-3">
                    <div class="flex items-center justify-between mb-1.5">
                      <div class="flex items-center flex-wrap gap-1.5">
                        <span class="font-extrabold text-[13px] text-[#18181B] group-hover:text-amber-600 transition-colors">${storeObj.store}</span>
                        ${storeObj.note ? `<span class="text-[9.5px] font-bold text-amber-700 bg-amber-500/12 px-1.5 py-0.5 rounded border border-amber-500/20 leading-none">${storeObj.note}</span>` : ''}
                      </div>
                    </div>
                  </td>
                `;
              }
              
              tr += `
                <td class="border-r border-[#E6E4DD] px-2 py-2 text-center select-none ${idx === 0 ? '' : 'border-t border-[#F0EEE9]'}">
                  ${getBrandBadge(r.type)}
                </td>
              `;
              tr += generateDetailDataCells(r);
              tr += `</tr>`;
              htmlRows.push(tr);
            });

            let tr = `<tr class="bg-[#FFFBEB] border-t-2 border-t-amber-200/60 border-b border-[#E6E4DD]">`;
            tr += `
              <td class="border-r border-[#E6E4DD] px-2 py-2.5 text-center font-extrabold text-[12px] text-amber-900 bg-amber-50/60 whitespace-nowrap">합계</td>
            `;
            tr += generateSummaryDataCells(t);
            tr += `</tr>`;
            htmlRows.push(tr);
          }
        });
      });

      tbody.innerHTML = htmlRows.join('');
    }

    function setGroupFilter(groupKey) {
      selectedGroup = groupKey;
      renderGroupFilterTabs();
      renderTable();
    }

    function handleSearchInput(val) {
      searchQuery = val || '';
      const clearBtn = document.getElementById('clearSearchBtn');
      if (searchQuery.trim().length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderTable();
    }

    function clearSearch() {
      const input = document.getElementById('storeSearchInput');
      input.value = '';
      handleSearchInput('');
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      renderGroupFilterTabs();
      renderTable();
      loadGoogleSheetData(false);
    });
  </script>
</body>
</html>
