      <div class="p-4 border-b border-[#E6E4DD] bg-zinc-50/50 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-[15px] font-extrabold text-[#18181B]">👕 아이템별 수량 판매율 상세 (<span id="seasonLabel2" class="text-amber-600">가을</span>)</h2>
          <p id="itemSubTitle" class="text-[11px] text-zinc-500 mt-1 font-medium">출고수량 대비 판매수량 및 지점/전국 평균 비교</p>
        </div>

      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">

              <th class="py-3 px-3 text-right">재고</th>
              <th class="py-3 px-4 text-right">판매율</th>
              <th id="brAvgColHeader" class="py-3 px-3 text-right">지점평균</th>
              <th id="natAvgColHeader" class="py-3 px-3 text-right">전국평균</th>

            </tr>
          </thead>

          </tbody>

  </main>

  <script>
    const DEFAULT_GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1LaxftgRnopl8GMdLwTd2fpWCX-2ObHJzmXm45Ixsu0c/edit?gid=1705650572#gid=1705650572";
    
    const BRANCH_MAP = { 'F': '서울', 'G': '경기', 'H': '강원' };
    const TARGET_BRANCHES = new Set(['F', 'G', 'H']);
    const BRAND_LIST = [
      { code: 'IN', name: '인디안',     korKeys: ['인디안'] },
      { code: 'BF', name: '브루노바피', korKeys: ['브루노바피', '브루노'] },
      { code: 'DL', name: '데일리스트', korKeys: ['데일리스트'] },
      { code: 'RE', name: '더레이블',   korKeys: ['더레이블', '레이블'] },
      { code: 'DU', name: '두아니',     korKeys: ['두아니'] }
    ];

    let parsedData = null;
    let currentSeason = '가을';
    let currentBrand = 'ALL';

    function getBranchKor(code) {
      return BRANCH_MAP[code] ? `${BRANCH_MAP[code]}지점` : (code ? `${code}지점` : '전국');
    }

    function parseNum(val) {
      if (val === null || val === undefined || val === '') return 0;
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      const n = parseFloat(String(val).replace(/,/g, '').replace(/%/g, '').trim());
      return isNaN(n) ? 0 : n;
    }

    function extractSheetId(input) {
      const match = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : input;
    }

    function loadGoogleSheetData() {
      const sheetId = extractSheetId(DEFAULT_GOOGLE_SHEET_URL);
      const icon = document.getElementById('syncIcon');
      const text = document.getElementById('syncStatusText');
      
      icon.className = 'fa-solid fa-circle-notch fa-spin text-amber-500';
      text.innerText = '구글 시트 실시간 연동 중...';
      text.className = 'text-xs text-amber-600 mt-1 font-bold flex items-center gap-1.5';

      const oldScript = document.getElementById('gviz_jsonp_script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'gviz_jsonp_script';
      script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:handleGoogleSheetJSONP&sheet=${encodeURIComponent('정상')}&headers=8&t=${Date.now()}`;
      
      script.onerror = () => {
        icon.className = 'fa-solid fa-circle-exclamation text-rose-500';
        text.innerText = '데이터 연동 실패. 시트 공유 권한을 확인해주세요.';
        text.className = 'text-xs text-rose-500 mt-1 font-bold flex items-center gap-1.5';
      };
      
      document.body.appendChild(script);
    }

    function cleanHeaderLabel(raw) {
      return String(raw || '')
        .replace(/기준일자\s*:\s*\S+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function extractSeasonFromLabel(str) {
      if (!str) return { season: null, rest: '' };
      let rest = str;
      let season = null;

      if (/FW\s*사계절|사계절/i.test(rest)) {
        season = 'FW사계절';
        rest = rest.replace(/FW\s*사계절|사계절/gi, ' ');
      } else if (/가을/.test(rest)) {
        season = '가을';
        rest = rest.replace(/가을/g, ' ');
      } else if (/겨울/.test(rest)) {
        season = '겨울';
        rest = rest.replace(/겨울/g, ' ');
      }
      return { season, rest: rest.replace(/\s+/g, ' ').trim() };
    }

    function extractSummaryMetric(str) {
      if (!str) return { metric: null, rest: '' };
      const defs = [
        { metric: '공급금액', re: /공급금액|공급액/ },
        { metric: '판매금액', re: /판매금액|판매액/ },
        { metric: '매출금액', re: /매출금액|매출액/ },
        { metric: '판매율',   re: /금액\s*판매율|판매율/ },
        { metric: '등급',     re: /매장\s*등급|등급/ }
      ];
      for (const d of defs) {
        if (d.re.test(str)) {
          return { metric: d.metric, rest: str.replace(d.re, ' ').replace(/\s+/g, ' ').trim() };
        }
      }
      return { metric: null, rest: str };
    }

    function extractSummaryBrand(str) {
      if (!str) return null;
      const tokens = str.toUpperCase().split(/\s+/).filter(Boolean);
      for (const b of BRAND_LIST) {
        if (b.korKeys.some(k => str.includes(k)) || tokens.includes(b.code)) {
          return { code: b.code, name: b.name };
        }
      }
      if (/합계|소계|TOTAL/i.test(str)) {
        return { code: '합계', name: '합계' };
      }
      return null;
    }

    const ITEM_OUT_RE  = /(?:^|\s)(출고수량|출고량|출고|공급수량|공급량|공급|입고수량|입고량|입고|배분수량|배분)$/;
    const ITEM_SALE_RE = /(?:^|\s)(판매수량|판매량|판매|매출수량)$/;
    const ITEM_RATE_RE = /(?:^|\s)(수량판매율|판매율|소진율)$/;

    function buildDynamicSchemaFromCols(cols) {
      if (!Array.isArray(cols) || cols.length < 20) return null;

      let branchCol = 0, codeCol = 1, nameCol = 2;
      for (let c = 0; c < Math.min(cols.length, 6); c++) {
        const lbl = String(cols[c]?.label || '').replace(/\s+/g, '');
        if (lbl.includes('지점')) branchCol = c;
        else if (lbl.includes('매장코드') || lbl.includes('점코드')) codeCol = c;
        else if (lbl.includes('매장명') || lbl.includes('점포명')) nameCol = c;
      }

      const startCol = Math.max(branchCol, codeCol, nameCol) + 1;
      const summaryMeta = [];
      const itemMeta = [];

      let lastSeason = '가을';
      let lastSummaryMetric = null;
      let lastItemBrand = { code: 'IN', name: '인디안' };
      let inItemSection = false;

      let c = startCol;
      while (c < cols.length) {
        const lbl0 = cleanHeaderLabel(cols[c]?.label);
        const lbl1 = c + 1 < cols.length ? cleanHeaderLabel(cols[c + 1]?.label) : '';
        const lbl2 = c + 2 < cols.length ? cleanHeaderLabel(cols[c + 2]?.label) : '';

        const outMatch = lbl0.match(ITEM_OUT_RE);
        const isSaleNext = ITEM_SALE_RE.test(lbl1);

        if (outMatch && isSaleNext) {
          inItemSection = true;
          const hasRateCol = ITEM_RATE_RE.test(lbl2);

          let rest = lbl0.slice(0, lbl0.length - outMatch[0].length).trim();
          const sRes = extractSeasonFromLabel(rest);
          if (sRes.season) lastSeason = sRes.season;
          rest = sRes.rest;

          let brandMatched = false;
          for (const b of BRAND_LIST) {
            const korHit = b.korKeys.find(k => rest.includes(k));
            if (korHit) {
              lastItemBrand = { code: b.code, name: b.name };
              const brandRe = new RegExp(`(?:^|\\s)(?:${b.code}\\s+)?${korHit}(?:\\s|$)`);
              rest = rest.replace(brandRe, ' ').replace(/\s+/g, ' ').trim();
              brandMatched = true;
              break;
            }
          }

          if (!brandMatched) {
            const twoCodeMatch = rest.match(/^(IN|BF|DL|RE|DU)\s+([A-Z0-9]{2,3}|합계|소계)(?:\s+|$)/);
            if (twoCodeMatch) {
              const bObj = BRAND_LIST.find(b => b.code === twoCodeMatch[1]);
              if (bObj) {
                lastItemBrand = { code: bObj.code, name: bObj.name };
                rest = rest.slice(twoCodeMatch[1].length).trim();
              }
            }
          }

          let itemCode = '';
          let itemName = '';
          if (rest === '합계' || rest === '소계') {
            itemCode = '합계';
            itemName = '합계';
          } else {
            const codeNameMatch = rest.match(/^([A-Z0-9]{2,3})\s*[\(\-\/:]?\s*(.+?)\)?$/);
            if (codeNameMatch) {
              itemCode = codeNameMatch[1];
              itemName = codeNameMatch[2].trim();
            } else if (rest) {
              itemCode = rest.slice(0, 2);
              itemName = rest;
            }
          }

          if (itemCode && itemName) {
            itemMeta.push({
              colOut: c,
              colSale: c + 1,
              colRate: hasRateCol ? c + 2 : c + 1,
              season: lastSeason,
              brandCode: lastItemBrand.code,
              brandName: lastItemBrand.name,
              itemCode,
              itemName
            });
          }

          c += hasRateCol ? 3 : 2;
          continue;
        }

        if (!inItemSection && lbl0) {
          const sRes = extractSeasonFromLabel(lbl0);
          if (sRes.season) lastSeason = sRes.season;

          const mRes = extractSummaryMetric(sRes.rest);
          if (mRes.metric) lastSummaryMetric = mRes.metric;

          const brand = extractSummaryBrand(mRes.rest);
          if (lastSummaryMetric && brand) {
            summaryMeta.push({
              col: c,
              season: lastSeason,
              metric: lastSummaryMetric,
              brandCode: brand.code,
              brandName: brand.name
            });
          }
        }

        c += 1;
      }

      const uniqueSeasons = new Set(summaryMeta.map(m => m.season));
      if (summaryMeta.length >= 10 && itemMeta.length >= 5 && uniqueSeasons.size >= 2) {
        return {
          summaryMeta,
          itemMeta,
          branchCol,
          codeCol,
          nameCol,
          mode: '동적 매핑'
        };
      }
      return null;
    }

    function buildExactSheetSchema() {
      const mainBrands4 = [['IN', '인디안'], ['BF', '브루노바피'], ['DL', '데일리스트'], ['RE', '더레이블']];
      const mainBrands5 = [...mainBrands4, ['합계', '합계']];
      const fwBrands2 = [['BF', '브루노바피'], ['DU', '두아니']];
      const fwBrands3 = [...fwBrands2, ['합계', '합계']];
      const metrics = ['등급', '공급금액', '판매금액', '매출금액', '판매율'];

      const summaryMeta = [];
      let col = 3; 

      ['가을', '겨울'].forEach(season => {
        metrics.forEach(metric => {
          const list = (metric === '등급') ? mainBrands4 : mainBrands5;
          list.forEach(([bCode, bName]) => { summaryMeta.push({ col: col++, season, metric, brandCode: bCode, brandName: bName }); });
        });
      });

      metrics.forEach(metric => {
        const list = (metric === '등급') ? fwBrands2 : fwBrands3;
        list.forEach(([bCode, bName]) => { summaryMeta.push({ col: col++, season: 'FW사계절', metric, brandCode: bCode, brandName: bName }); });
      });

      const itemGroups = [

    window.handleGoogleSheetJSONP = function(response) {
      try {
        const cols = response.table.cols || [];
        const rawRows = response.table.rows || [];
        const rows = rawRows.map(r => (r.c || []).map(cell => (cell && cell.v !== undefined && cell.v !== null) ? cell.v : null));
        
        let baseDate = '업데이트됨';
        for (const col of cols) {
          const lbl = String(col?.label || '');
          const m = lbl.match(/기준일자\s*:\s*([0-9./-]+)/);
          if (m) { baseDate = m[1].trim(); break; }
        }
        if (baseDate === '업데이트됨') {
          for (let r = 0; r < Math.min(6, rows.length); r++) {
            const found = (rows[r] || []).find(c => String(c || '').includes('기준일자'));
            if (found) { baseDate = String(found).replace(/기준일자\s*:\s*/g, '').trim(); break; }
          }
        }

        const schema = buildDynamicSchemaFromCols(cols) || buildExactSheetSchema();
        const { summaryMeta, itemMeta, branchCol, codeCol, nameCol, mode } = schema;

        let officialNatRow = null;
        for (let r = 0; r < Math.min(rows.length, 5); r++) {
          const row = rows[r] || [];
          const bStr = String(row[branchCol] ?? '').replace(/\s+/g, '');
          if (bStr === '합계' || bStr === '전체' || bStr === '총계') {
            officialNatRow = row;
            break;
          }
        }

        const allStores = [];
        const stores = [];
        const branches = new Set();
        const INVALID_BRANCH_WORDS = new Set(['지점', '지점코드', '합계', '총계', '전체', '등급별', '지점별', '소계', '평균', '구분']);

        for (let r = 0; r < rows.length; r++) {
          const row = rows[r];
          if (!row) continue;
          const branch = row[branchCol] ? String(row[branchCol]).trim() : '';
          const code = row[codeCol] ? String(row[codeCol]).trim() : '';
          const name = row[nameCol] ? String(row[nameCol]).trim() : '';

          if (
            !branch || !code || !name ||
            INVALID_BRANCH_WORDS.has(branch) ||
            code.startsWith('#') ||
            code.includes('매장코드') || code.includes('점코드') ||
            name === '매장명' || name.includes('합계') || name.includes('소계')
          ) {
            continue;
          }

          const record = { branch, code, name, raw: row };
          allStores.push(record);

          if (TARGET_BRANCHES.has(branch)) {
            branches.add(branch);
            stores.push(record);
          }
        }

        const displayStores = stores.length > 0 ? stores : allStores;
        if (stores.length === 0) {
          allStores.forEach(s => branches.add(s.branch));
        }
        const hasNationwide = Boolean(officialNatRow) || (allStores.length > displayStores.length);

        parsedData = {
          summaryMeta,
          itemMeta,
          officialNatRow,
          allStores,
          stores: displayStores,
          branches: Array.from(branches).sort(),
          hasNationwide,
          schemaMode: mode
        };
        
        const icon = document.getElementById('syncIcon');
        const text = document.getElementById('syncStatusText');
        icon.className = 'fa-solid fa-circle-check text-emerald-600';
        text.innerText = hasNationwide
          ? `기준일자: ${baseDate} | 중부 ${displayStores.length}개점 (전국 ${allStores.length}개점 비교 · ${mode})`
          : `기준일자: ${baseDate} | 중부 ${displayStores.length}개점 로드 완료 (${mode})`;
        text.className = 'text-xs text-emerald-700 mt-1 font-bold flex items-center gap-1.5';

        initControls();
        renderDashboard();
      } catch (err) {
        console.error('판매율 시트 파싱 오류:', err);
      }
    };

    function initControls() {
      const branchSelect = document.getElementById('branchSelect');
      branchSelect.innerHTML = `<option value="ALL">중부 전체 (${parsedData.stores.length}개 매장)</option>`;
      parsedData.branches.forEach(b => {
        const cnt = parsedData.stores.filter(s => s.branch === b).length;
        branchSelect.innerHTML += `<option value="${b}">${getBranchKor(b)} (${cnt}개)</option>`;
      });
      updateStoreDropdown();
    }

    function onBranchChange() {
      document.getElementById('storeSearchInput').value = '';
      updateStoreDropdown();
      renderDashboard();
    }

    function handleSearchInput() {
      updateStoreDropdown();
      const storeSelect = document.getElementById('storeSelect');
      storeSelect.selectedIndex = (document.getElementById('storeSearchInput').value.trim() !== '' && storeSelect.options.length > 1) ? 1 : 0;
      renderDashboard();
    }

    function updateStoreDropdown() {
      const branch = document.getElementById('branchSelect').value;
      const kw = document.getElementById('storeSearchInput').value.trim().toLowerCase();
      const storeSelect = document.getElementById('storeSelect');

      let filtered = parsedData.stores;
      if (branch !== 'ALL') filtered = filtered.filter(s => s.branch === branch);
      if (kw) filtered = filtered.filter(s => s.name.toLowerCase().includes(kw) || s.code.toLowerCase().includes(kw));

      const bKor = branch === 'ALL' ? '중부 전체' : getBranchKor(branch);
      storeSelect.innerHTML = `<option value="SUMMARY">👉 [${bKor}] 합계 보기 (${filtered.length}개)</option>`;
      filtered.forEach(s => {
        storeSelect.innerHTML += `<option value="${s.code}">[${BRANCH_MAP[s.branch] || s.branch}] ${s.name} (${s.code})</option>`;
      });
    }

    function setSeason(season) {
      currentSeason = season;
      currentBrand = 'ALL';
      document.querySelectorAll('.season-tab').forEach(btn => {
        btn.className = 'season-tab px-5 py-2 rounded-xl text-sm font-bold bg-white text-zinc-600 hover:text-[#18181B] hover:bg-zinc-50 border border-[#DFDDD4] transition active:scale-95';
      });

      document.getElementById('seasonLabel2').innerText = season;
      renderDashboard();

    function setBrandFilter(b) {
      currentBrand = b;

    function getTarget() {
      const branch = document.getElementById('branchSelect').value;
      const storeCode = document.getElementById('storeSelect').value;
      const kw = document.getElementById('storeSearchInput').value.trim().toLowerCase();

      if (storeCode !== 'SUMMARY') {
        const found = parsedData.stores.find(s => s.code === storeCode);
        return {
          type: '개별매장',
          title: found ? found.name : storeCode,
          sub: found ? `매장코드: ${found.code} | 소속: ${getBranchKor(found.branch)}` : '',
          branchCode: found ? found.branch : '',
          rows: found ? [found.raw] : []
        };
      } else {
        let list = parsedData.stores;
        if (branch !== 'ALL') list = list.filter(s => s.branch === branch);
        if (kw) list = list.filter(s => s.name.toLowerCase().includes(kw) || s.code.toLowerCase().includes(kw));
        return {
          type: branch === 'ALL' ? 'WM중부 전체' : '지점합계',
          title: branch === 'ALL' ? 'WM중부 전 지점 합계' : `${getBranchKor(branch)} 합계`,
          sub: `총 ${list.length}개 매장 합산`,
          branchCode: branch,
          rows: list.map(s => s.raw)
        };
      }
    }

    function calcAverages(seasonSummaryCols, seasonItems, branchCode) {
      const natBr = {}, brBr = {}, natIt = {}, brIt = {};
      const natRow = parsedData.officialNatRow;
      const natPool = parsedData.allStores;
      const brPool = (branchCode && branchCode !== 'ALL')
        ? parsedData.allStores.filter(s => s.branch === branchCode)
        : parsedData.stores;

      seasonSummaryCols.forEach(m => {
        if (m.metric === '공급금액') {
          const cSale = seasonSummaryCols.find(x => x.brandCode === m.brandCode && x.season === m.season && x.metric === '판매금액');
          if (!cSale) return;

          let nSup = natRow ? parseNum(natRow[m.col]) : 0;
          let nSal = natRow ? parseNum(natRow[cSale.col]) : 0;
          if (nSup <= 0) {
            nSup = 0; nSal = 0;
            natPool.forEach(s => { nSup += parseNum(s.raw[m.col]); nSal += parseNum(s.raw[cSale.col]); });
          }

          let bSup = 0, bSal = 0;
          brPool.forEach(s => { bSup += parseNum(s.raw[m.col]); bSal += parseNum(s.raw[cSale.col]); });

          natBr[m.brandCode] = nSup > 0 ? (nSal / nSup) * 100 : 0;
          brBr[m.brandCode] = bSup > 0 ? (bSal / bSup) * 100 : 0;
        }
      });

      seasonItems.forEach(m => {
        let nOut = natRow ? parseNum(natRow[m.colOut]) : 0;
        let nSal = natRow ? parseNum(natRow[m.colSale]) : 0;
        if (nOut <= 0) {
          nOut = 0; nSal = 0;
          natPool.forEach(s => { nOut += parseNum(s.raw[m.colOut]); nSal += parseNum(s.raw[m.colSale]); });
        }

        let bOut = 0, bSal = 0;
        brPool.forEach(s => { bOut += parseNum(s.raw[m.colOut]); bSal += parseNum(s.raw[m.colSale]); });

        natIt[m.itemCode + '_' + m.brandCode] = nOut > 0 ? (nSal / nOut) * 100 : 0;
        brIt[m.itemCode + '_' + m.brandCode] = bOut > 0 ? (bSal / bOut) * 100 : 0;
      });
      return { natBr, brBr, natIt, brIt };
    }

    function renderDashboard() {
      if (!parsedData) return;
      const target = getTarget();

      const sSum = parsedData.summaryMeta.filter(m => m.season === currentSeason);
      const sItm = parsedData.itemMeta.filter(m => m.season === currentSeason);
      const avgs = calcAverages(sSum, sItm, target.branchCode);

      const brAvgLabel = (target.branchCode && target.branchCode !== 'ALL') ? '지점평균' : '중부평균';
      const natAvgLabel = parsedData.hasNationwide ? '전국평균' : '중부평균';

      document.getElementById('brAvgColHeader').innerText = brAvgLabel;
      document.getElementById('natAvgColHeader').innerText = natAvgLabel;
      document.getElementById('itemSubTitle').innerText = `출고수량 대비 판매수량 및 ${brAvgLabel}/${natAvgLabel} 비교`;

      let gradeBannerText = `${currentSeason} 등급: 합계`;
      if (target.rows.length === 1) {
        const gradeCols = sSum.filter(m => m.metric === '등급');
        const gradeTokens = gradeCols
          .map(g => {
            const val = String(target.rows[0][g.col] ?? '').trim();
            return val && val !== '-' ? `${g.brandCode} ${val}` : null;
          })
          .filter(Boolean);
        gradeBannerText = gradeTokens.length > 0
          ? `${currentSeason} 등급: ${gradeTokens.join(' · ')}`
          : `${currentSeason} 등급: -`;
      }

      document.getElementById('targetBanner').classList.remove('hidden');
      document.getElementById('badgeType').innerText = target.type;
      document.getElementById('targetTitle').innerText = target.title;
      document.getElementById('targetSub').innerText = target.sub;
      document.getElementById('targetGrade').innerText = gradeBannerText;

      const brands = [];
      sSum.forEach(m => { if (m.brandCode && !brands.find(b => b.code === m.brandCode)) brands.push({ code: m.brandCode, name: m.brandName }); });

      const brandCardsHtml = brands.map(b => {
        const cSup = sSum.find(m => m.brandCode === b.code && m.metric === '공급금액');
        const cSal = sSum.find(m => m.brandCode === b.code && m.metric === '판매금액');
        const cGrd = sSum.find(m => m.brandCode === b.code && m.metric === '등급');

        let sup = 0, sal = 0, grd = '-';
        target.rows.forEach(r => {
          if (cSup) sup += parseNum(r[cSup.col]);
          if (cSal) sal += parseNum(r[cSal.col]);
        });
        if (target.rows.length === 1 && cGrd) grd = String(target.rows[0][cGrd.col] || '-').trim();
        
        const rate = sup > 0 ? (sal / sup) * 100 : 0;
        const isTotal = (b.code === '합계');

        return `
          <div class="p-4 flex flex-col justify-between rounded-xl border ${isTotal ? 'bg-[#18181B] text-white border-[#18181B] shadow-md sm:col-span-2 lg:col-span-1' : 'bg-white border-[#DFDDD4] shadow-sm'}">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="font-extrabold text-[13px] ${isTotal ? 'text-amber-400' : 'text-[#18181B]'}">${b.name}</span>
                ${grd !== '-' && grd !== '미입점' && !isTotal ? `<span class="text-[10.5px] px-1.5 py-0.5 rounded bg-amber-50 border border-amber-200 text-amber-700 font-extrabold">${grd}등급</span>` : ''}
                ${grd === '미입점' && !isTotal ? `<span class="text-[10.5px] px-1.5 py-0.5 rounded bg-zinc-100 text-zinc-400 font-bold">미입점</span>` : ''}
              </div>
              <div class="text-[22px] font-black tracking-tight ${isTotal ? 'text-white' : 'text-[#18181B]'} mb-3">${rate.toFixed(1)}%</div>
              <div class="bar-bg mb-4 ${isTotal ? 'bg-zinc-700' : ''}">
                <div class="bar-fill ${rate >= 20 ? 'bg-emerald-500' : rate >= 12 ? 'bg-amber-500' : 'bg-rose-500'}" style="width: ${Math.min(rate * 2.5, 100)}%"></div>
              </div>
            </div>
            <div class="space-y-1 text-[11px] pt-2 border-t ${isTotal ? 'border-zinc-700 text-zinc-400' : 'border-[#E6E4DD] text-zinc-500'}">
              <div class="flex justify-between"><span>${brAvgLabel}</span><span class="font-bold ${(avgs.brBr[b.code] || 0) <= rate ? 'text-emerald-500' : 'text-rose-400'}">${(avgs.brBr[b.code]||0).toFixed(1)}%</span></div>
              <div class="flex justify-between"><span>${natAvgLabel}</span><span class="font-bold ${(avgs.natBr[b.code] || 0) <= rate ? 'text-emerald-500' : 'text-rose-400'}">${(avgs.natBr[b.code]||0).toFixed(1)}%</span></div>
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('brandSummaryGrid').innerHTML = brandCardsHtml;

      const itemBrands = [];

        filterBtnsHtml += `<button onclick="setBrandFilter('${b.code}')" class="px-3 py-1.5 rounded-lg text-[11px] font-extrabold transition ${act ? 'bg-amber-400 text-zinc-900 shadow-sm' : 'bg-zinc-100 text-zinc-600 hover:bg-zinc-200'}">${b.name}</button>`;

      document.getElementById('brandFilterBtns').innerHTML = filterBtnsHtml;

      let fItm = currentBrand === 'ALL' ? sItm : sItm.filter(m => m.brandCode === currentBrand);

        let outQ = 0, salQ = 0;
        target.rows.forEach(r => { outQ += parseNum(r[m.colOut]); salQ += parseNum(r[m.colSale]); });
        const rate = outQ > 0 ? (salQ / outQ) * 100 : 0;
        const key = m.itemCode + '_' + m.brandCode;
        return { ...m, outQ, salQ, stkQ: outQ - salQ, rate, brAvg: avgs.brIt[key]||0, natAvg: avgs.natIt[key]||0 };
      });

      const sort = document.getElementById('sortSelect').value;
      if (sort !== 'default') {
        const nrm = rData.filter(d => d.itemCode !== '합계');
        const tot = rData.filter(d => d.itemCode === '합계');
        if (sort === 'rate_desc') nrm.sort((a, b) => b.rate - a.rate);
        if (sort === 'sale_desc') nrm.sort((a, b) => b.salQ - a.salQ);
        if (sort === 'out_desc') nrm.sort((a, b) => b.outQ - a.outQ);
        rData = [...nrm, ...tot];
      }

      const tbodyHtml = rData.map(d => {
        const isTot = d.itemCode === '합계';
        const trCls = isTot ? 'bg-amber-50/50 font-extrabold text-[#18181B] border-t-2 border-amber-200' : 'hover:bg-zinc-50 font-medium text-zinc-800 transition-colors';
        const rateCol = d.rate >= 20 ? 'text-emerald-600 font-extrabold' : d.rate >= 12 ? 'text-amber-600 font-bold' : 'text-zinc-600';
        const barCol = d.rate >= 20 ? 'bg-emerald-500' : d.rate >= 12 ? 'bg-amber-500' : 'bg-zinc-400';

        return `
          <tr class="${trCls}">
            <td class="py-3 px-4">${d.brandName}</td>
            <td class="py-3 px-3 text-center text-xs font-mono text-zinc-400">${d.itemCode}</td>
            <td class="py-3 px-4 text-[13px]">${d.itemName}</td>
            <td class="py-3 px-3 text-right font-mono">${Math.round(d.outQ).toLocaleString()}</td>
            <td class="py-3 px-3 text-right font-mono text-blue-600 font-bold">${Math.round(d.salQ).toLocaleString()}</td>
            <td class="py-3 px-3 text-right font-mono text-zinc-400">${Math.round(d.stkQ).toLocaleString()}</td>
            <td class="py-3 px-4 text-right font-mono ${rateCol}">${d.rate.toFixed(1)}%</td>
            <td class="py-3 px-3 text-right font-mono text-zinc-500">${d.brAvg.toFixed(1)}%</td>
            <td class="py-3 px-3 text-right font-mono text-zinc-500">${d.natAvg.toFixed(1)}%</td>
            <td class="py-3 px-4 hidden sm:table-cell align-middle">
              <div class="bar-bg"><div class="bar-fill ${barCol}" style="width: ${Math.min(d.rate * 2, 100)}%"></div></div>
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('itemTableBody').innerHTML = tbodyHtml || '<tr><td colspan="10" class="py-10 text-center text-zinc-400 text-sm">해당 조건의 데이터가 없습니다.</td></tr>';
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadGoogleSheetData();
    });
  </script>
</body>
</html>
