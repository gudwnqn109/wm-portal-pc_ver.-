<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FW 주간 매장별 판매율 대시보드 (PC/시트연동)</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <style>
    body { 
      font-family: 'Pretendard', sans-serif; 
      background-color: #F7F6F2; 
      color: #18181B;
      margin: 0; 
    }
    .bar-bg { background-color: #E6E4DD; border-radius: 9999px; overflow: hidden; height: 8px; }
    .bar-fill { height: 100%; border-radius: 9999px; transition: width 0.3s ease; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(161, 161, 170, 0.4); border-radius: 9999px; }
  </style>
</head>
<body class="pb-12 min-h-screen flex flex-col">

  <!-- 상단 컨트롤 헤더 -->
  <header class="bg-white border-b border-[#E6E4DD] sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-5 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="bg-[#18181B] text-amber-400 font-black text-[10.5px] px-2 py-0.5 rounded tracking-tight">WM중부</span>
          <h1 class="text-lg font-extrabold tracking-tight text-[#18181B]">FW 매장별 판매율 대시보드</h1>
        </div>
        <p id="dateInfo" class="text-xs text-zinc-500 mt-1 font-medium flex items-center gap-1.5">
          <i class="fa-solid fa-circle-notch fa-spin text-amber-500" id="syncIcon"></i>
          <span id="syncStatusText">구글 시트 데이터 연동 중...</span>
        </p>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <button onclick="loadGoogleSheetData()" class="bg-white border border-[#E6E4DD] hover:bg-zinc-50 text-zinc-700 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 active:scale-95 shadow-sm">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>새로고침</span>
        </button>
      </div>
    </div>

    <!-- 검색 및 필터 바 -->
    <div class="max-w-7xl mx-auto px-5 pb-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-[#F7F6F2] p-3 rounded-xl border border-[#DFDDD4]">
        <div>
          <label class="block text-[10.5px] font-extrabold text-zinc-500 uppercase mb-1.5 pl-1">1. 지점 선택</label>
          <select id="branchSelect" onchange="onBranchChange()" class="w-full bg-white border border-[#E6E4DD] rounded-lg px-3 py-2 text-sm font-semibold text-[#18181B] focus:ring-2 focus:ring-amber-400 focus:outline-none transition">
            <option value="ALL">전체 합계 로딩 중...</option>
          </select>
        </div>
        <div>
          <label class="block text-[10.5px] font-extrabold text-zinc-500 uppercase mb-1.5 pl-1">2. 매장 검색</label>
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass text-zinc-400 text-xs absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="storeSearchInput" oninput="handleSearchInput()" placeholder="용인점, WMH099..." class="w-full bg-white border border-[#E6E4DD] rounded-lg pl-8 pr-3 py-2 text-sm font-medium text-[#18181B] focus:ring-2 focus:ring-amber-400 focus:outline-none transition" />
          </div>
        </div>
        <div>
          <label class="block text-[10.5px] font-extrabold text-zinc-500 uppercase mb-1.5 pl-1">3. 조회 대상 선택</label>
          <select id="storeSelect" onchange="renderDashboard()" class="w-full bg-[#18181B] border border-[#18181B] text-amber-400 rounded-lg px-3 py-2 text-sm font-bold focus:ring-2 focus:ring-amber-400 focus:outline-none transition cursor-pointer">
            <option value="SUMMARY">👉 대기 중...</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-5 mt-6 space-y-6">

    <!-- 선택 정보 배너 -->
    <div id="targetBanner" class="bg-white p-4 rounded-2xl border border-[#DFDDD4] shadow-sm flex flex-wrap items-center justify-between gap-4 hidden animate-view">
      <div class="flex items-center gap-3">
        <span class="px-2.5 py-1 bg-zinc-800 text-amber-300 rounded-lg font-black text-xs shrink-0" id="badgeType">지점합계</span>
        <div>
          <h2 class="font-extrabold text-lg text-[#18181B]" id="targetTitle">-</h2>
          <p class="text-xs text-zinc-500 font-medium mt-0.5" id="targetSub">-</p>
        </div>
      </div>
      <div class="text-xs font-bold text-zinc-600 bg-zinc-100 px-3 py-1.5 rounded-lg border border-zinc-200" id="targetGrade">
        종합 등급: -
      </div>
    </div>

    <!-- 시즌 선택 탭 -->
    <div class="flex gap-2 border-b border-[#E6E4DD] pb-3">
      <button onclick="setSeason('가을')" id="tab-가을" class="season-tab px-5 py-2 rounded-xl text-sm font-extrabold bg-[#18181B] text-white shadow-sm transition active:scale-95">🍂 가을 시즌</button>
      <button onclick="setSeason('겨울')" id="tab-겨울" class="season-tab px-5 py-2 rounded-xl text-sm font-bold bg-white text-zinc-600 hover:text-[#18181B] hover:bg-zinc-50 border border-[#DFDDD4] transition active:scale-95">❄️ 겨울 시즌</button>
      <button onclick="setSeason('FW사계절')" id="tab-FW사계절" class="season-tab px-5 py-2 rounded-xl text-sm font-bold bg-white text-zinc-600 hover:text-[#18181B] hover:bg-zinc-50 border border-[#DFDDD4] transition active:scale-95">👔 FW 사계절</button>
    </div>

    <!-- [파트 1] 브랜드별 판매율 요약 -->
    <section>
      <div class="flex items-center justify-between mb-3 pl-1">
        <h2 class="text-[15px] font-extrabold text-[#18181B]">📌 브랜드별 금액 판매율 (<span id="seasonLabel1" class="text-amber-600">가을</span>)</h2>
        <span class="text-[11px] font-medium text-zinc-400 bg-white px-2 py-0.5 rounded border border-[#E6E4DD]">판매금액 ÷ 공급금액</span>
      </div>
      <div id="brandSummaryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
        <div class="col-span-full py-12 text-center text-zinc-400 font-medium text-sm">
          시트 데이터를 불러오는 중입니다...
        </div>
      </div>
    </section>

    <!-- [파트 2] 복종별 수량 판매율 상세 -->
    <section class="bg-white rounded-2xl shadow-sm border border-[#DFDDD4] overflow-hidden">
      <div class="p-4 border-b border-[#E6E4DD] bg-zinc-50/50 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-[15px] font-extrabold text-[#18181B]">👕 아이템별 수량 판매율 상세 (<span id="seasonLabel2" class="text-amber-600">가을</span>)</h2>
          <p id="itemSubTitle" class="text-[11px] text-zinc-500 mt-1 font-medium">출고수량 대비 판매수량 및 지점/전국 평균 비교</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <div id="brandFilterBtns" class="flex flex-wrap gap-1.5"></div>
          <select id="sortSelect" onchange="renderDashboard()" class="bg-white border border-[#DFDDD4] rounded-lg px-3 py-1.5 text-xs font-bold text-[#18181B] focus:outline-none shadow-sm cursor-pointer ml-2">
            <option value="default">기본 정렬순</option>
            <option value="rate_desc">🔥 판매율 높은순</option>
            <option value="sale_desc">📈 판매량 많은순</option>
            <option value="out_desc">📦 출고량 많은순</option>
          </select>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-[#F7F6F2] text-zinc-500 text-xs font-extrabold uppercase border-b border-[#E6E4DD]">
              <th class="py-3 px-4">브랜드</th>
              <th class="py-3 px-3 text-center">코드</th>
              <th class="py-3 px-4">복종명 (아이템)</th>
              <th class="py-3 px-3 text-right">출고</th>
              <th class="py-3 px-3 text-right">판매</th>
              <th class="py-3 px-3 text-right">재고</th>
              <th class="py-3 px-4 text-right">판매율</th>
              <th id="brAvgColHeader" class="py-3 px-3 text-right">지점평균</th>
              <th id="natAvgColHeader" class="py-3 px-3 text-right">전국평균</th>
              <th class="py-3 px-4 text-center w-32 hidden sm:table-cell">그래프</th>
            </tr>
          </thead>
          <tbody id="itemTableBody" class="divide-y divide-[#F0EEE9]">
            <tr><td colspan="10" class="py-10 text-center text-zinc-400 font-medium">데이터 로딩 중...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const DEFAULT_GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1LaxftgRnopl8GMdLwTd2fpWCX-2ObHJzmXm45Ixsu0c/edit?gid=1705650572#gid=1705650572";
    
    const BRANCH_MAP = { 'F': '서울', 'G': '경기', 'H': '강원' };
    const TARGET_BRANCHES = new Set(['F', 'G', 'H']);
    const BRAND_ALIAS_MAP = [
      { code: 'IN', name: '인디안',     keys: ['IN', '인디안'] },
      { code: 'BF', name: '브루노바피', keys: ['BF', '브루노바피', '브루노'] },
      { code: 'DL', name: '데일리스트', keys: ['DL', '데일리스트'] },
      { code: 'RE', name: '더레이블',   keys: ['RE', '더레이블', '레이블'] },
      { code: 'DU', name: '두아니',     keys: ['DU', '두아니'] },
      { code: '합계', name: '합계',     keys: ['합계', '소계', 'TOTAL'] }
    ];

    let parsedData = null;
    let currentSeason = '가을';
    let currentBrand = 'ALL';

    function getBranchKor(code) {
      return BRANCH_MAP[code] ? `${BRANCH_MAP[code]}지점` : (code ? `${code}지점` : '전국');
    }

    function parseNum(val) {
      if (val === null || val === undefined || val === '') return 0;
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      const n = parseFloat(String(val).replace(/,/g, '').replace(/%/g, '').trim());
      return isNaN(n) ? 0 : n;
    }

    function extractSheetId(input) {
      const match = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : input;
    }

    function loadGoogleSheetData() {
      const sheetId = extractSheetId(DEFAULT_GOOGLE_SHEET_URL);
      const icon = document.getElementById('syncIcon');
      const text = document.getElementById('syncStatusText');
      
      icon.className = 'fa-solid fa-circle-notch fa-spin text-amber-500';
      text.innerText = '구글 시트 실시간 연동 중...';
      text.className = 'text-xs text-amber-600 mt-1 font-bold flex items-center gap-1.5';

      const oldScript = document.getElementById('gviz_jsonp_script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'gviz_jsonp_script';
      script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:handleGoogleSheetJSONP&sheet=${encodeURIComponent('정상')}&headers=0&t=${Date.now()}`;
      
      script.onerror = () => {
        icon.className = 'fa-solid fa-circle-exclamation text-rose-500';
        text.innerText = '데이터 연동 실패. 시트 공유 권한을 확인해주세요.';
        text.className = 'text-xs text-rose-500 mt-1 font-bold flex items-center gap-1.5';
      };
      
      document.body.appendChild(script);
    }

    // =========================================================================
    // [1] 동적 헤더 스키마 파서 (시트 열 변경/추가 시 자동 대응)
    // =========================================================================
    function matchSeasonText(txt) {
      const s = String(txt || '').replace(/\s+/g, '').toUpperCase();
      if (!s) return null;
      if (s.includes('FW사계절') || s.includes('사계절')) return 'FW사계절';
      if (s.includes('가을')) return '가을';
      if (s.includes('겨울')) return '겨울';
      return null;
    }

    function matchBrandText(txt) {
      const clean = String(txt || '').replace(/\s+/g, '').toUpperCase();
      if (!clean) return null;
      for (const b of BRAND_ALIAS_MAP) {
        if (b.keys.some(k => clean === k || clean.includes(`(${k})`) || (k.length >= 2 && clean.includes(k)))) {
          return { code: b.code, name: b.name };
        }
      }
      return null;
    }

    function matchSummaryMetricText(txt) {
      const s = String(txt || '').replace(/\s+/g, '');
      if (!s) return null;
      if (s === '등급' || s.includes('매장등급')) return '등급';
      if (s.includes('공급금액') || s === '공급액') return '공급금액';
      if (s.includes('판매금액') || s === '판매액') return '판매금액';
      if (s.includes('매출금액') || s === '매출액') return '매출금액';
      if (s === '판매율' || s.includes('금액판매율')) return '판매율';
      return null;
    }

    function matchItemMetricText(txt) {
      const s = String(txt || '').replace(/\s+/g, '');
      if (!s) return null;
      if (s === '출고' || s.includes('출고수량') || s === '공급수량') return 'out';
      if (s === '판매' || s.includes('판매수량')) return 'sale';
      if (s === '판매율' || s.includes('수량판매율')) return 'rate';
      return null;
    }

    function detectBaseColumnsAndDataStart(rows) {
      let branchCol = 0, codeCol = 1, nameCol = 2;
      let dataStartRow = -1;

      const scanLimit = Math.min(rows.length, 20);
      for (let r = 0; r < scanLimit; r++) {
        const row = rows[r] || [];
        for (let c = 0; c < Math.min(row.length, 10); c++) {
          const s = String(row[c] ?? '').replace(/\s+/g, '');
          if (s === '지점' || s === '지점코드') branchCol = c;
          else if (s === '매장코드' || s === '점코드') codeCol = c;
          else if (s === '매장명' || s === '점포명') nameCol = c;
        }
      }

      for (let r = 0; r < Math.min(rows.length, 30); r++) {
        const row = rows[r] || [];
        const b = String(row[branchCol] ?? '').trim();
        const cd = String(row[codeCol] ?? '').trim();
        const nm = String(row[nameCol] ?? '').trim();
        const looksLikeStoreCode = /^[A-Za-z0-9]{4,}$/.test(cd) && !cd.startsWith('#');
        const looksLikeBranch = /^[A-Za-z가-힣]{1,4}$/.test(b) && !['지점', '합계', '전체', '등급별', '지점별', '소계', '구분'].includes(b);
        if (looksLikeBranch && looksLikeStoreCode && nm && nm !== '매장명') {
          dataStartRow = r;
          break;
        }
      }

      if (dataStartRow === -1) dataStartRow = Math.min(6, rows.length);
      return { branchCol, codeCol, nameCol, dataStartRow };
    }

    function buildDynamicSheetSchema(rows) {
      const { branchCol, codeCol, nameCol, dataStartRow } = detectBaseColumnsAndDataStart(rows);
      const headerRows = rows.slice(0, dataStartRow);
      if (headerRows.length === 0) return null;

      const maxCols = Math.max(...headerRows.map(r => (r ? r.length : 0)));
      const startCol = Math.max(branchCol, codeCol, nameCol) + 1;

      // 병합 셀 복원 (상위 행이 바뀌면 하위 행 carry-forward 초기화)
      const rawGrid = headerRows.map(r => {
        const arr = new Array(maxCols).fill('');
        for (let c = 0; c < maxCols; c++) {
          const v = r && r[c] !== null && r[c] !== undefined ? String(r[c]).trim() : '';
          arr[c] = v;
        }
        return arr;
      });

      const filledGrid = rawGrid.map(row => [...row]);
      for (let r = 0; r < rawGrid.length; r++) {
        for (let c = startCol; c < maxCols; c++) {
          if (filledGrid[r][c] !== '') continue;
          let parentChanged = false;
          for (let pr = 0; pr < r; pr++) {
            if (rawGrid[pr][c] !== '') {
              parentChanged = true;
              break;
            }
          }
          if (!parentChanged && c > startCol) {
            filledGrid[r][c] = filledGrid[r][c - 1];
          }
        }
      }

      const getColTexts = (c, useFilled = true) => {
        const src = useFilled ? filledGrid : rawGrid;
        return src.map(r => r[c] || '');
      };

      const findLastNonEmpty = (c) => {
        for (let r = rawGrid.length - 1; r >= 0; r--) {
          if (rawGrid[r][c]) return { row: r, text: rawGrid[r][c] };
        }
        return { row: -1, text: '' };
      };

      const summaryMeta = [];
      const itemMeta = [];
      let lastSeason = '가을';
      let lastBrand = { code: 'IN', name: '인디안' };

      let c = startCol;
      while (c < maxCols) {
        const filledStack = getColTexts(c, true);
        const rawStack = getColTexts(c, false);

        // 현재 열의 시즌·브랜드 추정
        let colSeason = null;
        let colBrand = null;
        for (const t of filledStack) {
          const s = matchSeasonText(t);
          if (s) colSeason = s;
        }
        for (const t of filledStack) {
          const b = matchBrandText(t);
          if (b) colBrand = b;
        }
        if (colSeason) lastSeason = colSeason;
        if (colBrand) lastBrand = colBrand;

        // 1) 아이템 3열 묶음(출고 / 판매 / 판매율) 감지
        const bot0 = findLastNonEmpty(c).text;
        const bot1 = c + 1 < maxCols ? findLastNonEmpty(c + 1).text : '';
        const bot2 = c + 2 < maxCols ? findLastNonEmpty(c + 2).text : '';

        if (matchItemMetricText(bot0) === 'out' && matchItemMetricText(bot1) === 'sale') {
          const hasRateCol = matchItemMetricText(bot2) === 'rate';
          const metricRowIdx = findLastNonEmpty(c).row;

          // 아이템 코드 & 복종명 추출 (출고/판매/판매율 바로 위 헤더 행들 탐색)
          let itemCode = '';
          let itemName = '';
          for (let r = metricRowIdx - 1; r >= 0; r--) {
            const cellTxt = (filledGrid[r][c] || rawGrid[r][c] || '').trim();
            if (!cellTxt) continue;
            if (matchSeasonText(cellTxt) || matchSummaryMetricText(cellTxt)) continue;

            const isExactBrand = BRAND_ALIAS_MAP.some(b =>
              b.code !== '합계' && b.keys.some(k => cellTxt.replace(/\s+/g, '').toUpperCase() === k)
            );
            if (isExactBrand) continue;

            if (cellTxt === '합계' || cellTxt === '소계') {
              itemCode = '합계';
              itemName = '합계';
              break;
            }

            // "AL 티셔츠 긴팔" 또는 "AL(티셔츠)" 형태 분리
            const combinedMatch = cellTxt.match(/^([A-Z0-9]{2,3})\s*[\(\-\/:]?\s*(.+?)\)?$/);
            if (combinedMatch && !itemCode && !itemName) {
              itemCode = combinedMatch[1];
              itemName = combinedMatch[2].trim();
              break;
            }

            if (/^[A-Z0-9]{2,3}$/.test(cellTxt) && !itemCode) {
              itemCode = cellTxt;
            } else if (!itemName) {
              itemName = cellTxt;
            }
          }

          if (!itemCode && itemName) itemCode = itemName === '합계' ? '합계' : itemName.slice(0, 2);
          if (!itemName && itemCode) itemName = itemCode;

          if (itemCode && itemName) {
            // 아이템 행에서 브랜드가 합계로 잘못 덮였을 때 이전 유효 브랜드 유지
            const itemBrand = (colBrand && colBrand.code !== '합계') ? colBrand : lastBrand;
            itemMeta.push({
              colOut: c,
              colSale: c + 1,
              colRate: hasRateCol ? c + 2 : c + 1,
              season: colSeason || lastSeason,
              brandCode: itemBrand.code,
              brandName: itemBrand.name,
              itemCode,
              itemName
            });
          }
          c += hasRateCol ? 3 : 2;
          continue;
        }

        // 2) 브랜드 요약 컬럼 (등급 / 공급금액 / 판매금액 / 매출금액 / 판매율) 감지
        let summaryMetric = null;
        for (const t of filledStack) {
          const m = matchSummaryMetricText(t);
          if (m) summaryMetric = m;
        }

        // 하단 셀에서 브랜드명/코드 우선 탐색
        let sumBrand = null;
        for (let r = rawStack.length - 1; r >= 0; r--) {
          const b = matchBrandText(rawStack[r]);
          if (b) { sumBrand = b; break; }
        }
        if (!sumBrand) sumBrand = colBrand;

        if (summaryMetric && sumBrand && (colSeason || lastSeason)) {
          summaryMeta.push({
            col: c,
            season: colSeason || lastSeason,
            metric: summaryMetric,
            brandCode: sumBrand.code,
            brandName: sumBrand.name
          });
        }
        c += 1;
      }

      // 유효성 검증: 최소 요약 10컬럼, 아이템 5개, 2개 이상 시즌 확보 시 동적 스키마 채택
      const uniqueSeasons = new Set(summaryMeta.map(m => m.season));
      if (summaryMeta.length >= 10 && itemMeta.length >= 5 && uniqueSeasons.size >= 2) {
        return {
          summaryMeta,
          itemMeta,
          branchCol,
          codeCol,
          nameCol,
          dataStartRow,
          mode: '동적 매핑'
        };
      }
      return null;
    }

    // =========================================================================
    // [3] JSONP 응답 파싱 (전국 전체 allStores와 중부 stores 분리 저장)
    // =========================================================================
    window.handleGoogleSheetJSONP = function(response) {
      try {
        const rawRows = response.table.rows || [];
        const rows = rawRows.map(r => (r.c || []).map(cell => (cell && cell.v !== undefined && cell.v !== null) ? cell.v : null));
        
        let baseDate = '업데이트됨';
        for (let r = 0; r < Math.min(6, rows.length); r++) {
          if (!rows[r]) continue;
          const found = rows[r].find(c => String(c || '').includes('기준일자'));
          if (found) baseDate = String(found).replace(/기준일자\s*:\s*/g, '').trim();
        }

        // 동적 스키마 우선 적용, 실패 시 기본 스키마 폴백
        const schema = buildDynamicSheetSchema(rows) || buildExactSheetSchema();
        const { summaryMeta, itemMeta, branchCol, codeCol, nameCol, dataStartRow, mode } = schema;

        const allStores = []; // 전국평균 산출용 (시트 내 모든 유효 매장)
        const stores = [];    // WM중부 화면 표시용 (서울 F, 경기 G, 강원 H)
        const branches = new Set();

        const INVALID_BRANCH_WORDS = new Set(['지점', '지점코드', '합계', '총계', '전체', '등급별', '지점별', '소계', '평균', '구분']);

        for (let r = dataStartRow; r < rows.length; r++) {
          const row = rows[r];
          if (!row) continue;
          const branch = row[branchCol] ? String(row[branchCol]).trim() : '';
          const code = row[codeCol] ? String(row[codeCol]).trim() : '';
          const name = row[nameCol] ? String(row[nameCol]).trim() : '';

          if (
            !branch || !code || !name ||
            INVALID_BRANCH_WORDS.has(branch) ||
            code.startsWith('#') ||
            code.includes('매장코드') || code.includes('점코드') ||
            name === '매장명' || name.includes('합계') || name.includes('소계')
          ) {
            continue;
          }

          const record = { branch, code, name, raw: row };
          allStores.push(record);

          if (TARGET_BRANCHES.has(branch)) {
            branches.add(branch);
            stores.push(record);
          }
        }

        const displayStores = stores.length > 0 ? stores : allStores;
        if (stores.length === 0) {
          allStores.forEach(s => branches.add(s.branch));
        }
        const hasNationwide = allStores.length > displayStores.length;

        parsedData = {
          summaryMeta,
          itemMeta,
          allStores,
          stores: displayStores,
          branches: Array.from(branches).sort(),
          hasNationwide,
          schemaMode: mode
        };
        
        const icon = document.getElementById('syncIcon');
        const text = document.getElementById('syncStatusText');
        icon.className = 'fa-solid fa-circle-check text-emerald-600';
        text.innerText = hasNationwide
          ? `기준일자: ${baseDate} | 중부 ${displayStores.length}개점 (전국 ${allStores.length}개점 비교 · ${mode})`
          : `기준일자: ${baseDate} | 중부 ${displayStores.length}개점 로드 완료 (${mode})`;
        text.className = 'text-xs text-emerald-700 mt-1 font-bold flex items-center gap-1.5';

        initControls();
        renderDashboard();
      } catch (err) {
        console.error('판매율 시트 파싱 오류:', err);
      }
    };

    function initControls() {
      const branchSelect = document.getElementById('branchSelect');
      branchSelect.innerHTML = `<option value="ALL">중부 전체 (${parsedData.stores.length}개 매장)</option>`;
      parsedData.branches.forEach(b => {
        const cnt = parsedData.stores.filter(s => s.branch === b).length;
        branchSelect.innerHTML += `<option value="${b}">${getBranchKor(b)} (${cnt}개)</option>`;
      });
      updateStoreDropdown();
    }

    function onBranchChange() {
      document.getElementById('storeSearchInput').value = '';
      updateStoreDropdown();
      renderDashboard();
    }

    function handleSearchInput() {
      updateStoreDropdown();
      const storeSelect = document.getElementById('storeSelect');
      storeSelect.selectedIndex = (document.getElementById('storeSearchInput').value.trim() !== '' && storeSelect.options.length > 1) ? 1 : 0;
      renderDashboard();
    }

    function updateStoreDropdown() {
      const branch = document.getElementById('branchSelect').value;
      const kw = document.getElementById('storeSearchInput').value.trim().toLowerCase();
      const storeSelect = document.getElementById('storeSelect');

      let filtered = parsedData.stores;
      if (branch !== 'ALL') filtered = filtered.filter(s => s.branch === branch);
      if (kw) filtered = filtered.filter(s => s.name.toLowerCase().includes(kw) || s.code.toLowerCase().includes(kw));

      const bKor = branch === 'ALL' ? '중부 전체' : getBranchKor(branch);
      storeSelect.innerHTML = `<option value="SUMMARY">👉 [${bKor}] 합계 보기 (${filtered.length}개)</option>`;
      filtered.forEach(s => {
        storeSelect.innerHTML += `<option value="${s.code}">[${BRANCH_MAP[s.branch] || s.branch}] ${s.name} (${s.code})</option>`;
      });

    function setSeason(season) {

      currentBrand = 'ALL';
      document.querySelectorAll('.season-tab').forEach(btn => {

    function setBrandFilter(b) {

    function getTarget() {
      const branch = document.getElementById('branchSelect').value;
      const storeCode = document.getElementById('storeSelect').value;
      const kw = document.getElementById('storeSearchInput').value.trim().toLowerCase();

      if (storeCode !== 'SUMMARY') {
        const found = parsedData.stores.find(s => s.code === storeCode);
        return {
          type: '개별매장',
          title: found ? found.name : storeCode,
          sub: found ? `매장코드: ${found.code} | 소속: ${getBranchKor(found.branch)}` : '',

          rows: found ? [found.raw] : []
        };
      } else {
        let list = parsedData.stores;
        if (branch !== 'ALL') list = list.filter(s => s.branch === branch);
        if (kw) list = list.filter(s => s.name.toLowerCase().includes(kw) || s.code.toLowerCase().includes(kw));
        return {
          type: branch === 'ALL' ? 'WM중부 전체' : '지점합계',
          title: branch === 'ALL' ? 'WM중부 전 지점 합계' : `${getBranchKor(branch)} 합계`,
          sub: `총 ${list.length}개 매장 합산`,
          branchCode: branch,
          rows: list.map(s => s.raw)
        };
      }
    }

    // 전국평균은 allStores 기준, 지점평균은 해당 지점(ALL 선택 시 중부 전체) 기준으로 정확히 분리 산출
    function calcAverages(seasonSummaryCols, seasonItems, branchCode) {
      const natBr = {}, brBr = {}, natIt = {}, brIt = {};
      const natPool = parsedData.allStores;
      const brPool = (branchCode && branchCode !== 'ALL')
        ? parsedData.allStores.filter(s => s.branch === branchCode)
        : parsedData.stores;

      seasonSummaryCols.forEach(m => {
        if (m.metric === '공급금액') {
          const cSale = seasonSummaryCols.find(x => x.brandCode === m.brandCode && x.season === m.season && x.metric === '판매금액');
          if (!cSale) return;
          let nSup = 0, nSal = 0, bSup = 0, bSal = 0;
          natPool.forEach(s => { nSup += parseNum(s.raw[m.col]); nSal += parseNum(s.raw[cSale.col]); });
          brPool.forEach(s => { bSup += parseNum(s.raw[m.col]); bSal += parseNum(s.raw[cSale.col]); });
          natBr[m.brandCode] = nSup > 0 ? (nSal / nSup) * 100 : 0;
          brBr[m.brandCode] = bSup > 0 ? (bSal / bSup) * 100 : 0;
        }
      });

      seasonItems.forEach(m => {
        let nOut = 0, nSal = 0, bOut = 0, bSal = 0;
        natPool.forEach(s => { nOut += parseNum(s.raw[m.colOut]); nSal += parseNum(s.raw[m.colSale]); });
        brPool.forEach(s => { bOut += parseNum(s.raw[m.colOut]); bSal += parseNum(s.raw[m.colSale]); });
        natIt[m.itemCode + '_' + m.brandCode] = nOut > 0 ? (nSal / nOut) * 100 : 0;
        brIt[m.itemCode + '_' + m.brandCode] = bOut > 0 ? (bSal / bOut) * 100 : 0;
      });
      return { natBr, brBr, natIt, brIt };
    }

    function renderDashboard() {
      if (!parsedData) return;

      const sSum = parsedData.summaryMeta.filter(m => m.season === currentSeason);

      const avgs = calcAverages(sSum, sItm, target.branchCode);

      // 비교 라벨 동적 보정
      const brAvgLabel = (target.branchCode && target.branchCode !== 'ALL') ? '지점평균' : '중부평균';

      document.getElementById('brAvgColHeader').innerText = brAvgLabel;

          .map(g => {
            const val = String(target.rows[0][g.col] ?? '').trim();
            return val && val !== '-' ? `${g.brandCode} ${val}` : null;
          })
          .filter(Boolean);
        gradeBannerText = gradeTokens.length > 0
          ? `${currentSeason} 등급: ${gradeTokens.join(' · ')}`

      const brands = [];

      // 파트 1: 브랜드 카드 렌더링

          <div class="p-4 flex flex-col justify-between rounded-xl border ${isTotal ? 'bg-[#18181B] text-white border-[#18181B] shadow-md sm:col-span-2 lg:col-span-1' : 'bg-white border-[#DFDDD4] shadow-sm'}">

              <div class="flex items-center justify-between mb-2">
                <span class="font-extrabold text-[13px] ${isTotal ? 'text-amber-400' : 'text-[#18181B]'}">${b.name}</span>
                ${grd !== '-' && grd !== '미입점' && !isTotal ? `<span class="text-[10.5px] px-1.5 py-0.5 rounded bg-amber-50 border border-amber-200 text-amber-700 font-extrabold">${grd}등급</span>` : ''}
                ${grd === '미입점' && !isTotal ? `<span class="text-[10.5px] px-1.5 py-0.5 rounded bg-zinc-100 text-zinc-400 font-bold">미입점</span>` : ''}
              </div>
              <div class="text-[22px] font-black tracking-tight ${isTotal ? 'text-white' : 'text-[#18181B]'} mb-3">${rate.toFixed(1)}%</div>
              <div class="bar-bg mb-4 ${isTotal ? 'bg-zinc-700' : ''}">
                <div class="bar-fill ${rate >= 20 ? 'bg-emerald-500' : rate >= 12 ? 'bg-amber-500' : 'bg-rose-500'}" style="width: ${Math.min(rate * 2.5, 100)}%"></div>
              </div>
            </div>
            <div class="space-y-1 text-[11px] pt-2 border-t ${isTotal ? 'border-zinc-700 text-zinc-400' : 'border-[#E6E4DD] text-zinc-500'}">
              <div class="flex justify-between"><span>${brAvgLabel}</span><span class="font-bold ${(avgs.brBr[b.code] || 0) <= rate ? 'text-emerald-500' : 'text-rose-400'}">${(avgs.brBr[b.code]||0).toFixed(1)}%</span></div>
              <div class="flex justify-between"><span>${natAvgLabel}</span><span class="font-bold ${(avgs.natBr[b.code] || 0) <= rate ? 'text-emerald-500' : 'text-rose-400'}">${(avgs.natBr[b.code]||0).toFixed(1)}%</span></div>
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('brandSummaryGrid').innerHTML = brandCardsHtml;

      // 브랜드 필터 버튼
      const itemBrands = [];
      sItm.forEach(m => { if (m.brandCode && !itemBrands.find(b => b.code === m.brandCode)) itemBrands.push({ code: m.brandCode, name: m.brandName }); });
      let filterBtnsHtml = `<button onclick="setBrandFilter('ALL')" class="px-3 py-1.5 rounded-lg text-[11px] font-extrabold transition ${currentBrand === 'ALL' ? 'bg-[#18181B] text-white shadow-sm' : 'bg-zinc-100 text-zinc-600 hover:bg-zinc-200'}">전체보기</button>`;
      itemBrands.forEach(b => {
        const act = currentBrand === b.code;
        filterBtnsHtml += `<button onclick="setBrandFilter('${b.code}')" class="px-3 py-1.5 rounded-lg text-[11px] font-extrabold transition ${act ? 'bg-amber-400 text-zinc-900 shadow-sm' : 'bg-zinc-100 text-zinc-600 hover:bg-zinc-200'}">${b.name}</button>`;
      });
      document.getElementById('brandFilterBtns').innerHTML = filterBtnsHtml;

      // 파트 2: 테이블 렌더링
      let fItm = currentBrand === 'ALL' ? sItm : sItm.filter(m => m.brandCode === currentBrand);
      let rData = fItm.map(m => {
        let outQ = 0, salQ = 0;
        target.rows.forEach(r => { outQ += parseNum(r[m.colOut]); salQ += parseNum(r[m.colSale]); });
        const rate = outQ > 0 ? (salQ / outQ) * 100 : 0;
        const key = m.itemCode + '_' + m.brandCode;
        return { ...m, outQ, salQ, stkQ: outQ - salQ, rate, brAvg: avgs.brIt[key]||0, natAvg: avgs.natIt[key]||0 };
      });

      const sort = document.getElementById('sortSelect').value;
      if (sort !== 'default') {
        const nrm = rData.filter(d => d.itemCode !== '합계');
        const tot = rData.filter(d => d.itemCode === '합계');
        if (sort === 'rate_desc') nrm.sort((a, b) => b.rate - a.rate);
        if (sort === 'sale_desc') nrm.sort((a, b) => b.salQ - a.salQ);
        if (sort === 'out_desc') nrm.sort((a, b) => b.outQ - a.outQ);
        rData = [...nrm, ...tot];
      }

      const tbodyHtml = rData.map(d => {
        const isTot = d.itemCode === '합계';
        const trCls = isTot ? 'bg-amber-50/50 font-extrabold text-[#18181B] border-t-2 border-amber-200' : 'hover:bg-zinc-50 font-medium text-zinc-800 transition-colors';
        const rateCol = d.rate >= 20 ? 'text-emerald-600 font-extrabold' : d.rate >= 12 ? 'text-amber-600 font-bold' : 'text-zinc-600';
        const barCol = d.rate >= 20 ? 'bg-emerald-500' : d.rate >= 12 ? 'bg-amber-500' : 'bg-zinc-400';

        return `
          <tr class="${trCls}">
            <td class="py-3 px-4">${d.brandName}</td>
            <td class="py-3 px-3 text-center text-xs font-mono text-zinc-400">${d.itemCode}</td>
            <td class="py-3 px-4 text-[13px]">${d.itemName}</td>
            <td class="py-3 px-3 text-right font-mono">${Math.round(d.outQ).toLocaleString()}</td>
            <td class="py-3 px-3 text-right font-mono text-blue-600 font-bold">${Math.round(d.salQ).toLocaleString()}</td>
            <td class="py-3 px-3 text-right font-mono text-zinc-400">${Math.round(d.stkQ).toLocaleString()}</td>
            <td class="py-3 px-4 text-right font-mono ${rateCol}">${d.rate.toFixed(1)}%</td>
            <td class="py-3 px-3 text-right font-mono text-zinc-500">${d.brAvg.toFixed(1)}%</td>
            <td class="py-3 px-3 text-right font-mono text-zinc-500">${d.natAvg.toFixed(1)}%</td>
            <td class="py-3 px-4 hidden sm:table-cell align-middle">
              <div class="bar-bg"><div class="bar-fill ${barCol}" style="width: ${Math.min(d.rate * 2, 100)}%"></div></div>
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('itemTableBody').innerHTML = tbodyHtml || '<tr><td colspan="10" class="py-10 text-center text-zinc-400 text-sm">해당 조건의 데이터가 없습니다.</td></tr>';
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadGoogleSheetData();
    });
  </script>
</body>
</html>
