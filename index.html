<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WM중부 통합 영업 포털</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #E7E5DF; color: #18181B; overflow: hidden; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .thin-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .thin-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .thin-scrollbar::-webkit-scrollbar-thumb { background: rgba(161, 161, 170, 0.35); border-radius: 99px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-view { animation: fadeUp 0.18s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-sheet { animation: sheetUp 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    iframe { border: none; width: 100%; height: 100%; display: block; background: #FFF; }
  </style>
</head>
<body class="bg-[#E7E5DF] h-screen w-screen flex justify-center items-center overflow-hidden">
  <div id="portalShell" class="w-full h-full bg-[#F7F6F2] flex flex-col lg:flex-row relative overflow-hidden">

    <!-- [1. Google OAuth Auth] -->
    <div id="authOverlay" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-white text-center">
      <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 font-black text-2xl mx-auto mb-5 shadow-lg tracking-tight">WM</div>
        <h2 class="text-xl font-extrabold">WM중부 통합 영업 포털</h2>
        <p class="text-xs text-slate-400 mt-2 mb-7 leading-relaxed">승인된 본사 Google 계정으로 로그인 후<br>이용 가능합니다.</p>
        <div id="googleBtnWrapper" class="flex justify-center w-full min-h-[44px]"></div>
        <p id="authErrorMsg" class="text-xs text-rose-400 font-semibold mt-4 hidden"></p>
      </div>
    </div>

    <!-- [2. PC 사이드바] -->
    <aside id="desktopSidebar" class="hidden lg:flex w-[250px] bg-[#18181B] text-white flex-col shrink-0 border-r border-zinc-800 select-none z-20 transition-all duration-300 ease-in-out">
      <div class="px-5 pt-5 pb-4 border-b border-zinc-800/90">
        <div onclick="goHome()" class="flex items-center gap-2.5 cursor-pointer group">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 text-zinc-950 font-black text-sm flex items-center justify-center shadow-md shrink-0 group-hover:scale-105 transition">WM</div>
          <div class="min-w-0">
            <div class="text-[14.5px] font-extrabold tracking-tight truncate">WM중부 통합 포털</div>
            <div class="text-[10px] font-semibold text-amber-400/90 tracking-wider truncate">SALES REPORT HUB</div>
          </div>
        </div>
      </div>
      <div class="px-3 pt-3.5 pb-2 space-y-2.5">
        <button id="sidebarHomeBtn" onclick="goHome()" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-extrabold bg-amber-400 text-zinc-950 transition">
          <span class="flex items-center gap-2.5"><i class="fa-solid fa-house text-xs w-4 text-center"></i><span>홈 대시보드</span></span>
          <span class="text-[9.5px] font-black px-1.5 py-0.5 rounded bg-zinc-950/15">HOME</span>
        </button>
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass text-zinc-500 text-[11px] absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="sidebarSearchInput" oninput="renderSide()" placeholder="메뉴 검색..." class="w-full bg-zinc-900 border border-zinc-800 focus:border-amber-400/60 rounded-xl pl-8 pr-3 py-2 text-xs text-zinc-200 focus:outline-none transition" />
        </div>
      </div>
      <div id="sidebarMenuGroups" class="flex-1 overflow-y-auto thin-scrollbar px-3 py-2 space-y-4"></div>
      <div class="p-3.5 border-t border-zinc-800/90 bg-zinc-900/60">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-8 h-8 rounded-full bg-zinc-800 text-amber-400 flex items-center justify-center text-xs font-black shrink-0"><i class="fa-solid fa-user-check"></i></div>
            <div class="min-w-0">
              <div id="sidebarUserEmail" class="text-[11px] text-zinc-300 font-medium truncate">-</div>
            </div>
          </div>
          <button onclick="handleLogout()" class="w-8 h-8 rounded-lg bg-zinc-800 hover:text-rose-400 text-zinc-400 flex items-center justify-center transition shrink-0"><i class="fa-solid fa-right-from-bracket text-xs"></i></button>
        </div>
      </div>
    </aside>

    <!-- [3. 우측 메인 영역] -->
    <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-[#F7F6F2] relative">
      
      <!-- [3-1. 플로팅 사이드바 토글 버튼] -->
      <button onclick="toggleDesktopSidebar()" id="desktopSidebarToggleBtn" class="hidden lg:flex absolute left-0 top-1/2 -translate-y-1/2 z-30 w-5 h-14 bg-white border border-l-0 border-[#E6E4DD] shadow-[2px_0_5px_rgba(0,0,0,0.05)] rounded-r-lg items-center justify-center text-zinc-400 hover:text-amber-500 hover:w-6 transition-all cursor-pointer">
        <i class="fa-solid fa-chevron-left text-[10px]" id="sidebarToggleIcon"></i>
      </button>

      <header class="bg-[#F7F6F2]/95 backdrop-blur-md px-4 lg:px-6 py-3 border-b border-[#E6E4DD] flex items-center justify-between gap-3 shrink-0 z-20">
        <div class="flex items-center gap-2.5 min-w-0">
          <button onclick="goHome()" class="lg:hidden bg-[#18181B] text-amber-400 font-black text-[10.5px] px-2.5 py-1 rounded-md shrink-0 transition">WM중부</button>
          <button id="mobileHomeBtn" onclick="goHome()" class="lg:hidden w-8 h-8 rounded-lg bg-white text-zinc-700 border border-[#E6E4DD] flex items-center justify-center transition shrink-0"><i class="fa-solid fa-house text-xs"></i></button>
          <h1 id="headerTitle" class="text-[15px] lg:text-[17px] font-extrabold tracking-tight truncate">WM중부 통합 영업 포털</h1>
          <span id="headerSubtitle" class="hidden sm:inline-block text-xs font-medium text-zinc-500 truncate">영업 리포트 허브</span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <div class="bg-[#E9E7E0] p-1 rounded-xl flex items-center gap-1 border border-[#DFDDD4]">
            <button id="btnModeSingle" onclick="setSplitMode(1)" class="px-3 py-1.5 rounded-lg text-xs font-extrabold bg-[#18181B] text-white flex items-center gap-1.5 transition"><i class="fa-regular fa-square text-[11px]"></i><span class="hidden sm:inline">1분할</span></button>
            <button id="btnModeSplit" onclick="setSplitMode(2)" class="px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-600 hover:text-[#18181B] flex items-center gap-1.5 transition"><i class="fa-solid fa-table-columns text-[11px]"></i><span class="hidden sm:inline">2분할</span></button>
          </div>
          <button onclick="toggleDrawer(true)" class="lg:hidden w-8 h-8 rounded-lg bg-[#18181B] text-white flex items-center justify-center text-xs"><i class="fa-solid fa-bars"></i></button>
        </div>
      </header>

      <!-- 홈 화면 -->
      <main id="homeView" class="flex-1 overflow-y-auto thin-scrollbar p-4 lg:p-6">
        <div class="max-w-6xl mx-auto space-y-4 pb-8">
          <div class="flex flex-wrap items-center justify-between gap-2 px-0.5">
            <div id="catPills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
            <span class="text-[11px] font-medium text-zinc-500">★ 즐겨찾기 상단 우선 배치</span>
          </div>
          <div id="bentoGrid" class="grid grid-cols-2 lg:grid-cols-3 gap-3 lg:gap-4"></div>
        </div>
      </main>

      <!-- 뷰어 화면 -->
      <section id="viewerView" class="hidden flex-1 flex flex-col min-h-0 bg-white">
        <div id="quickBar" class="bg-[#F7F6F2] border-b border-[#E6E4DD] px-4 py-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar shrink-0"></div>
        <div id="singleView" class="flex-1 flex flex-col min-h-0">
          <div id="singleBody" class="flex-1 relative bg-white overflow-hidden"></div>
        </div>
        <div id="splitView" class="hidden flex-1 min-h-0 grid gap-3 p-3 bg-[#E7E5DF]" style="grid-template-columns: repeat(2, minmax(0, 1fr));">
          <!-- 좌측/우측 동적 생성 대상 -->
        </div>
      </section>
    </div>

    <!-- 모바일 메뉴 드로어 -->
    <div id="drawer" class="hidden fixed inset-0 z-40 flex flex-col justify-end bg-zinc-950/45 backdrop-blur-[2px]" onclick="toggleDrawer(false)">
      <div class="bg-[#F7F6F2] rounded-t-3xl border-t max-h-[85%] flex flex-col shadow-2xl animate-sheet" onclick="event.stopPropagation()">
        <div class="pt-3 pb-1 flex justify-center shrink-0"><div class="w-10 h-1 rounded-full bg-zinc-300"></div></div>
        <div class="px-5 py-2 flex items-center justify-between shrink-0">
          <h3 class="text-[17px] font-extrabold">전체 메뉴 <span id="drawCount" class="ml-1 text-[11px] bg-amber-500/15 text-amber-800 px-2 py-0.5 rounded-full"></span></h3>
          <button onclick="toggleDrawer(false)" class="w-8 h-8 rounded-full bg-white border text-zinc-500 flex justify-center items-center"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="drawerList" class="flex-1 overflow-y-auto no-scrollbar px-5 pb-4 space-y-4"></div>
        <div class="px-5 py-3.5 bg-white border-t flex justify-between shrink-0">
          <div class="flex items-center gap-2"><div class="w-7 h-7 rounded-full bg-zinc-900 text-amber-400 flex justify-center items-center text-[11px]"><i class="fa-solid fa-user-check"></i></div><span id="drawerEmail" class="text-xs font-mono font-semibold text-zinc-600"></span></div>
          <button onclick="toggleDrawer(false); handleLogout();" class="px-3 py-1.5 rounded-lg bg-rose-50 text-rose-600 text-xs font-bold flex gap-1.5 items-center"><i class="fa-solid fa-right-from-bracket"></i><span>로그아웃</span></button>
        </div>
      </div>
    </div>

    <!-- 로그아웃 모달 -->
    <div id="logoutModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-zinc-950/50 backdrop-blur-[2px] p-5" onclick="$('logoutModal').classList.add('hidden')">
      <div class="w-full max-w-xs bg-white rounded-2xl p-5 shadow-2xl text-center animate-view" onclick="event.stopPropagation()">
        <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex justify-center items-center mx-auto mb-3"><i class="fa-solid fa-right-from-bracket"></i></div>
        <h3 class="text-[15px] font-extrabold">로그아웃 하시겠습니까?</h3>
        <div class="grid grid-cols-2 gap-2 mt-4">
          <button onclick="$('logoutModal').classList.add('hidden')" class="py-2 rounded-xl bg-[#F7F6F2] text-xs font-bold">취소</button>
          <button onclick="confirmLogout()" class="py-2 rounded-xl bg-[#18181B] text-white text-xs font-bold">로그아웃</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Config
    const CLIENT_ID = "663649865269-lbt4v2hn6li66v4ncjhu3pnnq5pt7vn2.apps.googleusercontent.com";
    const ALLOWED = [
      "gudwnqn109@gmail.com",
      "doowon0623@gmail.com",
      "ablejuno@gmail.com",
      "wmhhshin@gmail.com",
      "wktae0907@gmail.com",
      "dongha1247@gmail.com",
      "ansrod1199@gmail.com",
      "geacha111@gmail.com"
    ];
    const PIN_KEY = 'wm_portal_pinned_menus_v5';
    
    const MENU = [
      // 매출/실적
      { id: 'dashboard', title: '통합 대시보드', subtitle: '매장별 실시간 매출 및 상권 분석', url: './dashboard.html', cat: '매출/실적', badge: 'MAIN', icon: 'fa-solid fa-gauge-high', acc: 'amber' },
      { id: 'daily', title: '일일 매출장', subtitle: '당일·당월·연누계 실시간 마감 현황', url: './daily.html', cat: '매출/실적', badge: 'LIVE', icon: 'fa-solid fa-table-list', acc: 'amber' },
      { id: 'weekly', title: '주간 실적 리포트', subtitle: 'CFM 주간 매출·객수·브랜드별 분석', url: './weekly.html', cat: '매출/실적', badge: 'WEEKLY', icon: 'fa-solid fa-chart-simple', acc: 'blue' },
      { id: 'complex', title: '복합점 실적현황', subtitle: '복합 매장 브랜드별 상세 실적', url: './complex.html', cat: '매출/실적', badge: 'COMPLEX', icon: 'fa-solid fa-layer-group', acc: 'blue' },
      { id: 'season', title: '시즌별 매출장', subtitle: '봄·여름·가을·겨울·사계절 시즌별 매출 현황', url: './season.html', cat: '매출/실적', badge: 'SEASONAL', icon: 'fa-solid fa-calendar-days', acc: 'amber' },
      { id: 'restore', title: '점정비점 매출', subtitle: '점정비 유형별 변경 전·후 매출 추이 비교', url: './restore.html', cat: '매출/실적', badge: 'RENEWAL', icon: 'fa-solid fa-store', acc: 'amber' },

      // 시장/상품
      { id: 'competitor', title: '동업계 현황', subtitle: '상권 내 타브랜드 매출·순위 비교', url: './competitor.html', cat: '시장/상품', badge: 'MARKET', icon: 'fa-solid fa-chart-line', acc: 'indigo' },

      // 매장/재고
      { id: 'invest', title: '투자비 현황', subtitle: '매장별 보증·권리금 및 인테리어 분담', url: './investment.html', cat: '매장/재고', badge: 'ASSET', icon: 'fa-solid fa-building-columns', acc: 'indigo' },
      { id: 'sellthru_fw', title: 'FW 매장별 판매율', subtitle: '시즌 복종별 실시간 판매율 및 등급', url: './sellthru.html', cat: '매장/재고', badge: 'SEASON', icon: 'fa-solid fa-shirt', acc: 'amber' }
    ];
    
    const ACC = {
      amber:  { bg: 'bg-amber-500/15', txt: 'text-amber-700', bdg: 'bg-amber-500/10 text-amber-800 border-amber-500/20' },
      blue:   { bg: 'bg-blue-500/12', txt: 'text-blue-700', bdg: 'bg-blue-500/10 text-blue-700 border-blue-500/20' },
      indigo: { bg: 'bg-indigo-500/12', txt: 'text-indigo-700', bdg: 'bg-indigo-500/10 text-indigo-700 border-indigo-500/20' }
    };

    // State
    const $ = id => document.getElementById(id);
    
    let pins = ['dashboard', 'daily', 'sellthru_fw'], selCat = '전체', view = 'home', split = 1;
    let smId = 'dashboard', lmId = 'dashboard', rmId = 'daily';
    let user = null, isPrev = false;
    let isSidebarOpen = true;

    // Helpers
    const getM = id => MENU.find(m => m.id === id) || MENU[0];
    const isPin = id => pins.includes(id);
    const sortM = arr => [...arr].sort((a,b) => (pins.indexOf(a.id)>-1?-1:1) - (pins.indexOf(b.id)>-1?-1:1));
    const groupBy = arr => arr.reduce((acc, m) => ((acc[m.cat] = acc[m.cat] || []).push(m), acc), {});
    const toggleDrawer = show => $('drawer').classList[show?'remove':'add']('hidden');

    function togglePin(id, e) {
      if(e) e.stopPropagation();
      pins = isPin(id) ? pins.filter(x => x !== id) : [...pins, id];
      localStorage.setItem(PIN_KEY, JSON.stringify(pins));
      syncUI();
    }

    function toggleDesktopSidebar() {
      isSidebarOpen = !isSidebarOpen;
      const sidebar = $('desktopSidebar');
      const icon = $('sidebarToggleIcon');
      
      if(isSidebarOpen) {
        sidebar.classList.remove('-ml-[250px]');
        icon.classList.remove('fa-chevron-right');
        icon.classList.add('fa-chevron-left');
      } else {
        sidebar.classList.add('-ml-[250px]');
        icon.classList.remove('fa-chevron-left');
        icon.classList.add('fa-chevron-right');
      }
    }

    function syncUI() {
      renderSide(); renderHome(); renderQuick(); renderDrawer();
      if(split === 2) renderSplitPanes();
      updateHeader();
    }

    // UI Renders
    function updateHeader() {
      $('btnModeSingle').className = split===1 ? 'px-3 py-1.5 rounded-lg text-xs font-extrabold bg-[#18181B] text-white flex items-center gap-1.5 transition' : 'px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-600 flex items-center gap-1.5 transition';
      $('btnModeSplit').className = split===2 ? 'px-3 py-1.5 rounded-lg text-xs font-extrabold bg-[#18181B] text-amber-400 flex items-center gap-1.5 transition' : 'px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-600 flex items-center gap-1.5 transition';
      
      const homeBtn = $('sidebarHomeBtn');
      if (view === 'home') {
        homeBtn.className = 'w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-extrabold bg-amber-400 text-zinc-950 transition';
        $('headerTitle').innerText = 'WM중부 통합 영업 포털';
        const d = new Date();
        $('headerSubtitle').innerText = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
      } else {
        homeBtn.className = 'w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-300 transition';
        const m = getM(split===1 ? smId : lmId);
        $('headerTitle').innerText = split===1 ? m.title : `${getM(lmId).title} ⇄ ${getM(rmId).title}`;
        $('headerSubtitle').innerText = split===1 ? m.subtitle : '2분할 비교 모드';
      }
    }

    function renderSide() {
      const q = ($('sidebarSearchInput')?.value || '').trim().toLowerCase();
      const groups = groupBy(MENU.filter(m => !q || m.title.toLowerCase().includes(q) || m.cat.toLowerCase().includes(q)));
      
      $('sidebarMenuGroups').innerHTML = Object.entries(groups).map(([cat, items]) => `
        <div class="space-y-1"><div class="px-2.5 pb-0.5 text-[10.5px] font-bold text-zinc-500">${cat}</div>
          <div class="space-y-0.5">${sortM(items).map(m => {
            const act = view==='viewer' && (split===1 ? smId===m.id : (lmId===m.id||rmId===m.id));
            return `<div onclick="openM('${m.id}')" class="group flex justify-between px-3 py-2 rounded-xl cursor-pointer ${act?'bg-zinc-800/95 text-white font-bold ring-1 ring-amber-400':'text-zinc-400 hover:bg-zinc-900/80'}">
              <div class="flex items-center gap-2.5"><i class="${m.icon} text-xs w-4 text-center ${act?'text-amber-400':''}"></i><span class="text-xs">${m.title}</span></div>
              <button onclick="togglePin('${m.id}', event)" class="w-6 h-6 flex justify-center items-center ${isPin(m.id)?'text-amber-400':'opacity-0 group-hover:opacity-100'}"><i class="fa-solid fa-star text-[10px]"></i></button>
            </div>`;
          }).join('')}</div></div>
      `).join('');
    }

    function renderHome() {
      const cats = ['전체', ...new Set(MENU.map(m=>m.cat))];
      $('catPills').innerHTML = cats.map(c => {
        const act = selCat === c, cnt = c === '전체' ? MENU.length : MENU.filter(m=>m.cat===c).length;
        return `<button onclick="selCat='${c}'; renderHome()" class="px-3.5 py-1.5 rounded-full text-xs font-semibold ${act?'bg-[#18181B] text-white':'bg-white text-zinc-600 border'}"><span>${c}</span> <span class="${act?'text-amber-400':'text-zinc-400'}">${cnt}</span></button>`;
      }).join('');

      $('bentoGrid').innerHTML = sortM(selCat==='전체' ? MENU : MENU.filter(m=>m.cat===selCat)).map(m => `
        <article onclick="openM('${m.id}')" class="group bg-white border border-[#E6E4DD] hover:shadow-lg rounded-2xl p-4 lg:p-5 flex flex-col justify-between cursor-pointer active:scale-95 animate-view">
          <div class="flex justify-between items-start">
            <div class="w-10 h-10 rounded-xl ${ACC[m.acc].bg} ${ACC[m.acc].txt} flex justify-center items-center group-hover:scale-105 transition"><i class="${m.icon}"></i></div>
            <button onclick="togglePin('${m.id}', event)" class="text-xs p-1 ${isPin(m.id)?'text-amber-500':'text-zinc-300'}"><i class="fa-solid fa-star"></i></button>
          </div>
          <div class="mt-4">
            <div class="flex gap-1.5 items-center"><span class="text-[9px] font-extrabold border px-1.5 py-0.5 rounded ${ACC[m.acc].bdg}">${m.badge}</span><span class="text-[10px] text-zinc-400">${m.cat}</span></div>
            <h3 class="text-[15px] font-extrabold mt-1.5 truncate group-hover:text-amber-700">${m.title}</h3>
            <p class="text-[11px] text-zinc-500 truncate mt-1">${m.subtitle}</p>
          </div>
        </article>
      `).join('');
    }

    function renderQuick() {
      $('quickBar').innerHTML = sortM(MENU).map(m => `
        <button onclick="openM('${m.id}')" class="shrink-0 flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs transition ${m.id===smId?'bg-[#18181B] text-white font-bold':'bg-white text-zinc-600 border'}">
          <i class="${m.icon} text-[10px] ${m.id===smId?'text-amber-400':''}"></i><span>${m.title}</span>${isPin(m.id)&&m.id!==smId?'<i class="fa-solid fa-star text-[8px] text-amber-500"></i>':''}
        </button>`).join('');
    }

    function renderDrawer() {
      $('drawCount').innerText = `${MENU.length}개`;
      $('drawerList').innerHTML = Object.entries(groupBy(MENU)).map(([c, items]) => `
        <div class="space-y-1.5"><div class="flex justify-between px-1 text-[11px] text-zinc-500 font-bold"><span>${c}</span></div>
        <div class="bg-white border rounded-2xl divide-y overflow-hidden">${sortM(items).map(m => `
          <div onclick="openM('${m.id}')" class="px-3 py-3 flex justify-between cursor-pointer hover:bg-zinc-50">
            <div class="flex gap-3"><div class="w-9 h-9 rounded-xl flex justify-center items-center ${ACC[m.acc].bg} ${ACC[m.acc].txt}"><i class="${m.icon}"></i></div>
            <div><div class="flex gap-1.5"><span class="text-sm font-bold">${m.title}</span><span class="text-[9px] border px-1 rounded ${ACC[m.acc].bdg}">${m.badge}</span></div><p class="text-[11px] text-zinc-500">${m.subtitle}</p></div></div>
            <button onclick="togglePin('${m.id}', event)" class="${isPin(m.id)?'text-amber-500':'text-zinc-300'}"><i class="fa-solid fa-star text-[11px]"></i></button>
          </div>`).join('')}</div></div>
      `).join('');
    }

    // Split Pane Logic
    function getPaneHtml(side, mId) {
      const opts = MENU.map(m => `<option value="${m.id}" ${m.id===mId?'selected':''}>${m.title}</option>`).join('');
      return `
        <div class="flex flex-col bg-white rounded-2xl border shadow-sm h-full overflow-hidden animate-view">
          <div class="bg-[#18181B] text-white px-3 py-2 flex justify-between gap-2 shrink-0">
            <div class="flex gap-2 items-center flex-1"><span class="px-2 py-0.5 rounded text-[10px] font-black ${side==='L'?'bg-amber-400 text-black':'bg-zinc-700 text-amber-300'}">${side==='L'?'좌측':'우측'}</span>
            <select onchange="changeSplit('${side}', this.value)" class="flex-1 bg-zinc-800 text-xs font-bold px-2 py-1 rounded-lg border-zinc-700 text-white outline-none cursor-pointer">${opts}</select></div>
            <div class="flex gap-1"><button onclick="swapSplit()" class="w-7 h-7 bg-zinc-800 text-zinc-300 rounded-lg flex justify-center items-center"><i class="fa-solid fa-right-left"></i></button>
            <button onclick="smId='${mId}'; setSplitMode(1);" class="w-7 h-7 bg-zinc-800 text-zinc-300 rounded-lg flex justify-center items-center"><i class="fa-solid fa-expand"></i></button></div>
          </div>
          <div id="paneBody${side}" class="flex-1 relative bg-white overflow-hidden"></div>
        </div>`;
    }

    function renderSplitPanes() {
      $('splitView').innerHTML = getPaneHtml('L', lmId) + getPaneHtml('R', rmId);
      loadIframe('paneBodyL', lmId); loadIframe('paneBodyR', rmId);
    }
    function changeSplit(s, id) { s==='L' ? lmId=id : rmId=id; renderSplitPanes(); updateHeader(); renderSide(); }
    function swapSplit() { [lmId, rmId] = [rmId, lmId]; renderSplitPanes(); updateHeader(); }

    function loadIframe(containerId, mId) {
      const c = $(containerId); if(!c) return;
      c.innerHTML = `<div class="absolute inset-0 bg-white/80 flex flex-col justify-center items-center z-10 loader"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-zinc-600"></i></div>
                     <iframe src="${getM(mId).url}" onload="this.previousElementSibling.style.display='none'"></iframe>`;
    }

    // Navigation & Auth
    function setSplitMode(m) {
      split = m;
      if (view === 'home' && m === 2) openM(lmId);
      else if (view !== 'home') openM(split === 1 ? smId : lmId);
      else updateHeader();
    }

    function goHome() {
      view = 'home'; $('viewerView').classList.add('hidden'); $('homeView').classList.remove('hidden');
      window.location.hash = ''; syncUI();
    }

    function openM(id) {
      if(!user && !isPrev) return $('authOverlay').classList.remove('hidden');
      toggleDrawer(false); view = 'viewer';
      if(split === 1) { smId = lmId = id; window.location.hash = id; } 
      else { lmId = id; if(rmId===lmId) rmId = MENU.find(m=>m.id!==id)?.id; }
      
      $('homeView').classList.add('hidden'); $('viewerView').classList.remove('hidden');
      if(split === 1) { $('splitView').classList.add('hidden'); $('singleView').classList.remove('hidden'); loadIframe('singleBody', smId); }
      else { $('singleView').classList.add('hidden'); $('splitView').classList.remove('hidden'); renderSplitPanes(); }
      syncUI();
    }

    function handleAuth(res) {
      try {
        const payload = JSON.parse(atob(res.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        
        if(ALLOWED.includes(payload.email)) {
          user = { email: payload.email, name: payload.name };
          localStorage.setItem('wm_user', JSON.stringify(user));
          initPortal();
        } else $('authErrorMsg').innerHTML = `권한 없음 (${payload.email})`, $('authErrorMsg').classList.remove('hidden');
      } catch(e) {}
    }

    function initPortal() {
      $('authOverlay').classList.add('hidden');
      
      $('sidebarUserEmail').innerText = user?.email || '';
      $('drawerEmail').innerText = user?.email || '';
      
      const h = window.location.hash.replace('#','');
      h && MENU.some(m=>m.id===h) ? openM(h) : goHome();
    }

    function confirmLogout() { localStorage.removeItem('wm_user'); location.reload(); }
    function handleLogout() { $('logoutModal').classList.remove('hidden'); }

    window.addEventListener('hashchange', () => {
      if(!user && !isPrev) return;
      const h = window.location.hash.replace('#','');
      if (h && MENU.some(m=>m.id===h) && (view!=='viewer' || smId!==h)) { split=1; openM(h); }
      else if (!h && view !== 'home') goHome();
    });

    window.onload = () => {
      try { pins = (JSON.parse(localStorage.getItem(PIN_KEY)) || pins).filter(id => MENU.some(m => m.id === id)); } catch(e){}
      isPrev = (window.self !== window.top) || location.hostname.includes('localhost') || location.hostname === '127.0.0.1' || !location.hostname;
      if (isPrev) { user = { email: ALLOWED[0], name: '로컬 실행' }; initPortal(); }
      else {
        try { user = JSON.parse(localStorage.getItem('wm_user')); } catch(e){}
        if(user && ALLOWED.includes(user.email)) initPortal();
        else {
          $('authOverlay').classList.remove('hidden');
          let cnt = 0; const t = setInterval(() => {
            if(window.google?.accounts) {
              clearInterval(t);
              google.accounts.id.initialize({ client_id: CLIENT_ID, callback: handleAuth });
              google.accounts.id.renderButton($("googleBtnWrapper"), { theme: "filled_blue", size: "large", shape: "pill", width: 240 });
            } else if(++cnt > 50) { clearInterval(t); $("googleBtnWrapper").innerHTML='<p class="text-rose-400 text-xs">구글 로그인을 불러올 수 없습니다.</p>'; }
          }, 100);
        }
      }
      syncUI();
    };
  </script>
</body>
</html>
